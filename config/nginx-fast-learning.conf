# Include inside an existing HTTPS server block. Replace host/TLS settings there.
# /fast-learning/ is canonical: relative ./assets URLs depend on the trailing slash.
location = /fast-learning { return 308 /fast-learning/; }
location /fast-learning/ {
    proxy_pass http://127.0.0.1:3025/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 30m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
}
# Root deployment alternative: use the same proxy settings under location /.
# Do not point the public web root at the repository: .env/source/dumps are private.
