<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>المولد الذكي للاختبارات 🧠✨</title>

  <!-- ========================================================================= -->
  <!-- VOICE ENGINE LOCKDOWN: Permanently disable browser robotic synthesis.     -->
  <!-- AI Voice (Gemini / Vertex) ONLY. If unavailable, NO robotic voice plays.   -->
  <!-- ========================================================================= -->
  <script>
    (function enforceAiVoicePolicy() {
      try {
        if (typeof window !== 'undefined') {
          window.__VOICE_POLICY__ = 'AI_ONLY_NO_ROBOT';
          if ('speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch(e){}
            window.speechSynthesis.speak = function() {
              console.warn('[Voice Engine] Robotic machine voice permanently disabled. Only AI voice is permitted.');
              try { window.speechSynthesis.cancel(); } catch(e){}
            };
          }
          if (typeof window.SpeechSynthesisUtterance !== 'undefined') {
            const _OrigUtterance = window.SpeechSynthesisUtterance;
            window.SpeechSynthesisUtterance = function() {
              console.warn('[Voice Engine] SpeechSynthesisUtterance blocked.');
              return new _OrigUtterance('');
            };
          }
        }
      } catch(e){}
    })();
  </script>

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Apple Sign-in SDK -->
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/auth.js" async defer></script>
