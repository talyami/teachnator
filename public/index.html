          alert('تعذر تسجيل الدخول: ' + e.message);
        }
      };

      // دالة مريحة وشاملة لتشغيل الصوت الفصيح بكافة إعدادات Vertex AI و AI Studio مع حماية أسئلة الفراغ
      const speak = (input, force = false) => {
        let text = input;
        if (input && typeof input === 'object' && input.text) {
          text = getSpokenQuestionText(input);
        }
        if (!text) return;
        if (!force && !voiceEnabled) return;
        setSpeechState({ status: 'loading', text });
        return speakText(text, apiKey, force ? true : voiceEnabled, ttsModelName, provider, vertexConfig, ttsVoice);
      };

      // عنصر واجهة موحد لأيقونات السماعة يعكس الحالات الثلاث (Loading/Pulsing, Speaking/Grey, Idle/Active)
      const renderSpeakerButton = (input, extraClasses = "") => {
        let textToSpeak = input;
        if (input && typeof input === 'object' && input.text) {
          textToSpeak = getSpokenQuestionText(input);
        }
        const isThisLoading = speechState.status === 'loading' && (!textToSpeak || speechState.text === textToSpeak);
        const isThisSpeaking = speechState.status === 'speaking' && (!textToSpeak || speechState.text === textToSpeak);

        if (isThisLoading) {
          return (
            <button 
              type="button" 
              disabled
              className={`p-2 rounded-xl text-amber-500 bg-amber-50 border border-amber-200/80 flex-shrink-0 cursor-wait animate-pulse ${extraClasses}`}
              title="جاري تجهيز وتحميل النطق بالصوت الفصيح..."
            >
              <i className="fa-solid fa-spinner fa-spin text-sm"></i>
            </button>
          );
        }

        if (isThisSpeaking) {
          return (
            <button 
              type="button" 
              onClick={() => stopAllSpeech()} 
              className={`p-2 rounded-xl text-slate-400 bg-slate-100 flex-shrink-0 cursor-pointer opacity-70 hover:opacity-100 transition shadow-xs ${extraClasses}`}
              title="الصوت ينطق الآن (انقر للإيقاف الفوري)"
            >
              <i className="fa-solid fa-volume-high text-sm text-slate-400"></i>
            </button>
          );
        }

        return (
          <button 
            type="button" 
            onClick={() => speak(textToSpeak, true)} 
            className={`p-2 rounded-xl text-indigo-600 hover:bg-indigo-100/60 transition flex-shrink-0 cursor-pointer ${extraClasses}`}
            title="استمع للنطق بصوت تافي (Tavi)"
          >
            <i className="fa-solid fa-volume-high text-sm"></i>
          </button>
        );
      };

      // دالة التحميل المسبق الفوري لصوت السؤال التالي لضمان التصفير الكامل لأي تأخير
      const prefetch = (input) => {
        let text = input;
        if (input && typeof input === 'object' && input.text) {
          text = getSpokenQuestionText(input);
        }
        if (!text || !voiceEnabled) return;
        prefetchVoice(text, apiKey, voiceEnabled, ttsModelName, provider, vertexConfig, ttsVoice);
      };

      // صياغة إعلان النتيجة النهائية بلهجة سعودية بيضاء محببة ومحفزة (Saudi Narrator Style)
      const getFinishSpeechText = (name, finalScore, total, pct) => {
        const student = name || 'يا بطل';
        if (pct >= 85) {
          return `كفو والله يا ${student}! جبت ${finalScore} من ${total}! ما شاء الله تبارك الله عليك، إنجاز أسطوري وعلامة كاملة ترفع الرأس!`;
        } else if (pct >= 50) {
          return `كفو يا ${student}! أبدعت بنتيجة ${finalScore} من ${total}، خطوة بطل حقيقية نحو الإتقان!`;
        } else {
          return `يعطيك العافية يا ${student}! جبت ${finalScore} من ${total}. المراجعة تصنع الأبطال، وبيمديك تبدع أكثر!`;
        }
      };

      const [showSettings, setShowSettings] = useState(false);
      const [textInput, setTextInput] = useState('');
      const [uploadTab, setUploadTab] = useState('file'); // file | text
      
      // إدارة الملفات والصور المتعددة ودمجها في مادة واحدة (Multi-File & Multi-Image State)
      const [selectedFiles, setSelectedFiles] = useState([]); // [{ id, file, name, size, type, isImage, isPDF, isWord, previewUrl }]
      const [isProcessingFiles, setIsProcessingFiles] = useState(false);
      const [isDragging, setIsDragging] = useState(false);
      
      // حالات إدارة التحدي والذاكرة
      const [allOriginalQuestions, setAllOriginalQuestions] = useState([]);
      const [wrongQuestions, setWrongQuestions] = useState([]);
      const [showTimerEndModal, setShowTimerEndModal] = useState(false);
      const [showResetWarningModal, setShowResetWarningModal] = useState(false);
      
      const fileInputRef = useRef(null);

      // ربط نافذة الإبلاغ عن الأخطاء عالمياً
      useEffect(() => {
        window.__reportAppError = (type, message) => {
          setErrorAnnouncement({ type, message, timestamp: new Date() });
        };
        return () => { window.__reportAppError = null; };
      }, []);

      // إخفاء التنبيهات والإعلانات تلقائياً بعد 6 ثوانٍ لضمان عدم حجب الشاشة أو بقائها معلقة
      useEffect(() => {
        if (errorAnnouncement) {
          const timer = setTimeout(() => setErrorAnnouncement(null), 6000);
          return () => clearTimeout(timer);
        }
      }, [errorAnnouncement]);

      useEffect(() => {
        if (appAnnouncement) {
          const timer = setTimeout(() => setAppAnnouncement(null), 7000);
          return () => clearTimeout(timer);
        }
      }, [appAnnouncement]);

      // تنظيف وإلغاء أي تحديد مسبق وإعادة ضبط الاسترجاع النشط والتنبيه الصوتي الذاكرتي الخفي (TMR)
      // مع إخفاء الملاحظات والإنذارات تلقائياً عند الانتقال لسؤال أو مرحلة جديدة
      useEffect(() => {
        setSelectedAnswer(null);
        setIsAnswerChecked(false);
        setIsAnswerRevealed(false);
        setShowWhy(false);
        setFillBlankSelected(null);
        setErrorAnnouncement(null);
        setAppAnnouncement(null);
        if (document.activeElement && typeof document.activeElement.blur === 'function') {
          document.activeElement.blur();
        }
        // رنين التذكر الذاكرتي التوافقي (Targeted Memory Reactivation - TMR)
        if (soundEnabled && (mode === 'learn' || mode === 'quiz')) {
          const targetItem = mode === 'quiz' ? shuffledQuestions[currentIndex] : questionsData[currentIndex];
          if (targetItem) {
            playMemoryAnchor(targetItem.soundAnchorId || currentIndex);
          }
        }
      }, [currentIndex, mode]);

      // تحميل مسبق فوري في الخلفية لصوت السؤال القادم ولصوت النتيجة النهائية لتصفير زمن التأخير (Zero-Delay Voice Engine)
      useEffect(() => {
        if (mode === 'quiz') {
          if (shuffledQuestions[currentIndex + 1]) {
            prefetch(getSpokenQuestionText(shuffledQuestions[currentIndex + 1]));
          } else if (currentIndex === shuffledQuestions.length - 1 && shuffledQuestions.length > 0) {
            // نحن في السؤال الأخير من الاختبار! نقوم بالتحميل المسبق الفوري لصوت النتيجة للسيناريوهين الممكنين (إجابة صحيحة أو خاطئة)
            const totalQ = shuffledQuestions.length;
            const scoreWin = score + 1;
            const scoreSame = score;
            prefetch(getFinishSpeechText(playerName, scoreWin, totalQ, Math.round((scoreWin / totalQ) * 100)));
            prefetch(getFinishSpeechText(playerName, scoreSame, totalQ, Math.round((scoreSame / totalQ) * 100)));
          }
        } else if (mode === 'learn' && questionsData[currentIndex + 1]) {
          prefetch(getSpokenQuestionText(questionsData[currentIndex + 1]));
        }
      }, [currentIndex, mode, shuffledQuestions, questionsData, voiceEnabled, apiKey, provider, vertexConfig, ttsModelName, ttsVoice, score, playerName]);

      // استعادة الجلسة في حالة إعادة التحميل أو قلب شاشة الآيباد
      useEffect(() => {
        try {
          const savedState = sessionStorage.getItem('smartExamSession');
          if (savedState) {
            const parsed = JSON.parse(savedState);
            if (parsed.playerName) {
              setPlayerName(parsed.playerName);
              setMode(parsed.mode || 'setup');
              setQuestionsData((parsed.questionsData || []).map(normalizeQuestion).filter(Boolean));
              setAllOriginalQuestions((parsed.allOriginalQuestions || parsed.questionsData || []).map(normalizeQuestion).filter(Boolean));
              setCurrentIndex(parsed.currentIndex || 0);
              setScore(parsed.score || 0);
              setTimeLeft(parsed.timeLeft || 15 * 60);
              setTimerActive(parsed.timerActive || false);
              setGenerationStatus(parsed.generationStatus || 'drafting');
              if (parsed.mode === 'quiz' && parsed.shuffledQuestions) {
                setShuffledQuestions((parsed.shuffledQuestions || []).map(normalizeQuestion).filter(Boolean));
              }
              if (parsed.wrongQuestions) {
                setWrongQuestions((parsed.wrongQuestions || []).map(normalizeQuestion).filter(Boolean));
              }
            }
          }
        } catch (e) {}
        return () => stopAmbientMusic();
      }, []);

      // حفظ الجلسة المستمرة
      useEffect(() => {
        try {
          if (mode !== 'generating' && mode !== 'setup') {
            sessionStorage.setItem('smartExamSession', JSON.stringify({
              playerName, mode, questionsData, allOriginalQuestions, wrongQuestions, currentIndex, score, timeLeft, timerActive, generationStatus, shuffledQuestions
            }));
          }
        } catch (e) {}
      }, [playerName, mode, questionsData, allOriginalQuestions, wrongQuestions, currentIndex, score, timeLeft, timerActive, generationStatus, shuffledQuestions]);

      // جلب النماذج تلقائياً عند أول تشغيل إذا توفر المفتاح
      useEffect(() => {
        if (availableModels.length === 0 && (apiKey || vertexConfig.project)) {
          handleFetchLiveModels();
        }
      }, []);

      // المؤقت التنازلي للتعلم والاختبار مع التنبيه الفوري عند انتهائه
      useEffect(() => {
        let interval = null;
        if (timerActive && timeLeft > 0) {
          interval = setInterval(() => setTimeLeft(t => t - 1), 1000);
        } else if (timeLeft === 0 && timerActive) {
          setTimerActive(false);
          if (mode === 'quiz' || mode === 'learn') {
            setShowTimerEndModal(true);
          }
        }
        return () => clearInterval(interval);
      }, [timerActive, timeLeft, mode]);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const handleToggleMusic = () => {
        initAudio();
        if (musicEnabled) {
          stopAmbientMusic();
          setMusicEnabled(false);
        } else {
          startAmbientMusic(binauralMode);
          setMusicEnabled(true);
        }
      };

      const handleSwitchBinauralMode = (targetMode) => {
        initAudio();
        setBinauralMode(targetMode);
        localStorage.setItem('binaural_mode', targetMode);
        if (musicEnabled) {
          startAmbientMusic(targetMode);
        }
      };

      const handleToggleSound = () => {
        initAudio();
        const next = !soundEnabled;
        setSoundEnabled(next);
        if (!next) {
          stopAmbientMusic();
          stopAllSpeech();
        } else {
          setTimeout(playClick, 40);
        }
      };

      const handleToggleVoice = () => {
        const next = !voiceEnabled;
        setVoiceEnabled(next);
        localStorage.setItem('voice_narrator_enabled', next ? 'true' : 'false');
        if (!next) {
          stopAllSpeech();
        }
      };

      // جلب النماذج الحية (العقل والصوت) من المزود
      const handleFetchLiveModels = async () => {
        setIsFetchingModels(true);
        setModelsFetchError('');
        try {
          const result = await fetchDynamicModels(provider, apiKey, vertexConfig);
          setAvailableModels(result.brainModels);
          setAvailableTtsModels(result.ttsModels);
          localStorage.setItem('cached_models', JSON.stringify(result.brainModels));
          localStorage.setItem('cached_tts_models', JSON.stringify(result.ttsModels));
          if (!result.brainModels.includes(modelName) && result.brainModels.length > 0) {
            setModelName(result.brainModels[0]);
            localStorage.setItem('gemini_model', result.brainModels[0]);
          }
          if (!result.ttsModels.includes(ttsModelName) && result.ttsModels.length > 0) {
            setTtsModelName(result.ttsModels[0]);
            localStorage.setItem('gemini_tts_model', result.ttsModels[0]);
          }
        } catch (e) {
          console.error(e);
          setModelsFetchError(e.message || "فشل جلب النماذج");
          setErrorAnnouncement({ type: 'Models API Error', message: e.message || 'فشل جلب قائمة النماذج من Google API' });
        } finally {
          setIsFetchingModels(false);
        }
      };

      // فحص الاتصال بالنماذج (العقل + الصوت)
      const handleTestModelConnection = async () => {
        // قراءة القيم الحية مباشرة من حقول الإدخال لتجربة ما كتبه المستخدم فوراً
        const currentProject = (document.getElementById('vertex-project-input')?.value || vertexConfig.project || '').trim();
        const currentRegion = (document.getElementById('vertex-region-input')?.value || vertexConfig.region || 'global').trim();
        const currentVertexCred = (document.getElementById('vertex-key-input')?.value || vertexConfig.key || vertexConfig.token || '').trim();
        const currentApiKey = (document.getElementById('api-key-input')?.value || apiKey || '').trim();
        const currentModelName = document.getElementById('model-name-select')?.value || modelName;
        const currentTtsModel = document.getElementById('tts-model-name-select')?.value || ttsModelName;

        const activeVertexConfig = {
          project: currentProject,
          region: currentRegion,
          key: currentVertexCred,
          token: currentVertexCred
        };

        if (provider === 'gemini' && !currentApiKey) {
          setErrorAnnouncement({ type: 'Test Setup', message: 'يرجى إدخال مفتاح Gemini API أولاً لإجراء الفحص' });
          return;
        }

        if (provider === 'vertex' && (!currentProject || !currentVertexCred)) {
          setErrorAnnouncement({ type: 'Test Setup', message: 'يرجى إدخال Project ID ومفتاح API Key أو Token أولاً' });
          return;
        }

        if (provider === 'vertex' && currentVertexCred.startsWith('AIzaSy')) {
          const warnMsg = 'المفتاح المدخل (AIzaSy) مخصص لـ Google AI Studio فقط ولا يدعمه Vertex AI. يرجى استخدام مفتاح Vertex Express (يبدأ بـ AQ.) أو OAuth Token (يبدأ بـ ya29.).';
          setErrorAnnouncement({ type: 'Vertex Auth Warning', message: warnMsg });
        }

        setIsTestingConnection(true);
        const results = {
          testedAt: new Date().toLocaleTimeString('ar-SA'),
          brain: null,
          tts: null
        };

        // 1. اختبار نموذج العقل (Brain Model)
        const brainStart = performance.now();
        try {
          const { url, headers } = getApiConfig(provider, currentModelName, currentApiKey, activeVertexConfig);
          const testPayload = {
            contents: [{ role: "user", parts: [{ text: "أجب بكلمة واحدة: جاهز" }] }],
            generationConfig: { maxOutputTokens: 300, temperature: 0.1 }
          };
          const res = await fetch(url, {
            method: "POST",
            headers,
            body: JSON.stringify(testPayload)
          });
          const brainLatency = Math.round(performance.now() - brainStart);
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            const rawMsg = errData?.error?.message || `HTTP ${res.status}: ${res.statusText}`;

          const textResp = textPart?.text?.trim() || 'متصل';

                if (!res.ok) {

                const data = await res.json();

      const handleSaveSettings = (newProvider, newKey, newVertex, newModel, newTtsModel, newTtsVoice) => {

      // نافذة التحذير قبل مسح المادة ورفع ملف جديد
      const handleRequestNewMaterial = () => {

          setShowResetWarningModal(true);

        setAllOriginalQuestions([]);

      // إعادة دراسة المادة من البداية
      const handleStartOverStudy = () => {

      // إعادة الاختبار من البداية
      const handleStartOverQuiz = () => {
        if (soundEnabled) playClick();
        const source = questionsData.length > 0 ? questionsData : allOriginalQuestions;
        const shuffled = [...source].sort(() => Math.random() - 0.5);

      // معالجة البيانات وبدء خط التوليد الذكي
      const processMaterial = async (materialPayload) => {
        const token = localStorage.getItem('auth_token');
        const hasServerAi = localStorage.getItem('user_has_server_ai') === 'true';

        if (!hasServerAi) {
          if (provider === 'gemini' && !apiKey.trim()) {
            const msg = "يرجى إدخال مفتاح Gemini API أولاً من زر الإعدادات ⚙️، أو تسجيل الدخول إن كان حسابك مصرحاً له من المشرف.";
            setErrorMsg(msg);

          if (provider === 'vertex' && (!vertexConfig.project || (!vertexConfig.key && !vertexConfig.token))) {

            || (textInput ? textInput.trim().slice(0, 30) + '...' : null)

          setAppAnnouncement({

            message: `قام الذكاء الاصطناعي بتحليل المادة ودمج المرفقات وصياغة ${sanitized.length} سؤالاً تفاعلياً بمفاتيح حفظ سحرية.`,

          setErrorMsg(errorText);

          setMode('upload');
        }
      };

      // تنسيق حجم الملف للعرض البصري الجميل
      const formatFileSize = (bytes) => {
        if (!bytes || bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
      };

      // قراءة الملف بصيغة Base64
      const readFileAsBase64 = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const res = reader.result;
            const base64 = typeof res === 'string' ? res.split(',')[1] : '';
            resolve(base64);
          };
          reader.onerror = (err) => reject(err);
          reader.readAsDataURL(file);
        });
      };

      // تحسين أبعاد الصور الضخمة المأخوذة بكاميرا الهاتف/الآيباد لتسريع الرفع والتوليد
      const optimizeImageFile = async (file) => {
        if (!file.type.startsWith('image/')) return file;
        if (file.size < 2.5 * 1024 * 1024) return file;
        try {
          const bitmap = await createImageBitmap(file);
          const maxDimension = 1800;
          if (bitmap.width <= maxDimension && bitmap.height <= maxDimension) return file;
          let w = bitmap.width;
          let h = bitmap.height;
          if (w > h) {
            h = Math.round((h * maxDimension) / w);
            w = maxDimension;
          } else {
            w = Math.round((w * maxDimension) / h);
            h = maxDimension;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(bitmap, 0, 0, w, h);
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.88));
          if (blob) {
            return new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' });
          }
        } catch (e) {
          console.warn("Image optimization fallback:", e);
        }
        return file;
      };

      // معالجة اختيار ملفات وصور متعددة (تراكمية)
      const handleFilesSelected = (fileList) => {
        if (!fileList || fileList.length === 0) return;
        const newFiles = Array.from(fileList);
        const processed = newFiles.map(file => {
          const isImage = file.type.startsWith('image/') || /\.(jpg|jpeg|png|webp|gif|bmp|heic)$/i.test(file.name);
          const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
          const isWord = file.name.toLowerCase().endsWith('.docx') || file.type.includes('wordprocessingml');
          const previewUrl = isImage ? URL.createObjectURL(file) : null;
          return {
            id: Math.random().toString(36).substring(2, 9) + Date.now(),
            file,
            name: file.name,
            size: file.size,
            type: file.type || (isPDF ? 'application/pdf' : isImage ? 'image/jpeg' : ''),
            isImage,
            isPDF,
            isWord,
            previewUrl
          };
        }).filter(f => f.isImage || f.isPDF || f.isWord);

        if (processed.length === 0) {
          const err = "يرجى رفع ملفات بصيغ مدعومة: (صور JPG/PNG/WebP، ملفات PDF، أو مستندات Word .docx)";
          setErrorMsg(err);
          setErrorAnnouncement({ type: 'File Format Error', message: err });
          return;
        }

        setErrorMsg("");
        setSelectedFiles(prev => [...prev, ...processed]);
        if (soundEnabled) playClick();
      };

      // حذف ملف محدد من قائمة الملفات المختارة
      const handleRemoveFile = (idToRemove) => {
        setSelectedFiles(prev => {
          const target = prev.find(f => f.id === idToRemove);
          if (target && target.previewUrl) {
            URL.revokeObjectURL(target.previewUrl);
          }
          return prev.filter(f => f.id !== idToRemove);
        });
        if (soundEnabled) playClick();
      };

      // تفريغ كافة الملفات المحددة
      const handleClearAllFiles = () => {
        selectedFiles.forEach(f => {
          if (f.previewUrl) URL.revokeObjectURL(f.previewUrl);
        });
        setSelectedFiles([]);
        if (soundEnabled) playClick();
      };

      // دمج ومعالجة كافة الملفات والصور المختارة في مادة موحدة وبدء استخراج الأسئلة
      const handleProcessAllFiles = async () => {
        if (selectedFiles.length === 0) {
          const msg = "يرجى اختيار صورة أو ملف واحد على الأقل قبل بدء التوليد.";
          setErrorMsg(msg);
          setErrorAnnouncement({ type: 'Selection Required', message: msg });
          return;
        }

        setIsProcessingFiles(true);
        setErrorMsg("");
        if (soundEnabled) playClick();

        try {
          const items = [];
          for (let i = 0; i < selectedFiles.length; i++) {
            const item = selectedFiles[i];
            let f = item.file;

            if (item.isWord) {
              if (!window.mammoth) {
                throw new Error("جاري تحميل مكتبة قراءة ملفات Word، يرجى المحاولة بعد قليل.");
              }
              const arrayBuffer = await f.arrayBuffer();
              const result = await window.mammoth.extractRawText({ arrayBuffer });
              const extractedText = (result.value || '').trim();
              if (extractedText) {
                items.push({
                  type: 'text',
                  name: f.name || `مستند ${i + 1}`,
                  data: extractedText
                });
              }
            } else {

                              </div>
                            </div>

                              type="button"
                              onClick={handleMarkCardMastered}
                              className="flex-1 sm:flex-initial text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-black px-3.5 py-2 rounded-xl transition shadow-sm hover:shadow flex items-center justify-center gap-1.5 cursor-pointer"

                          setShowHint(true);
                          speak(questionsData[currentIndex].hint);

                        className="w-full py-3.5 bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-amber-950 font-black text-sm sm:text-base rounded-2xl transition flex justify-center items-center gap-2 shadow-md active:scale-95 shrink-0 cursor-pointer"

                        <i className="fa-solid fa-wand-magic-sparkles"></i> اضغط لاكتشاف السر السحري للحفظ! 🪄

                        setCurrentIndex(nextIdx);
                        setShowHint(false);
                        setIsAnswerRevealed(false);
                        setShowWhy(false);
                        speak(questionsData[nextIdx]?.text);

                          const nextIdx = Math.min(questionsData.length - 1, currentIndex + 1);

                          setShowHint(false);
                          setIsAnswerRevealed(false);
                          setShowWhy(false);
                          speak(questionsData[nextIdx]?.text);
                        }}

                      </button>

                          <i className="fa-solid fa-wand-magic text-[10px]"></i> إكمال الفراغ

                        <span className="bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-0.5 rounded-full text-xs font-bold flex items-center gap-1">

                        </span>

                    </div>
                  </div>

                    <div className="flex items-start justify-between gap-2">
                      <div className="flex-1">

                            <i className="fa-solid fa-wand-magic-sparkles"></i> سؤال مقالي قصير (تدقيق بالذكاء الاصطناعي مع تسامح التعبير والطباعة)

                      {renderSpeakerButton(shuffledQuestions[currentIndex])}
                    </div>
                  </div>

                        </span>
                        <p className="text-lg sm:text-xl font-black text-slate-800 leading-loose">
                          {(shuffledQuestions[currentIndex].clozeText || shuffledQuestions[currentIndex].text).split('[_____]').map((part, pIdx, arr) => (
                            <React.Fragment key={pIdx}>
                              <span>{part}</span>
                              {pIdx < arr.length - 1 && (
                                <span className={`inline-flex items-center justify-center px-4 py-1 mx-1.5 rounded-xl border-2 text-base font-black transition-all ${
                                  !isAnswerChecked 
                                    ? 'border-indigo-400 border-dashed bg-indigo-50/80 text-indigo-700 min-w-[110px] animate-pulse'
                                    : normalizeArabicText(fillBlankSelected) === normalizeArabicText(shuffledQuestions[currentIndex].missingWord || shuffledQuestions[currentIndex].expectedAnswer)
                                      ? 'border-emerald-500 bg-emerald-100 text-emerald-900 shadow-sm'
                                      : 'border-red-400 bg-red-100 text-red-900'
                                }`}>
                                  {fillBlankSelected || '... ؟ ...'}
                                </span>
                              )}
                            </React.Fragment>
                          ))}
                        </p>
                      </div>

                      {/* رقائق وبطاقات الكلمات للاختيار السريع والتوليد النشط */}

                          {shuffledQuestions[currentIndex].options.map((opt, i) => {
                            const isCorrectWord = normalizeArabicText(opt) === normalizeArabicText(shuffledQuestions[currentIndex].missingWord || shuffledQuestions[currentIndex].expectedAnswer);

                              chipStyle += "bg-white border-slate-200 text-slate-700 hover:border-indigo-400 hover:bg-indigo-50 active:scale-95";

                              if (isCorrectWord) {
                                chipStyle += "bg-emerald-50 border-emerald-500 text-emerald-800 scale-[1.02] shadow-md shadow-emerald-100";
                              } else if (opt === fillBlankSelected) {
                                chipStyle += "bg-red-50 border-red-500 text-red-700";
                              } else {
                                chipStyle += "bg-white border-slate-200 opacity-40 text-slate-400";
                              }

                            return (
                              <button
                                key={`fill-opt-${i}`}
                                type="button"
                                disabled={isAnswerChecked}
                                onClick={() => handleFillBlankClick(opt)}
                                className={chipStyle}
                              >
                                {opt}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>

                          btnStyle += "bg-white border-slate-200 text-slate-700 quiz-option-btn-idle active:bg-indigo-50 active:border-indigo-400 active:scale-[0.99]";

                          if (i === shuffledQuestions[currentIndex].correct) {
                            btnStyle += "bg-emerald-50 border-emerald-500 text-emerald-800 scale-[1.01] shadow-md shadow-emerald-100";
                          } else if (i === selectedAnswer) {
                            btnStyle += "bg-red-50 border-red-500 text-red-700";
                          } else {
                            btnStyle += "bg-white border-slate-200 opacity-40 text-slate-400";
                          }
                        }

                        const optClean = String(opt || '').trim();
                        const isTrueOpt = isYn && (optClean === 'صح' || optClean === 'نعم');
                        const isFalseOpt = isYn && (optClean === 'خطأ' || optClean === 'لا');

                        return (
                          <button 
                            key={`q-${currentIndex}-opt-${i}`}
                            type="button"
                            onClick={(e) => {
                              if (e.currentTarget && e.currentTarget.blur) e.currentTarget.blur();
                              handleAnswerClick(i);
                            }}
                            onTouchEnd={(e) => {
                              if (e.currentTarget && e.currentTarget.blur) e.currentTarget.blur();
                            }}
                            disabled={isAnswerChecked}
                            className={btnStyle}
                          >
                            <span className="inline-block w-7 font-black ml-1 text-slate-400">({getOptionLetter(i)})</span>
                            {isTrueOpt && <i className="fa-solid fa-check text-emerald-600 ml-1.5"></i>}
                            {isFalseOpt && <i className="fa-solid fa-xmark text-red-500 ml-1.5"></i>}
                            <span>{opt}</span>
                            {isAnswerChecked && i === shuffledQuestions[currentIndex].correct && (
                              <i className="fa-solid fa-circle-check text-emerald-500 float-left mt-1 text-lg"></i>

                              <i className="fa-solid fa-circle-xmark text-red-500 float-left mt-1 text-lg"></i>
                            )}
                          </button>
                        );
                      })}
                    </div>

                      {!isAnswerChecked ? (

                            </label>
                            <div className="relative">
                              <textarea
                                rows="3"
                                value={studentShortAnswer}
                                onChange={(e) => setStudentShortAnswer(e.target.value)}
                                placeholder="اكتب إجابتك هنا... (يراعي المصحح الذكي تفاوت التعبير، المرادفات، والأخطاء الإملائية) ✍️"
                                disabled={isEvaluatingShortAnswer}
                                className="w-full p-4 pl-20 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none text-base text-slate-800 font-semibold resize-none transition bg-white shadow-inner"
                                onKeyDown={(e) => {
                                  if (e.key === 'Enter' && !e.shiftKey) {
                                    e.preventDefault();
                                    if (!isEvaluatingShortAnswer && studentShortAnswer.trim()) {
                                      handleShortAnswerSubmit();
                                    }
                                  }
                                }}
                              />
                              <div className="absolute left-3 top-3 flex items-center gap-1.5">
                                <button
                                  type="button"
                                  onClick={toggleVoiceInput}
                                  className={`p-2 rounded-xl text-xs transition cursor-pointer ${
                                    isListeningSpeech ? 'bg-red-500 text-white animate-pulse' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
                                  }`}
                                  title={isListeningSpeech ? 'إيقاف الاستماع' : 'إملاء صوتي'}
                                >
                                  <i className={`fa-solid ${isListeningSpeech ? 'fa-microphone-lines' : 'fa-microphone'}`}></i>
                                </button>
                                {studentShortAnswer && !isEvaluatingShortAnswer && (
                                  <button
                                    type="button"
                                    onClick={() => setStudentShortAnswer('')}
                                    className="p-2 text-slate-400 hover:text-slate-600 rounded-xl hover:bg-slate-100 cursor-pointer"
                                    title="مسح النص"
                                  >
                                    <i className="fa-solid fa-xmark text-xs"></i>
                                  </button>
                                )}
                              </div>
                            </div>
                          </div>

                          <div className="flex items-center justify-between text-xs text-slate-400 font-bold px-1">
                            <span className="flex items-center gap-1 text-slate-500">
                              <i className="fa-solid fa-brain text-indigo-500"></i> مراجعة دلالية بالذكاء الاصطناعي (تسامح مع الأخطاء الطباعية)
                            </span>
                            <span>{studentShortAnswer.length} حرف</span>
                          </div>

                          <button
                            onClick={handleShortAnswerSubmit}
                            disabled={isEvaluatingShortAnswer || !studentShortAnswer.trim()}
                            className="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 disabled:opacity-50 text-white font-black py-3.5 px-6 rounded-2xl transition shadow-lg shadow-indigo-100 flex items-center justify-center gap-2 cursor-pointer text-base"
                          >
                            {isEvaluatingShortAnswer ? (
                              <>
                                <i className="fa-solid fa-spinner fa-spin"></i>
                                <span>جاري مراجعة وتحليل الإجابة بالذكاء الاصطناعي...</span>
                              </>
                            ) : (
                              <>
                                <i className="fa-solid fa-wand-magic-sparkles"></i>
                                <span>إرسال الإجابة للمراجعة الذكية بالـ AI</span>
                              </>
                            )}
                          </button>
                        </div>
                      ) : (
                        /* بطاقة نتيجة المراجعة الذكية للذكاء الاصطناعي */
                        <div className="space-y-3 animate-in fade-in zoom-in-95 duration-200">
                          <div className={`p-4 rounded-2xl border-2 text-right ${
                            shortAnswerEvaluation?.isCorrect 
                              ? 'bg-emerald-50 border-emerald-400 text-emerald-950 shadow-emerald-100'

                          } shadow-sm`}>
                            <div className="flex items-center justify-between mb-2">
                              <div className="flex items-center gap-2 font-black text-base">
                                {shortAnswerEvaluation?.isCorrect ? (
                                  <>
                                    <i className="fa-solid fa-circle-check text-emerald-500 text-xl"></i>
                                    <span>إجابة صحيحة ومقبولة دلالياً! 🌟</span>
                                  </>
                                ) : (
                                  <>
                                    <i className="fa-solid fa-circle-xmark text-rose-500 text-xl"></i>
                                    <span>تحتاج إلى تدقيق ومراجعة 💡</span>
                                  </>
                                )}
                              </div>
                              <span className="text-xs font-black px-2.5 py-1 rounded-full bg-white/90 border border-slate-200 text-slate-700 shadow-xs">
                                التطابق الدلالي: {shortAnswerEvaluation?.similarityScore || 0}%
                              </span>
                            </div>

                            {/* تعليق الذكاء الاصطناعي وتوضيحه للتسامح أو النقص */}
                            <div className="bg-white/95 p-3.5 rounded-xl border border-slate-200 mt-2 text-xs sm:text-sm leading-relaxed text-slate-800 font-semibold shadow-xs">
                              <div className="flex items-center gap-1.5 text-indigo-700 text-xs font-black mb-1">
                                <i className="fa-solid fa-robot"></i> تقييم وملاحظة الذكاء الاصطناعي:
                              </div>
                              <p>{shortAnswerEvaluation?.feedback}</p>
                            </div>

                            {/* الإجابة النموذجية المعتمدة */}
                            <div className="mt-2.5 bg-indigo-50/80 p-3 rounded-xl border border-indigo-200 text-xs sm:text-sm text-indigo-950 flex items-start justify-between gap-2">
                              <div className="flex-1">
                                <span className="font-black block text-indigo-700 text-xs mb-0.5">
                                  <i className="fa-solid fa-bullseye ml-1"></i> الإجابة النموذجية المعتمدة:
                                </span>
                                <span className="font-bold">{shuffledQuestions[currentIndex].expectedAnswer}</span>

                              {renderSpeakerButton(shuffledQuestions[currentIndex].expectedAnswer, 'text-indigo-600 hover:text-indigo-800')}

                              <div>
                                <span className="font-bold text-slate-700">إجابتك المدخلة: </span>
                                <span>"{studentShortAnswer}"</span>
                              </div>

                                <div className="text-indigo-700 pt-1 border-t border-slate-200/50">
                                  <span className="font-bold text-indigo-800">الصياغة السليمة المقترحة: </span>
                                  <span>"{shortAnswerEvaluation.revisedAnswer}"</span>
                                </div>
                              )}
                            </div>
                          </div>

                          <button
                            onClick={handleNextQuestion}
                            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-indigo-100 flex items-center justify-center gap-2 cursor-pointer text-sm"
                          >
                            {currentIndex < shuffledQuestions.length - 1 ? (
                              <>
                                <span>السؤال التالي</span>
                                <i className="fa-solid fa-chevron-left"></i>
                              </>
                            ) : (
                              <>
                                <span>عرض النتيجة النهائية 🏆</span>
                                <i className="fa-solid fa-trophy"></i>
                              </>
                            )}
                          </button>
                        </div>
                      )}
                    </div>
                  )}

                  {!isShortAnswerQuestion(shuffledQuestions[currentIndex]) && isAnswerChecked && (
                    <div className={`mt-4 p-3 rounded-xl text-center font-bold text-sm shrink-0 animate-in fade-in duration-200 ${
                      selectedAnswer === shuffledQuestions[currentIndex].correct || (isFillBlankQuestion(shuffledQuestions[currentIndex]) && normalizeArabicText(fillBlankSelected) === normalizeArabicText(shuffledQuestions[currentIndex].missingWord || shuffledQuestions[currentIndex].expectedAnswer))
                        ? 'bg-emerald-100 text-emerald-800' 
                        : 'bg-red-100 text-red-800'
                    }`}>
                      {(selectedAnswer === shuffledQuestions[currentIndex].correct || (isFillBlankQuestion(shuffledQuestions[currentIndex]) && normalizeArabicText(fillBlankSelected) === normalizeArabicText(shuffledQuestions[currentIndex].missingWord || shuffledQuestions[currentIndex].expectedAnswer)))
                        ? (consecutiveStreak >= 2 ? `🔥 سلسلة إتقان متتالية x${consecutiveStreak}! الذاكرة في قمتها!` : 'إجابة عبقرية يا بطل! 🎉')
                        : 'لا بأس، تذكر مفتاح الحفظ! 💡'}
                    </div>
                  )}
                </div>
              )}

              {/* 7. RESULT MODE */}
              {mode === 'result' && (
                <div className="text-center space-y-6 my-auto">
                  <div className="w-24 h-24 bg-gradient-to-tr from-yellow-400 to-amber-500 text-white rounded-3xl flex items-center justify-center mx-auto shadow-xl shadow-amber-100 floating-card">
                    <i className="fa-solid fa-trophy text-4xl"></i>
                  </div>

                      {renderSpeakerButton(getFinishSpeechText(playerName, score, shuffledQuestions.length || questionsData.length, Math.round((score / Math.max(shuffledQuestions.length || questionsData.length, 1)) * 100)), 'scale-90')}

                    <div className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 my-3">

                    <p className="text-slate-500 text-sm">
                      نسبتك: {Math.round((score / Math.max(shuffledQuestions.length || questionsData.length, 1)) * 100)}%
                    </p>
                  </div>

                  <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 max-w-sm mx-auto text-right space-y-2 shadow-xs">
                    <div className="flex items-center justify-between text-xs font-bold text-slate-700">
                      <span className="flex items-center gap-1.5">
                        <i className="fa-solid fa-brain text-purple-600"></i> مؤشر التثبيت في الذاكرة الدائمة:
                      </span>
                      <span className="text-emerald-700 font-black">{Math.round((score / Math.max(shuffledQuestions.length || questionsData.length, 1)) * 100)}%</span>
                    </div>
                    <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                      <div 
                        className="bg-gradient-to-r from-emerald-500 via-teal-500 to-indigo-600 h-full rounded-full transition-all duration-1000"
                        style={{ width: `${Math.round((score / Math.max(shuffledQuestions.length || questionsData.length, 1)) * 100)}%` }}
                      ></div>
                    </div>
                    <p className="text-[11px] text-slate-500 leading-relaxed">
                      {score === (shuffledQuestions.length || questionsData.length)
                        ? "🏆 تم ترسيخ كافة المفاهيم في مسارات الذاكرة الدائمة بنجاح مبهر!"
                        : "💡 مراجعة الأسئلة الخاطئة تعيد تنشيط المسار العصبي وتغلق فجوة النسيان تماماً."}
                    </p>
                  </div>

                  <div className="space-y-2.5 max-w-sm mx-auto pt-2">
                    {/* مراجعة وإعادة دراسة الأخطاء فقط إذا وُجدت */}
                    {wrongQuestions.length > 0 && (
                      <div className="space-y-2 p-3 bg-amber-50 rounded-2xl border border-amber-200 text-right">
                        <p className="text-xs font-black text-amber-800 flex items-center gap-1.5">
                          <i className="fa-solid fa-triangle-exclamation"></i>
                          لديك {wrongQuestions.length} سؤال بحاجة لتثبيت الذاكرة:
                        </p>
                        <div className="grid grid-cols-2 gap-2">
                          <button 
                            onClick={() => {
                              setQuestionsData(wrongQuestions);
                              setCurrentIndex(0);
                              setShowHint(false);
                              if (timeLeft <= 0) setTimeLeft(15 * 60);
                              setTimerActive(true);
                              setMode('learn');
                              if (soundEnabled) playClick();
                              speak(getSpokenQuestionText(wrongQuestions[0]));
                            }}
                            className="bg-amber-500 hover:bg-amber-600 text-white py-2.5 px-3 rounded-xl font-bold text-xs transition shadow-sm cursor-pointer"
                          >
                            <i className="fa-solid fa-book-open ml-1"></i> مراجعة أخطائي فقط
                          </button>
                          <button 
                            onClick={() => {
                              setQuestionsData(wrongQuestions);
                              const reshuffled = [...wrongQuestions].sort(() => Math.random() - 0.5);
                              setShuffledQuestions(reshuffled);
                              setCurrentIndex(0);
                              setScore(0);
                              setSelectedAnswer(null);
                              setStudentShortAnswer('');
                              setShortAnswerEvaluation(null);
                              setIsEvaluatingShortAnswer(false);
                              setIsAnswerChecked(false);
                              setTimeLeft(15 * 60);
                              setTimerActive(true);
                              setWrongQuestions([]);
                              setMode('quiz');
                              if (soundEnabled) playClick();
                              speak(getSpokenQuestionText(reshuffled[0]));
                            }}
                            className="bg-rose-500 hover:bg-rose-600 text-white py-2.5 px-3 rounded-xl font-bold text-xs transition shadow-sm cursor-pointer"
                          >
                            <i className="fa-solid fa-bolt ml-1"></i> اختبار الأخطاء فقط
                          </button>
                        </div>
                      </div>
                    )}

                    <button 
                      onClick={() => {
                        const full = allOriginalQuestions.length ? allOriginalQuestions : questionsData;
                        setQuestionsData(full);
                        setCurrentIndex(0);
                        setShowHint(false);
                        if (timeLeft <= 0) setTimeLeft(15 * 60);
                        setTimerActive(true);
                        setMode('learn');
                        if (soundEnabled) playClick();
                        speak(getSpokenQuestionText(full[0]));
                      }} 
                      className="w-full flex items-center justify-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-3.5 rounded-2xl font-bold transition text-sm cursor-pointer"
                    >
                      <i className="fa-solid fa-key text-amber-500"></i> إعادة دراسة كل شيء ({allOriginalQuestions.length || questionsData.length} أسئلة)
                    </button>

                    <div className="flex gap-2">
                      <button 
                        onClick={() => {
                          const full = allOriginalQuestions.length ? allOriginalQuestions : questionsData;
                          setQuestionsData(full);
                          const reshuffled = [...full].sort(() => Math.random() - 0.5);
                          setShuffledQuestions(reshuffled);
                          setCurrentIndex(0);
                          setScore(0);
                          setSelectedAnswer(null);
                          setStudentShortAnswer('');
                          setShortAnswerEvaluation(null);
                          setIsEvaluatingShortAnswer(false);
                          setIsAnswerChecked(false);
                          setTimeLeft(15 * 60);
                          setTimerActive(true);
                          setWrongQuestions([]);
                          setMode('quiz');
                          if (soundEnabled) playClick();
                          speak(getSpokenQuestionText(reshuffled[0]));
                        }} 
                        className="flex-1 flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-2xl font-bold transition shadow-md shadow-emerald-100 text-sm cursor-pointer"
                      >
                        <i className="fa-solid fa-rotate-right"></i> إعادة الاختبار بالكامل
                      </button>
                      <button 
                        onClick={handleRequestNewMaterial} 
                        className="px-5 bg-slate-800 hover:bg-slate-900 text-white py-3.5 rounded-2xl font-bold transition cursor-pointer" 
                        title="رفع درس جديد"
                      >
                        <i className="fa-solid fa-cloud-arrow-up"></i>
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </div>

          {/* Footer بسيط */}
          <footer className="mt-4 text-center text-xs text-slate-400 font-medium">
            المولد الذكي للاختبارات &bull; مدعوم بتقنيات الذكاء الاصطناعي وعلم الذاكرة (Mnemonics)
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
