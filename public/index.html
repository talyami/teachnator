  <script>
    (function enforceAiVoicePolicy() {
      try {
        if (typeof window !== 'undefined') {
          window.__VOICE_POLICY__ = 'AI_ONLY_NO_ROBOT';
          if ('speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch(e){}
            window.speechSynthesis.speak = function() {
              console.warn('[Voice Engine] Robotic machine voice permanently disabled. Only AI voice is permitted.');
              try { window.speechSynthesis.cancel(); } catch(e){}
            };
          }
          if (typeof window.SpeechSynthesisUtterance !== 'undefined') {
            const _OrigUtterance = window.SpeechSynthesisUtterance;
            window.SpeechSynthesisUtterance = function() {
              console.warn('[Voice Engine] SpeechSynthesisUtterance blocked.');
              return new _OrigUtterance('');
            };
          }
        }
      } catch(e){}
    })();
  </script>

<body class="selection:bg-indigo-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // === محرك المؤثرات الصوتية والموسيقى العصبية التوليدية (Neuro-Acoustic Engine - Web Audio API) ===
    let audioCtx = null;
    let mainGain = null;
    let bgOscillators = [];
    let bgNoiseNode = null;
    let melodyTimer = null;
    let nextNoteTime = 0;
    let activeBinauralType = 'gamma'; // 'gamma' (40Hz) | 'alpha' (10Hz)

    const initAudio = () => {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn("Audio init warning:", e);
      }
    };

    const playTone = (freq, type, duration, vol = 0.1) => {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    };

    const playClick = () => playTone(600, 'sine', 0.08, 0.05);
    
    // نغمة كشف البطاقة (Card Flip & Reveal Tone)
    const playFlipTone = () => {
      if (!audioCtx) return;
      try {
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(580, t + 0.12);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
      } catch(e){}
    };

    // نغمة السحر والوميض لمفتاح الحفظ (Mnemonic Magic Sparkle)
    const playSparkleTone = () => {
      if (!audioCtx) return;
      try {
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((f, i) => {
          setTimeout(() => playTone(f, 'sine', 0.18, 0.06), i * 55);
        });
      } catch(e){}
    };

    // نغمة التثبيت الدائم في الذاكرة (Memory Mastered Level-Up)
    const playMasteredTone = () => {
      if (!audioCtx) return;
      try {
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((f, i) => {
          setTimeout(() => playTone(f, 'triangle', 0.25, 0.09), i * 90);
        });
      } catch(e){}
    };

    // نغمة سلاسل الإتقان المتتالية (Streak Multiplier Chime)
    const playStreakTone = (streakCount = 2) => {
      if (!audioCtx) return;
      try {
        const base = 440 + Math.min(streakCount * 60, 400);
        playTone(base, 'triangle', 0.12, 0.1);
        setTimeout(() => playTone(base * 1.25, 'triangle', 0.15, 0.12), 80);
        setTimeout(() => playTone(base * 1.5, 'sine', 0.3, 0.15), 160);
      } catch(e){}
    };

    // نغمة الرنين الذاكرتي التوافقي (Targeted Memory Reactivation - TMR Acoustic Anchor)
    // نغمات خماسية عذبة ترتبط بكل سؤال لا شعورياً وتُعاد برقة أثناء الاختبار لتحفيز التذكر الفوري
    const memoryChords = [
      [261.63, 392.00], // C4 - G4
      [293.66, 440.00], // D4 - A4
      [329.63, 493.88], // E4 - B4
      [349.23, 523.25], // F4 - C5
      [392.00, 587.33]  // G4 - D5
    ];
    const playMemoryAnchor = (seedIndex = 0) => {
      if (!audioCtx) return;
      try {
        const chord = memoryChords[Math.abs(seedIndex) % memoryChords.length];
        const t = audioCtx.currentTime;
        chord.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.045, t + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0005, t + 1.2 + idx * 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 1.5);
        });
      } catch(e){}
    };

    const playCorrect = () => {
      playTone(523.25, 'sine', 0.1, 0.12);
      setTimeout(() => playTone(659.25, 'sine', 0.1, 0.12), 100);
      setTimeout(() => playTone(783.99, 'sine', 0.3, 0.15), 200);
    };
    const playWrong = () => {
      playTone(300, 'triangle', 0.15, 0.12);
      setTimeout(() => playTone(240, 'triangle', 0.25, 0.12), 120);
    };
    const playWin = () => {
      playTone(523.25, 'triangle', 0.18, 0.12);
      setTimeout(() => playTone(659.25, 'triangle', 0.18, 0.12), 180);
      setTimeout(() => playTone(783.99, 'triangle', 0.18, 0.12), 360);
      setTimeout(() => playTone(1046.50, 'triangle', 0.5, 0.18), 540);
    };

    // توليد ضوضاء وردية ناعمة لعزل الضوضاء المحيطة وتصفية الذهن (Soothing Pink Noise Floor)
    const createPinkNoiseBuffer = (ctx) => {
      const bufferSize = ctx.sampleRate * 2;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.08;
        b6 = white * 0.115926;
      }
      return buffer;
    };

    // موسيقى التركيز العلمي: موجات غاما (40Hz Gamma Focus) وموجات ألفا (10Hz Alpha Flow) مع الضوضاء الوردية المهدئة
    const startAmbientMusic = (mode = 'gamma') => {
      initAudio();
      if (!audioCtx) return;
      if (mainGain) stopAmbientMusic();
      activeBinauralType = mode;
      try {
        mainGain = audioCtx.createGain();
        mainGain.gain.value = 0.22;
        mainGain.connect(audioCtx.destination);

        const delayNode = audioCtx.createDelay();
        delayNode.delayTime.value = 0.8;
        const delayFeedback = audioCtx.createGain();
        delayFeedback.gain.value = 0.38;
        delayNode.connect(delayFeedback);
        delayFeedback.connect(delayNode);
        delayNode.connect(mainGain);

        const createLayer = (freq, panValue, type, vol, useDelay = false) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          let panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : audioCtx.createGain();
          if (panner.pan) panner.pan.value = panValue;
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.value = vol;
          osc.connect(gain);
          gain.connect(panner);
          panner.connect(mainGain);
          if (useDelay) panner.connect(delayNode);
          osc.start();
          bgOscillators.push(osc);
          return osc;
        };

        if (mode === 'gamma') {
          // موجات غاما 40Hz: أثبتت الأبحاث دورها في الربط العصبي (Feature Binding) وتثبيت الذاكرة وسرعة المعالجة
          // الأذن اليسرى 200Hz والأذن اليمنى 240Hz (فارق 40Hz دقيق)
          createLayer(200.0, -0.9, 'sine', 0.28);
          createLayer(240.0, 0.9, 'sine', 0.28);
          createLayer(100.0, 0.0, 'triangle', 0.14);
        } else {
          // موجات ألفا 10Hz: للاسترخاء والتدفق الذهني الخالي من التوتر
          // الأذن اليسرى 261.63Hz والأذن اليمنى 271.63Hz (فارق 10Hz)
          createLayer(261.63, -0.9, 'sine', 0.30);
          createLayer(271.63, 0.9, 'sine', 0.30);
          createLayer(130.81, -0.3, 'triangle', 0.16);
        }

        // تشغيل عازل الضوضاء الوردية الناعمة (Pink Noise Floor) بدرجة مسموعة ومريحة (مثل صوت المطر الهادئ)
        try {
          const noiseBuffer = createPinkNoiseBuffer(audioCtx);
          bgNoiseNode = audioCtx.createBufferSource();
          bgNoiseNode.buffer = noiseBuffer;
          bgNoiseNode.loop = true;
          const noiseFilter = audioCtx.createBiquadFilter();
          noiseFilter.type = 'lowpass';
          noiseFilter.frequency.value = 550; // تردد دافئ ومريح
          bgNoiseGainNode = audioCtx.createGain();
          const currentNoiseVol = parseFloat(localStorage.getItem('pink_noise_volume') || '0.08');
          const isNoiseEnabled = localStorage.getItem('pink_noise_enabled') !== 'false';
          bgNoiseGainNode.gain.value = isNoiseEnabled ? currentNoiseVol : 0;
          bgNoiseNode.connect(noiseFilter);
          noiseFilter.connect(bgNoiseGainNode);
          bgNoiseGainNode.connect(mainGain);
          bgNoiseNode.start();
        } catch(noiseErr) {
          console.warn("Pink noise init skipped:", noiseErr);
        }

        // ألحان تأملية خماسية لطيفة متباعدة
        const scale = mode === 'gamma' 
          ? [261.63, 329.63, 392.00, 523.25, 659.25] // نغمات مشرقة
          : [220.00, 261.63, 293.66, 329.63, 440.00]; // نغمات هادئة
        nextNoteTime = audioCtx.currentTime + 0.8;

        const scheduleMelody = () => {
          if (!mainGain || !audioCtx) return;
          while (nextNoteTime < audioCtx.currentTime + 0.15) {
            const freq = scale[Math.floor(Math.random() * scale.length)];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, nextNoteTime);
            gain.gain.linearRampToValueAtTime(0.16, nextNoteTime + 0.4);
            gain.gain.exponentialRampToValueAtTime(0.001, nextNoteTime + 4.2);
            osc.connect(gain);
            gain.connect(mainGain);
            gain.connect(delayNode);
            osc.start(nextNoteTime);
            osc.stop(nextNoteTime + 4.2);
            nextNoteTime += 2.0 + Math.random() * 2.5;
          }
          melodyTimer = setTimeout(scheduleMelody, 120);
        };
        scheduleMelody();
      } catch (e) {
        console.warn("Ambient music error:", e);
      }
    };

    const stopAmbientMusic = () => {
      try {
        bgOscillators.forEach(osc => { try { osc.stop(); } catch(e){} });
        bgOscillators = [];
        if (bgNoiseNode) {
          try { bgNoiseNode.stop(); } catch(e){}
          bgNoiseNode = null;
        }
        bgNoiseGainNode = null;
        if (melodyTimer) clearTimeout(melodyTimer);
        if (mainGain) { mainGain.disconnect(); mainGain = null; }
      } catch (e) {}
    };

    // إطلاق الاحتفالات
    const triggerConfetti = () => {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 50,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#3b82f6']
        });
      }
    };

    // مسار الـ API المرن (يدعم العمل المباشر أو داخل مسار فرعي كـ /fast-learning/)
    const getApiUrl = (endpoint) => {
      const isSubpath = window.location.pathname.includes('/fast-learning');
      const base = isSubpath ? '/fast-learning/api' : '/api';
      const clean = endpoint.startsWith('/api') ? endpoint.substring(4) : (endpoint.startsWith('/') ? endpoint : '/' + endpoint);
      return base + (clean.startsWith('/') ? clean : '/' + clean);
    };

    // طلبات API مع إعادة المحاولة
    const fetchWithRetry = async (url, options, retries = 4) => {
      let delay = 1000;
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) {
            const errorBody = await response.text();
            throw new Error(`HTTP ${response.status}: ${errorBody}`);
          }
          return await response.json();
        } catch (error) {
          if (i === retries - 1) throw error;
          await new Promise(res => setTimeout(res, delay));
          delay *= 2;
        }
      }
    };

    // وسيط طلبات الذكاء الاصطناعي مع دعم مفتاح السيرفر السري للمشرف والصلاحيات
    const requestAiCompletion = async ({ provider, modelName, apiKey, vertexConfig, payload }) => {
      const token = localStorage.getItem('auth_token');
      const hasServerAi = localStorage.getItem('user_has_server_ai') === 'true';

      // 1. إذا توفر توكن جلسة وكان الحساب يمتلك صلاحية السيرفر أو لم يدخل مفتاحاً شخصياً
      if (token && (hasServerAi || !apiKey)) {
        try {
          const res = await fetch(getApiUrl('/ai/generate'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              modelName,
              payload,
              provider,
              personalApiKey: apiKey,
              personalVertexConfig: vertexConfig
            })
          });
          const json = await res.json();
          if (!res.ok) {
            throw new Error(json.message || `خطأ من الخادم (${res.status})`);
          }
          return json.data;
        } catch (serverErr) {
          if (serverErr.message && (serverErr.message.includes('صلاحية') || serverErr.message.includes('مفتاح'))) {
            throw serverErr;
          }
          if (!apiKey && !(vertexConfig && vertexConfig.key)) {
            throw serverErr;
          }
        }
      }

      // 2. استخدام الاتصال المباشر من المتصفح في حال وجود مفتاح شخصي أو تشغيل التطبيق دون خادم
      const { url, headers } = getApiConfig(provider, modelName, apiKey, vertexConfig);
      return await fetchWithRetry(url, {
        method: 'POST',
        headers,
        body: JSON.stringify(payload)
      });
    };

    // بناء أجزاء المحتوى للذكاء الاصطناعي مع دعم دمج عدة صور ومستندات ونصوص في جلسة موحدة
    const buildContentsParts = (prompt, material) => {
      const parts = [{ text: prompt }];
      if (!material) return parts;

      if (material.type === 'text') {
        parts.push({ text: `\n--- محتوى المادة التعليمية ---\n${material.data}` });
      } else if (material.type === 'file') {
        parts.push({ inlineData: { mimeType: material.mimeType, data: material.data } });
      } else if (material.type === 'multi' && Array.isArray(material.items)) {
        parts.push({ 
          text: `\n--- محتوى المادة التعليمية الموحدة (مكون من ${material.items.length} مرفقات وصور تم دمجها معاً في جلسة تعليمية واحدة كاملة) ---` 
        });
        material.items.forEach((item, idx) => {
          if (item.type === 'text') {
            parts.push({ text: `\n[المرفق ${idx + 1}: ${item.name || 'مستند نصي'}]\n${item.data}` });
          } else if (item.data) {
            parts.push({ text: `\n[المرفق ${idx + 1}: ${item.name || 'صورة / مستند مرفق'}]` });
            parts.push({ 
              inlineData: { 
                mimeType: item.mimeType || 'image/jpeg', 
                data: item.data 
              } 
            });
          }
        });
      }
      return parts;
    };

    // === محرك الصوت والذاكرة المؤقتة الذكية والتسريع الفائق (Ultra-Fast TTS Engine) ===
    const voiceCache = {}; // cacheKey -> { data, mimeType, buffer }
    const inFlightAudioFetches = {}; // cacheKey -> Promise
    let currentAudioSource = null;
    let currentHtmlAudio = null;
    let activeSpeechId = 0;
    let activeAbortController = null;

    // تتبع النماذج الناجحة والفاشلة لتخطي المحاولات غير المجدية فوراً وبزمن 0ms
    let lastWorkingStudioTts = null;
    let lastWorkingVertexTts = null;
    const failedStudioTtsModels = new Set();
    const failedVertexTtsModels = new Set();
    let ttsTemporarilyDisabledUntil = 0;

    // إيقاف أي صوت أو نطق جاري فوراً لمنع التداخل (Overlap)
    const stopAllSpeech = () => {
      if (activeAbortController) {
        try { activeAbortController.abort(); } catch(e){}
        activeAbortController = null;
      }
      if (currentAudioSource) {
        try { currentAudioSource.stop(); } catch(e){}
        currentAudioSource = null;
      }
      if (currentHtmlAudio) {
        try { currentHtmlAudio.pause(); currentHtmlAudio.currentTime = 0; } catch(e){}
        currentHtmlAudio = null;
      }
      if ('speechSynthesis' in window) {
        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          window.speechSynthesis.cancel();
        } catch(e){}
      }
      try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
    };

    let bgNoiseGainNode = null;
    const updatePinkNoiseLive = (enabled, vol) => {
      localStorage.setItem('pink_noise_enabled', enabled ? 'true' : 'false');
      localStorage.setItem('pink_noise_volume', String(vol));
      if (bgNoiseGainNode && audioCtx && audioCtx.state !== 'suspended') {
        try {
          bgNoiseGainNode.gain.setValueAtTime(enabled ? vol : 0, audioCtx.currentTime);
        } catch(e){}
      }
    };

    // خوارزمية ذكية لاكتشاف واستئصال ذيل التشويش والهمس (Anti-Hiss Vocoder Truncation & Cosine Fade-out)
    const processPcmBytesAntiHiss = (pcmBytes, sampleRate = 24000) => {
      let len = pcmBytes.length;
      if (len % 2 !== 0) len -= 1;
      const totalSamples = len / 2;
      if (totalSamples < sampleRate * 0.2) return { pcmBytes, len };

      const view = new DataView(pcmBytes.buffer, pcmBytes.byteOffset, len);

      // مسح عكسي دقيق لاكتشاف موضع انتهاء الصوت البشري الفعلي
      // عتبة حساسة تلتقط أدق الهمسات والروابط اللغوية الساكنة (مثل: ة، ت، س، هـ) لمنع قطع أي كلمة
      const windowSize = Math.floor(sampleRate * 0.01); // 10ms = 240 عينة
      const maxScanSamples = Math.min(Math.floor(sampleRate * 0.45), Math.floor(totalSamples * 0.3));

      let lastSpeechSample = -1;
      for (let s = totalSamples - windowSize; s >= totalSamples - maxScanSamples; s -= windowSize) {
        let sum = 0;
        let maxVal = 0;
        for (let k = 0; k < windowSize; k++) {
          const v = Math.abs(view.getInt16((s + k) * 2, true));
          sum += v;
          if (v > maxVal) maxVal = v;
        }
        const avg = sum / windowSize;
        // طاقة الصوت البشري (فوق أرضية التشويش والهمس الرقمي)
        if (avg >= 200 || maxVal >= 550) {
          lastSpeechSample = s + windowSize;
          break;
        }
      }

      let cutSample = totalSamples;
      if (lastSpeechSample !== -1) {
        // حماية تامة لنهاية الكلمة: نضيف هامش أمان مريح لا يقل عن 100ms ليخرج الحرف الأخير كاملاً وطبيعياً دون أي بتر
        const safeMargin = Math.floor(sampleRate * 0.10);
        cutSample = Math.min(totalSamples, lastSpeechSample + safeMargin);
      }

      // تطبيق خفوت ناعم متدرج على آخر 30ms فقط من الملف لمنع أي طقطقة عتادية دون التأثير على الكلمات
      const fadeSamples = Math.min(Math.floor(sampleRate * 0.03), Math.floor(cutSample * 0.1));
      const fadeStart = cutSample - fadeSamples;
      for (let i = 0; i < fadeSamples; i++) {
        const s = fadeStart + i;
        const orig = view.getInt16(s * 2, true);
        const gain = 0.5 * (1 + Math.cos((Math.PI * i) / fadeSamples));
        view.setInt16(s * 2, Math.round(orig * gain), true);
      }

      // تصفير آخر 4ms فقط لضمان الهبوط إلى الصفر المطلق
      const zeroSamples = Math.min(Math.floor(sampleRate * 0.004), fadeSamples);
      for (let s = cutSample - zeroSamples; s < cutSample; s++) {
        view.setInt16(s * 2, 0, true);
      }

      const cleanLen = cutSample * 2;
      const cleanBytes = new Uint8Array(pcmBytes.buffer, pcmBytes.byteOffset, cleanLen);
      return { pcmBytes: cleanBytes, len: cleanLen };
    };

    // تحويل سريع مباشر من Base64 PCM 16-bit 24kHz إلى ArrayBuffer WAV بصيغة RIFF بعد استئصال التشويش
    const base64PcmToWavArrayBuffer = (base64Pcm, sampleRate = 24000, numChannels = 1, bitsPerSample = 16) => {
      try {
        const binaryString = atob(base64Pcm);
        let len = binaryString.length;
        if (len % 2 !== 0) len -= 1; // محاذاة عينات 16-bit
        const pcmBytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) pcmBytes[i] = binaryString.charCodeAt(i);

        const { pcmBytes: cleanPcm, len: cleanLen } = processPcmBytesAntiHiss(pcmBytes, sampleRate);

        const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
        const blockAlign = (numChannels * bitsPerSample) / 8;
        const totalBuffer = new ArrayBuffer(44 + cleanLen);
        const view = new DataView(totalBuffer);

        // "RIFF"
        view.setUint32(0, 0x52494646, false);
        view.setUint32(4, 36 + cleanLen, true);
        view.setUint32(8, 0x57415645, false);

        // "fmt "
        view.setUint32(12, 0x666d7420, false);
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); // PCM format
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitsPerSample, true);

        // "data"
        view.setUint32(36, 0x64617461, false);
        view.setUint32(40, cleanLen, true);

        new Uint8Array(totalBuffer, 44).set(cleanPcm);
        return totalBuffer;
      } catch (err) {
        console.warn("base64PcmToWavArrayBuffer error:", err);
        return null;
      }
    };

    // تحويل Base64 إلى ArrayBuffer عام
    const base64ToArrayBuffer = (base64) => {
      try {
        const binaryString = atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
        return bytes.buffer;
      } catch (e) {
        return null;
      }
    };

    // تنقية AudioBuffer بعد فك التشفير مع الحفاظ التام على مخارج الحروف دون أي بتر إضافي
    const cleanAudioBuffer = (audioBuffer) => {
      return audioBuffer;
    };

    // فك تشفير الصوت مسبقاً وتجهيز AudioBuffer للتشغيل الفوري (<1ms)
    const decodeAudioDataSafely = async (arrayBuffer) => {
      try {
        initAudio();
        if (!audioCtx) return null;
        const copy = arrayBuffer.slice(0);
        const decoded = await new Promise((resolve, reject) => {
          audioCtx.decodeAudioData(copy, resolve, reject);
        });
        return decoded;
      } catch (err) {
        return null;
      }
    };

    // تحويل دفق PCM 16-bit 24kHz الخام إلى ملف WAV قياسي برأس RIFF صالح ليعمل فورياً في جميع المتصفحات مع استئصال التشويش
    const pcmBase64ToWavBase64 = (base64Pcm, sampleRate = 24000, numChannels = 1, bitsPerSample = 16) => {
      try {
        const binaryString = atob(base64Pcm);
        let len = binaryString.length;
        if (len % 2 !== 0) len -= 1;
        const pcmBytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) pcmBytes[i] = binaryString.charCodeAt(i);

        const { pcmBytes: cleanPcm, len: cleanLen } = processPcmBytesAntiHiss(pcmBytes, sampleRate);

        const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
        const blockAlign = (numChannels * bitsPerSample) / 8;
        const wavHeader = new ArrayBuffer(44);
        const view = new DataView(wavHeader);

        view.setUint32(0, 0x52494646, false);
        view.setUint32(4, 36 + cleanLen, true);
        view.setUint32(8, 0x57415645, false);

        view.setUint32(12, 0x666d7420, false);
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitsPerSample, true);

        view.setUint32(36, 0x64617461, false);
        view.setUint32(40, cleanLen, true);

        const fullBytes = new Uint8Array(44 + cleanLen);
        fullBytes.set(new Uint8Array(wavHeader), 0);
        fullBytes.set(cleanPcm, 44);

        let binary = '';
        const chunk = 8192;
        for (let i = 0; i < fullBytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, fullBytes.subarray(i, i + chunk));
        }
        return btoa(binary);
      } catch (err) {
        console.warn("PCM to WAV conversion error:", err);
        return base64Pcm;
      }
    };

    const mapVoiceName = (voice) => {
      if (!voice || voice.toLowerCase() === 'tavi') {
        return 'Aoede'; // النبرة المعتمدة والدافئة للمساعد الصوتي تافي
      }
      return voice;
    };

    // جلب إعدادات Vertex AI المحفوظة في المتصفح بكافة الهياكل الممكنة
    const getStoredVertexConfig = () => {
      try {
        const raw = localStorage.getItem('vertex_config');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            return {
              project: parsed.project || localStorage.getItem('vertex_project_id') || '',
              region: parsed.region || localStorage.getItem('vertex_region') || 'global',
              key: parsed.key || parsed.token || localStorage.getItem('vertex_key_token') || '',
              token: parsed.token || parsed.key || localStorage.getItem('vertex_key_token') || ''
            };
          }
        }
      } catch(e){}
      return {
        project: localStorage.getItem('vertex_project_id') || '',
        region: localStorage.getItem('vertex_region') || 'global',
        key: localStorage.getItem('vertex_key_token') || '',
        token: localStorage.getItem('vertex_key_token') || ''
      };
    };

    // تشغيل الصوت من Base64 أو AudioBuffer بدون أي تأخير مع غلاف خفوت عتادي لمنع أي تشويش نهائي
    const playBase64Audio = async (base64Data, mimeType = 'audio/wav', speechId = null, preDecodedBuffer = null, spokenText = null) => {
      try {
        initAudio();
        if (speechId !== null && speechId !== activeSpeechId) return;

        // إيقاف أي صوت سابق فوراً
        if (currentAudioSource) {
          try { currentAudioSource.stop(); } catch(e){}
          currentAudioSource = null;
        }
        if (currentHtmlAudio) {
          try { currentHtmlAudio.pause(); currentHtmlAudio.currentTime = 0; } catch(e){}
          currentHtmlAudio = null;
        }

        try { window.__onSpeechStateChange?.({ status: 'speaking', text: spokenText }); } catch(e){}

        const playViaWebAudio = (buf) => {
          const source = audioCtx.createBufferSource();
          source.buffer = buf;
          const gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
          // غلاف هبوط عتادي دقيق على آخر 70ms لضمان صفر طقطقة أو تشويش
          const fadeStart = Math.max(0, buf.duration - 0.02);
          gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime + fadeStart);
          gainNode.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + buf.duration);
          source.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          source.onended = () => {
            if (currentAudioSource === source) {
              currentAudioSource = null;
              try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
            }
          };
          source.start();
          currentAudioSource = source;
        };

        // إذا كان الـ AudioBuffer مفكوكاً مسبقاً، نشغله فوراً بزمن 0ms
        if (preDecodedBuffer && audioCtx && audioCtx.state !== 'suspended') {
          playViaWebAudio(preDecodedBuffer);
          return;
        }

        let audioDataB64 = base64Data;
        let finalMime = mimeType || 'audio/wav';

        let audioBuffer = null;
        if (audioCtx) {
          try {
            let arrayBuf = null;
            if (finalMime.toLowerCase().includes('pcm') || finalMime.toLowerCase().includes('l16')) {
              arrayBuf = base64PcmToWavArrayBuffer(base64Data, 24000);
            } else {
              arrayBuf = base64ToArrayBuffer(base64Data);
            }
            if (arrayBuf) {
              audioBuffer = await decodeAudioDataSafely(arrayBuf);
            }
          } catch (decodeErr) {
            console.warn("audioCtx decodeAudioData fallback to HTML Audio:", decodeErr);
          }
        }

        if (speechId !== null && speechId !== activeSpeechId) return;

        if (audioBuffer && audioCtx && audioCtx.state !== 'suspended') {
          playViaWebAudio(audioBuffer);
          return;
        }

        // تحويل PCM إلى WAV في حال استخدام مشغل المتصفح HTML5
        if (finalMime.toLowerCase().includes('pcm') || finalMime.toLowerCase().includes('l16')) {
          audioDataB64 = pcmBase64ToWavBase64(base64Data, 24000);
          finalMime = 'audio/wav';
        }

        const audio = new Audio(`data:${finalMime};base64,${audioDataB64}`);
        currentHtmlAudio = audio;
        audio.onended = () => {
          if (currentHtmlAudio === audio) {
            currentHtmlAudio = null;
            try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
          }
        };
        audio.onerror = () => {
          if (currentHtmlAudio === audio) {
            currentHtmlAudio = null;
            try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
          }
        };
        await audio.play();
      } catch (e) {
        console.warn("Audio playback failed:", e);
        try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
      }
    };

    // القراءة عبر خدمة الصوت الطبيعي عالية النقاء كبديل متقدم ومحبب للأذن
    const speakWithNaturalOnlineVoice = async (text, speechId = null) => {
      try {
        if (!text || (speechId !== null && speechId !== activeSpeechId)) return false;
        const cleanText = text.replace(/[*_#`~\[\]]/g, '').trim();
        if (!cleanText) return false;
        try { window.__onSpeechStateChange?.({ status: 'speaking', text: cleanText }); } catch(e){}
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q=${encodeURIComponent(cleanText)}`;
        const audio = new Audio(ttsUrl);
        currentHtmlAudio = audio;
        audio.onended = () => {
          if (currentHtmlAudio === audio) {
            currentHtmlAudio = null;
            try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
          }
        };
        audio.onerror = () => {
          if (currentHtmlAudio === audio) {
            currentHtmlAudio = null;
            try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
          }
        };
        await audio.play();
        return true;
      } catch (err) {
        try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
        return false;
      }
    };

    // إلغاء الصوت الروبوتي الآلي تماماً والاعتماد حصرياً على صوت الذكاء الاصطناعي (وفي حال عدم توفره لا يُضاف أي صوت)
    const speakWithWebSpeech = () => {
      try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
    };

    // جلب ومعالجة الصوت من API مع التخزين المؤقت وفك التشفير في خطوة واحدة
    // تنظيف وضبط النص لتوليد صوت فصيح نقي ومتقن 100% بدون أي تعتعة أو رموز
    const cleanTextForTts = (text) => {
      if (!text || typeof text !== 'string') return '';
      return text
        .replace(/\[\s*_{2,}\s*\]|_{2,}|\[\s*\.{3,}\s*\]/g, ' فَـرَاغ ')
        .replace(/\.{3,}/g, '، ')
        .replace(/[*_#`~\[\]\(\)\{\}<>]/g, ' ')
        .replace(/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '')
        .replace(/\s+/g, ' ')
        .trim();
    };

    const fetchTtsAudio = async (text, prov, effectiveKey, vConfig, actualVoice, chosenTtsModel = null, signal = null) => {
      if (!text) return null;
      const spokenCleanText = cleanTextForTts(text) || text;
      const cacheKey = `${prov}_${actualVoice}_${spokenCleanText}`;
      if (voiceCache[cacheKey]) return voiceCache[cacheKey];

      // 1. مسار Google Cloud Vertex AI (Gemini TTS المتقدم)
      if (prov === 'vertex') {
        const project = (vConfig.project || '').trim();
        const cred = (vConfig.key || vConfig.token || '').trim();

        if (project && cred) {
          const loc = (vConfig.region && vConfig.region.trim()) ? vConfig.region.trim().toLowerCase() : 'global';
          const host = (loc === 'global') ? 'aiplatform.googleapis.com' : `${loc}-aiplatform.googleapis.com`;
          const isBearer = cred.startsWith('ya29.') || cred.toLowerCase().startsWith('bearer ');
          const cleanToken = cred.replace(/^bearer\s+/i, '');

          let baseModel = chosenTtsModel || lastWorkingVertexTts || localStorage.getItem('gemini_tts_model') || 'gemini-3.1-flash-tts-preview';
          if (baseModel.includes('3.8')) baseModel = 'gemini-3.1-flash-tts-preview';

          const candidateModels = [
            baseModel,
            "gemini-3.1-flash-tts-preview",
            "gemini-2.5-flash-tts",
            "gemini-2.5-flash-lite-preview-tts",
            "gemini-2.5-pro-tts"
          ].filter((m, idx, arr) => m && arr.indexOf(m) === idx && !failedVertexTtsModels.has(m));

          for (const model of candidateModels) {
            if (signal?.aborted) return null;
            try {
              let ttsUrl = `https://${host}/v1beta1/projects/${project}/locations/${loc}/publishers/google/models/${model}:generateContent`;
              const headers = { "Content-Type": "application/json" };
              if (isBearer) {
                headers["Authorization"] = `Bearer ${cleanToken}`;
                headers["x-goog-user-project"] = project;
              } else {
                ttsUrl += (ttsUrl.includes('?') ? '&' : '?') + `key=${encodeURIComponent(cred)}`;
                headers["x-goog-api-key"] = cred;
              }

              const payload = {
                contents: [{
                  role: "user",
                  parts: [{
                    text: spokenCleanText,
                    speech_metadata: {
                      style: "clear and natural in authentic Saudi Najdi accent, crisp and articulate"
                    }
                  }]
                }],
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: {
                    voiceConfig: {
                      prebuiltVoiceConfig: { voiceName: actualVoice }
                    }
                  }
                }
              };

              const res = await fetch(ttsUrl, {
                method: "POST",
                headers,
                body: JSON.stringify(payload),
                signal
              });

              if (!res.ok) {
                if (res.status === 404) {
                  failedVertexTtsModels.add(model);
                }
                continue;
              }

              const data = await res.json();
              const inlineAudio = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;
              if (inlineAudio?.data) {
                lastWorkingVertexTts = model;
                const wavBuffer = base64PcmToWavArrayBuffer(inlineAudio.data, 24000);
                const cleanWavBase64 = pcmBase64ToWavBase64(inlineAudio.data, 24000);
                const audioBuffer = wavBuffer ? await decodeAudioDataSafely(wavBuffer) : null;
                const result = {
                  data: cleanWavBase64,
                  mimeType: 'audio/wav',
                  buffer: audioBuffer
                };
                voiceCache[cacheKey] = result;
                return result;
              }
            } catch (err) {
              if (err.name === 'AbortError' && signal?.aborted) return null;
            }
          }
        }
      }

      // 2. مسار Google AI Studio (Gemini Flash TTS) ومفتاح السيرفر
      const token = localStorage.getItem('auth_token');
      const hasServerAi = localStorage.getItem('user_has_server_ai') === 'true';

      if (effectiveKey || (token && hasServerAi)) {
        if (ttsTemporarilyDisabledUntil && Date.now() < ttsTemporarilyDisabledUntil) {
          return null;
        }

        let baseModel = lastWorkingStudioTts || chosenTtsModel || localStorage.getItem('gemini_tts_model') || 'gemini-2.5-flash-preview-tts';
        const candidateModels = [
          baseModel,
          "gemini-3.1-flash-tts-preview",
          "gemini-2.5-flash-preview-tts",
          "gemini-2.5-pro-preview-tts"
        ].filter((m, idx, arr) => m && arr.indexOf(m) === idx && !failedStudioTtsModels.has(m));

        for (const model of candidateModels) {
          if (signal?.aborted) return null;
          try {
            const payload = {
                contents: [{
                  role: "user",
                  parts: [{
                    text: spokenCleanText,
                    speech_metadata: {
                      style: "clear and natural in authentic Saudi Najdi accent, crisp and articulate"
                    }
                  }]
                }],
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: {
                    voiceConfig: {
                      prebuiltVoiceConfig: { voiceName: actualVoice }
                    }
                  }
                }
              };

            let res;
            if (token && (hasServerAi || !effectiveKey)) {
              res = await fetch(getApiUrl('/ai/generate'), {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                  modelName: model,
                  payload,
                  provider: 'gemini',
                  personalApiKey: effectiveKey
                }),
                signal
              }).then(async r => {
                if (!r.ok) return { ok: false, status: r.status };
                const j = await r.json();
                return { ok: true, status: 200, json: async () => j.data || j };
              });
            } else {
              const ttsUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${effectiveKey}`;
              res = await fetch(ttsUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
                signal
              });
            }

            if (!res.ok) {
              if (res.status === 404) {
                failedStudioTtsModels.add(model);
              }
              if (res.status === 429) {
                ttsTemporarilyDisabledUntil = Date.now() + 60000;
                break;
              }
              continue;
            }

            const data = await res.json();
            const inlineAudio = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;
            if (inlineAudio?.data) {
              lastWorkingStudioTts = model;
              const wavBuffer = base64PcmToWavArrayBuffer(inlineAudio.data, 24000);
              const cleanWavBase64 = pcmBase64ToWavBase64(inlineAudio.data, 24000);
              const audioBuffer = wavBuffer ? await decodeAudioDataSafely(wavBuffer) : null;
              const result = {
                data: cleanWavBase64,
                mimeType: 'audio/wav',
                buffer: audioBuffer
              };
              voiceCache[cacheKey] = result;
              return result;
            }
          } catch (err) {
            if (err.name === 'AbortError' && signal?.aborted) return null;
          }
        }
      }

      return null;
    };

    const prefetchVoice = (text, apiKey = null, voiceEnabled = true, chosenTtsModel = null, activeProvider = null, activeVertexConfig = null, chosenVoice = null) => {
      if (!voiceEnabled || !text) return;
      const prov = activeProvider || localStorage.getItem('ai_provider') || localStorage.getItem('quiz_ai_provider') || 'gemini';
      const vConfig = activeVertexConfig || getStoredVertexConfig();
      const effectiveKey = (apiKey !== null && apiKey !== undefined) ? apiKey : (localStorage.getItem('gemini_api_key') || '');
      const rawVoice = chosenVoice || localStorage.getItem('gemini_tts_voice') || 'Aoede';
      const actualVoice = mapVoiceName(rawVoice);

      const cacheKey = `${prov}_${actualVoice}_${text}`;
      if (voiceCache[cacheKey] || inFlightAudioFetches[cacheKey]) return;

      inFlightAudioFetches[cacheKey] = fetchTtsAudio(text, prov, effectiveKey, vConfig, actualVoice, chosenTtsModel)
        .catch(err => {
          console.warn("Prefetch warning:", err);
          return null;
        })
        .finally(() => {
          delete inFlightAudioFetches[cacheKey];
        });
    };

    // توليد الصوت الذكي بنبرة تافي (Tavi) وتشغيله فوراً وبدون أي تأخير
    const speakText = async (text, apiKey = null, voiceEnabled = true, chosenTtsModel = null, activeProvider = null, activeVertexConfig = null, chosenVoice = null) => {
      if (!voiceEnabled || !text) {
        stopAllSpeech();
        return;
      }

      stopAllSpeech();
      const currentSpeechId = ++activeSpeechId;
      activeAbortController = new AbortController();
      const abortSignal = activeAbortController.signal;

      const prov = activeProvider || localStorage.getItem('ai_provider') || localStorage.getItem('quiz_ai_provider') || 'gemini';
      const vConfig = activeVertexConfig || getStoredVertexConfig();
      const effectiveKey = (apiKey !== null && apiKey !== undefined) ? apiKey : (localStorage.getItem('gemini_api_key') || '');
      const rawVoice = chosenVoice || localStorage.getItem('gemini_tts_voice') || 'Aoede';
      const actualVoice = mapVoiceName(rawVoice);

      const cacheKey = `${prov}_${actualVoice}_${text}`;

      const playDirectBuffer = (buf) => {
        try {
          if (currentAudioSource) { try { currentAudioSource.stop(); } catch(e){} }
          const source = audioCtx.createBufferSource();
          source.buffer = buf;
          const gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
          gainNode.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + 0.015);
          const fadeStart = Math.max(0, buf.duration - 0.02);
          gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime + fadeStart);
          gainNode.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + buf.duration);
          source.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          source.onended = () => {
            if (currentAudioSource === source) {
              currentAudioSource = null;
              try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
            }
          };
          try { window.__onSpeechStateChange?.({ status: 'speaking', text }); } catch(e){}
          source.start();
          currentAudioSource = source;
          return true;
        } catch(e) {
          return false;
        }
      };

      // 1. إذا كان الصوت مخزناً وجاهزاً في الذاكرة (من التحميل المسبق): تشغيل فوري بدون أي انتظار (<1ms)
      if (voiceCache[cacheKey]) {
        if (currentSpeechId !== activeSpeechId) return;
        const item = voiceCache[cacheKey];
        if (item.buffer && audioCtx && audioCtx.state !== 'suspended') {
          if (playDirectBuffer(item.buffer)) return;
        }
        await playBase64Audio(item.data, item.mimeType, currentSpeechId, item.buffer, text);
        return;
      }

      // 2. إذا كان الصوت قيد التحميل المسبق حالياً: انتظار نفس الطلب الجاري بدلاً من تكرار الطلب
      if (inFlightAudioFetches[cacheKey]) {
        try {
          try { window.__onSpeechStateChange?.({ status: 'loading', text }); } catch(e){}
          const item = await inFlightAudioFetches[cacheKey];
          if (currentSpeechId !== activeSpeechId) return;
          if (item) {
            if (item.buffer && audioCtx && audioCtx.state !== 'suspended') {
              if (playDirectBuffer(item.buffer)) return;
            }
            await playBase64Audio(item.data, item.mimeType, currentSpeechId, item.buffer, text);
            return;
          }
        } catch(e){}
      }

      // 3. جلب الصوت المباشر من الـ API مع إشعار واجهة المستخدم بحالة التحميل (Loading / Spinning)
      try { window.__onSpeechStateChange?.({ status: 'loading', text }); } catch(e){}
      const result = await fetchTtsAudio(text, prov, effectiveKey, vConfig, actualVoice, chosenTtsModel, abortSignal);
      if (currentSpeechId !== activeSpeechId) return;

      if (result) {
        if (result.buffer && audioCtx && audioCtx.state !== 'suspended') {
          if (playDirectBuffer(result.buffer)) return;
        }
        await playBase64Audio(result.data, result.mimeType, currentSpeechId, result.buffer, text);
        return;
      }

      // 4. في حال عدم توفر صوت الذكاء الاصطناعي: لا يتم إضافة أي صوت روبوتي آلي
      if (currentSpeechId === activeSpeechId) {
        try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
      }
    };

    // جلب أحدث نماذج Flash & Pro ونماذج TTS الصوتية ديناميكياً وحياً من API
    const fetchDynamicModels = async (provider, apiKey, vertexConfig = {}) => {
      if (provider === 'vertex') {
        const { project, region, key, token } = vertexConfig;
        if (!project) throw new Error("يرجى إدخال معرف مشروع Google Cloud (Project ID)");
        const loc = (region && region.trim()) ? region.trim().toLowerCase() : 'global';
        const host = (loc === 'global') ? 'aiplatform.googleapis.com' : `${loc}-aiplatform.googleapis.com`;
        const cred = (key || token || '').trim();
        const isBearer = cred.startsWith('ya29.') || cred.toLowerCase().startsWith('bearer ');
        const cleanToken = cred.replace(/^bearer\s+/i, '');

        let list = [];
        try {
          const url = `https://${host}/v1beta1/projects/${project}/locations/${loc}/publishers/google/models${!isBearer && cred ? '?key=' + encodeURIComponent(cred) : ''}`;
          const headers = { "Content-Type": "application/json" };

          }

        const verifiedVertexBrain = ["gemini-3.8-flash", "gemini-2.5-flash", "gemini-2.5-pro"];
        const ttsModels = list.filter(name => name.includes('tts') || name.includes('audio'));
        const verifiedVertexTts = ["gemini-2.5-flash-tts", "gemini-3.1-flash-tts-preview", "gemini-2.5-flash-lite-preview-tts", "gemini-2.5-pro-tts"];
        return {
          brainModels: brainModels.length > 0 ? brainModels : verifiedVertexBrain,
          ttsModels: ttsModels.length > 0 ? ttsModels : verifiedVertexTts
        };
      } else {
        if (!apiKey) throw new Error("يرجى إدخال مفتاح Gemini API لجلب النماذج");
        const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`خطأ في جلب النماذج: ${res.status}`);
        const data = await res.json();
        const rawModels = data.models || [];
        
        // استخراج جميع نماذج generateContent
        const allGenModels = rawModels
          .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
          .map(m => m.name.replace(/^models\//, ''));

        // نماذج العقل وتوليد الأسئلة (Brain models)
        const brainModels = allGenModels
          .filter(name => (name.toLowerCase().includes('flash') || name.toLowerCase().includes('pro')) && !name.toLowerCase().includes('tts'));

        // نماذج الصوت والنطق (TTS models)
        const ttsModels = allGenModels
          .filter(name => name.toLowerCase().includes('tts') || name.toLowerCase().includes('audio'));

        const sortModels = (list) => {
          return list.sort((a, b) => {
            const numA = parseFloat(a.match(/\d+(\.\d+)?/)?.[0] || '0');
            const numB = parseFloat(b.match(/\d+(\.\d+)?/)?.[0] || '0');
            if (numB !== numA) return numB - numA;
            if (a.includes('flash') && !b.includes('flash')) return -1;
            if (!a.includes('flash') && b.includes('flash')) return 1;
            return a.localeCompare(b);
          });
        };

        const finalBrain = sortModels(brainModels);
        const finalTts = sortModels(ttsModels);

        return {
          brainModels: finalBrain.length > 0 ? finalBrain : ["gemini-3.8-flash", "gemini-3.8-pro", "gemini-3.5-flash", "gemini-2.5-flash"],
          ttsModels: finalTts.length > 0 ? finalTts : ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts", "gemini-3.1-flash-tts-preview"]
        };
      }
    };

    // إعداد رابط ونوع طلب الـ API حسب المزود (Gemini vs Vertex AI)
    const getApiConfig = (provider, modelName, apiKey, vertexConfig) => {
      if (provider === 'vertex') {

        const loc = (region && region.trim()) ? region.trim().toLowerCase() : 'global';
        const host = (loc === 'global') ? 'aiplatform.googleapis.com' : `${loc}-aiplatform.googleapis.com`;
        const cred = (key || token || '').trim();
        const isBearer = cred.startsWith('ya29.') || cred.toLowerCase().startsWith('bearer ');
        const cleanToken = cred.replace(/^bearer\s+/i, '');

        let url = `https://${host}/v1beta1/projects/${project}/locations/${loc}/publishers/google/models/${modelName}:generateContent`;
        const headers = { "Content-Type": "application/json" };

        if (isBearer) {
          headers["Authorization"] = `Bearer ${cleanToken}`;
          if (project) headers["x-goog-user-project"] = project;
        } else if (cred) {
          url += (url.includes('?') ? '&' : '?') + `key=${encodeURIComponent(cred)}`;
          headers["x-goog-api-key"] = cred;

        return { url, headers };
      }
      return {

        headers: { "Content-Type": "application/json" }

    // توحيد وتنظيم هيكل السؤال عبر منظومة علوم الإدراك والذاكرة المتعددة (Multi-Sensory Cognitive Model)
    const normalizeQuestion = (q, idx = 0) => {
      if (!q) return null;
      const hasOptions = Array.isArray(q.options) && q.options.length > 1;
      const isFillBlank = q.type === 'fill_blank' || Boolean(q.missingWord && q.clozeText);
      const isShort = !isFillBlank && (q.type === 'short_answer' || (!hasOptions && Boolean(q.expectedAnswer || !q.options?.length)));
      const finalType = isFillBlank ? 'fill_blank' : (isShort ? 'short_answer' : 'mcq');

      const expected = q.expectedAnswer || (isFillBlank ? (q.missingWord || '') : (hasOptions && typeof q.correct === 'number' ? q.options[q.correct] : '')) || '';
      const missingWord = q.missingWord || (isFillBlank ? expected : '');
      const clozeText = q.clozeText || (isFillBlank && q.text && missingWord ? q.text.replace(missingWord, '[_____]') : (q.text || ''));

      return {
        id: q.id || `q_${Date.now()}_${idx}_${Math.random().toString(36).substring(2, 7)}`,
        type: finalType,
        text: q.text || '',
        options: Array.isArray(q.options) ? q.options : (isFillBlank && missingWord ? [missingWord] : []),
        correct: typeof q.correct === 'number' ? q.correct : 0,
        expectedAnswer: expected,
        missingWord: missingWord,
        clozeText: clozeText,
        hint: q.hint || '',
        // الرابط البصري الخيالي (Dual Coding Theory - Allan Paivio): ترسيخ صوري خيالي يضاعف مسارات الاسترجاع
        visualSketch: q.visualSketch || q.visualAnchor || (q.hint ? `تخيل المشهد بعينيك: ${q.hint}` : 'تخيل المشهد الذهني بكل حواسك 🧠✨'),
        // سر الفكرة والتعليل الذاتي (Elaborative Interrogation / Feynman Method): لماذا هذا المفهوم منطقي؟
        whyExplanation: q.whyExplanation || q.explanation || '',
        // الكبسولة الجوهرية (Chunking & Cognitive Load): المفهوم المركزي في 2-3 كلمات
        coreConcept: q.coreConcept || (q.text ? q.text.split(' ').slice(0, 3).join(' ') : 'مفهوم أساسي'),

        masteryLevel: typeof q.masteryLevel === 'number' ? q.masteryLevel : 0,
        // معرف الرنين الذاكرتي الصوتي الخماسي (Targeted Memory Reactivation - TMR)
        soundAnchorId: typeof q.soundAnchorId === 'number' ? q.soundAnchorId : (idx % 5),
        reviewQueueCount: typeof q.reviewQueueCount === 'number' ? q.reviewQueueCount : 0
      };
    };

    // فحص ما إذا كان السؤال سؤال إجابة قصيرة (Short Answer)
    const isShortAnswerQuestion = (q) => {
      if (!q) return false;
      return q.type === 'short_answer';
    };

    // فحص ما إذا كان السؤال إكمال فراغ وتوليد نشط (Cloze Deletion / Fill in the blank)
    const isFillBlankQuestion = (q) => {
      if (!q) return false;
      return q.type === 'fill_blank';
    };

    // استخراج النص الصوتي الآمن للسؤال لمنع نطق كلمة الإجابة في أسئلة إكمال الفراغ سلفاً
    const getSpokenQuestionText = (q) => {
      if (!q) return '';
      if (isFillBlankQuestion(q)) {
        if (q.clozeText) {
          return q.clozeText.replace(/\[\s*_{2,}\s*\]|_{2,}/g, '... فراغ ...');
        }
        const word = q.missingWord || q.expectedAnswer;
        if (word && q.text) {
          return q.text.replace(new RegExp(word.trim(), 'gi'), '... فراغ ...');
        }
      }
      return q.text || '';
    };

    // تسوية ومعالجة النصوص العربية للمقارنة الذكية والتقييم المحلي
    const normalizeArabicText = (text) => {
      if (!text) return '';
      return text
        .toString()
        .toLowerCase()
        .replace(/[\u064B-\u065F\u0670]/g, '') // حذف التشكيل والتنوين
        .replace(/[إأآا]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/ؤ/g, 'و')
        .replace(/ئ/g, 'ي')
        .replace(/[^\w\s\u0600-\u06FF]/gi, ' ') // إزالة علامات الترقيم والرموز
        .replace(/\s+/g, ' ')
        .trim();
    };

    // المصحح والمراجع المحلي لإجابات الطلاب القصيرة كبديل سريع في حال عدم توفر اتصال بالـ API
    const localEvaluateShortAnswer = (expectedAnswer, studentAnswer) => {
      const normExpected = normalizeArabicText(expectedAnswer);
      const normStudent = normalizeArabicText(studentAnswer);

      if (!normStudent) {
        return {
          isCorrect: false,
          similarityScore: 0,
          feedback: "لم يتم كتابة إجابة.",
          revisedAnswer: expectedAnswer
        };
      }

      if (normExpected === normStudent || normExpected.includes(normStudent) || normStudent.includes(normExpected)) {
        return {
          isCorrect: true,
          similarityScore: 100,
          feedback: "إجابة عبقرية ومطابقة تماماً للمفهوم المطلوب! 🌟",
          revisedAnswer: expectedAnswer
        };
      }

      const stopWords = new Set(['في', 'من', 'على', 'إلى', 'عن', 'مع', 'هذا', 'هذه', 'تم', 'هو', 'هي', 'أن', 'ان', 'ما', 'لا', 'التي', 'الذي', 'و', 'أو', 'او', 'بسبب', 'لأن', 'لكي']);
      const expectedTokens = normExpected.split(/\s+/).filter(w => w.length > 1 && !stopWords.has(w));
      const studentTokens = normStudent.split(/\s+/).filter(w => w.length > 1 && !stopWords.has(w));

      if (expectedTokens.length === 0) {
        const isCorr = normStudent.length > 0;
        return {
          isCorrect: isCorr,
          similarityScore: isCorr ? 85 : 0,
          feedback: isCorr ? "إجابة مقبولة! 👍" : "الإجابة غير مكتملة.",
          revisedAnswer: expectedAnswer
        };
      }

      let matchCount = 0;
      for (const sToken of studentTokens) {
        const matched = expectedTokens.some(eToken => {
          if (eToken === sToken) return true;
          if (eToken.length >= 3 && sToken.length >= 3) {
            if (eToken.includes(sToken) || sToken.includes(eToken)) return true;
          }
          return false;
        });
        if (matched) matchCount++;
      }

      const recall = matchCount / Math.max(expectedTokens.length, 1);
      const precision = matchCount / Math.max(studentTokens.length, 1);
      const score = Math.round(Math.max(recall * 75 + precision * 25, 0));
      // معيار القبول الصارم: 85% أو أكثر
      const isCorrect = score >= 85 || (recall >= 0.85);

      return {

        similarityScore: Math.min(score, 100),

        revisedAnswer: expectedAnswer

    };

    // مراجعة وتقييم إجابة الطالب عبر نموذج الذكاء الاصطناعي بمعيار 85% الصارم
    const evaluateShortAnswerWithAi = async ({ provider, apiKey, vertexConfig, modelName, questionText, expectedAnswer, studentAnswer, hint }) => {

تعليمات المراجعة ومعيار القبول الصارم (85%):

- إذا كانت النسبة أقل من 85% (similarityScore < 85)، تُعتبر الإجابة غير كافية وتحتاج إلى دقة إضافية (isCorrect = false).

أرجع فقط كائن JSON صالحاً بالهيكل التالي بدون أي كود أو نصوص إضافية:
{

        const isThinkingModel = modelName.includes('3.8') || modelName.includes('3.') || modelName.includes('extended');
        const generationConfig = { responseMimeType: "application/json" };
        if (isThinkingModel) {

    // المساعد 1: الاستخراج الذكي وهندسة الذاكرة العصبية الشاملة (Cognitive Multi-Method Pipeline)
    const draftQuizFromMaterial = async ({ provider, apiKey, vertexConfig, modelName, material }) => {
      const prompt = `
        أنت مهندس ذاكرة عصبية ومعلم تفاعلي فائق الذكاء، خبير بأحدث نظريات علوم الإدراك (Cognitive Neuroscience) لتثبيت المعلومات المدرسية في الذاكرة الدائمة بأسرع وقت وأمتع طريقة دون أن يشعر الطالب بأي جهد جاف.
        
        مهمتك:
        تحليل المادة التعليمية المرفقة واستخراج جميع المفاهيم والأسئلة بلا استثناء، وبناء "كبسولات ذاكرة تفاعلية" تجمع سراً بين:
        1. التنوع والتوليد النشط (Interleaving & Generation Effect): مزيج من أسئلة الاختيار من متعدد، وإكمال الفراغ بالكلمة المفتاحية (Cloze Deletion)، والأسئلة المقالية القصيرة (علّل / تعريف / عدّد).
        2. الترميز المزدوج (Dual Coding Theory): ربط كل مفهوم بمشهد بصري تخيلي طريف ومضحك (Visual Mental Sketch).
        3. مفاتيح الحفظ السحرية (Mnemonics): قصة من سطر واحد أو جناس صوتي يربط السؤال بالإجابة.
        4. سر الفكرة والتعليل الذاتي (Elaborative Interrogation): تفسير بديهي في جملة واحدة يشرح "لماذا" هذا المفهوم منطقي في العالم الواقعي.
        5. التجزئة الذهنية (Chunking): استخراج المفهوم الجوهري في 2-3 كلمات ككبسولة مركزية.

        التعليمات الصارمة لتصنيف أنواع الأسئلة وفق سياق الدرس:
        1. أسئلة الاختيار من متعدد وصح/خطأ ("type": "mcq"):
           - تُستخدم للمفاهيم والشروحات والمعلومات العامة والحقائق.
           - للـ MCQ: ضع 4 خيارات منطقية ورقم index الإجابة الصحيحة في "correct" (0 إلى 3).
           - لصح/خطأ: اجعل "options": ["صح", "خطأ"]، وضع index الصحيح (0 لـ "صح"، 1 لـ "خطأ").
        
        2. أسئلة إكمال الفراغ والتوليد النشط ("type": "fill_blank"):
           - تُستخدم للجمل والقوانين والعبارات المركزية التي يُحذف منها مصطلح أو كلمة مفتاحية واحدة محددة يجب أن يتذكرها الطالب بنفسه.
           - ضع في "text" الجملة كاملة، وضع في "clozeText" الجملة مع استبدال الكلمة بـ [_____].
           - ضع في "missingWord" الكلمة المفتاحية المحذوفة.
           - ضع في "options" 4 خيارات للكلمات (الكلمة الصحيحة + 3 بدائل منافسة منطقية).
           - ضع في "correct" رقم index الكلمة الصحيحة في مصفوفة options.
           - ضع الكلمة الصحيحة أيضاً في "expectedAnswer".

        3. أسئلة الإجابة القصيرة ("type": "short_answer") — (علّل / تعريف / عدّد):
           - افحص المادة التعليمية بدقة لتحديد ما يصلح فيها ليكون سؤال "علّل" (تعليل / اذكر السبب / بم تفسر / لماذا)، أو "تعريف" (عرّف / ما المقصود بـ / تعريف مصطلح وارد في المادة)، أو "عدّد" (عدّد / اذكر الأنواع أو الأقسام أو الشروط أو الخطوات أو النقاط).
           - إذا توفرت في المادة أسئلة أو فقرات تمثّل (علّل، أو تعريف، أو عدّد)، فاعتمدها مباشرة لأسئلة "short_answer" وطابق نص المادة حرفياً ودقيقاً (سواء في صياغة السؤال أو في الإجابة النموذجية "expectedAnswer") كما وردت في المادة تماماً دون تحريف أو إعادة صياغة تغير نص المادة أو تأليف من خارجها.
           - ضع الإجابة النموذجية المطابقة لنص المادة تماماً في "expectedAnswer".
           - اجعل "options": [] و "correct": null.

        4. الحقول الإدراكية الإلزامية لكل سؤال مهما كان نوعه:
           - "hint": مفتاح الحفظ العبقري (تشابه صوتي، قصة طريفة سريعة، أو نكتة مع إيموجي).
           - "visualSketch": مشهد بصري كرتوني مضحك أو غريب يتخيله الطالب بعينيه لربط السؤال بالإجابة (مثال: "تخيل قطة تلبس نظارة وتقرأ كتاباً تحت شجرة سحرية 🐱👓📖").
           - "whyExplanation": جملة واحدة بديهية جداً تشرح سر الفكرة ولماذا هذا صحيح علمياً أو واقعياً.
           - "coreConcept": كبسولة المفهوم في 2-3 كلمات (مثال: "ظاهرة التبخر", "قوانين الحركة").

      const isThinkingModel = modelName.includes('3.8') || modelName.includes('3.') || modelName.includes('extended');
      const generationConfig = {
        responseMimeType: "application/json"
      };

      if (isThinkingModel) {
        generationConfig.thinkingConfig = {
          thinkingLevel: "high"
        };
      } else {
        generationConfig.temperature = 0.2;
      }

      const payload = {
        contents: [{ role: "user", parts: buildContentsParts(prompt, material) }],
        generationConfig
      };

      const data = await requestAiCompletion({ provider, modelName, apiKey, vertexConfig, payload });

      const parts = data.candidates?.[0]?.content?.parts || [];
      const contentPart = parts.find(p => !p.thought && p.text) || parts[parts.length - 1];
      let responseText = contentPart?.text;
      
      if (!responseText) throw new Error("لم يصل رد صالح من الذكاء الاصطناعي.");
      responseText = responseText.replace(/^```json\s*/i, '').replace(/\s*```$/, '').trim();
      let parsed = JSON.parse(responseText);
      if (!Array.isArray(parsed) && parsed.questions && Array.isArray(parsed.questions)) {
        parsed = parsed.questions;
      }
      return (parsed || []).map(normalizeQuestion).filter(Boolean);
    };

          if (data.success) {
            setUserMaterials(data.materials || []);
          }
        } catch (e) {
          console.error('Fetch materials error:', e);
        } finally {
          setIsLoadingMaterials(false);
        }
      };

      // حفظ المادة والأسئلة تلقائياً في قاعدة البيانات
      const saveMaterialToDb = async (title, questions, count) => {
        if (!authToken || !questions || questions.length === 0) return null;
        try {
          const res = await fetch(getApiUrl('/api/materials'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({
              title: title || `مادة اختبار ${new Date().toLocaleDateString('ar-SA')}`,
              questions,
              totalQuestions: count || questions.length
            })
          });
          const data = await res.json();
          if (data.success && data.materialId) {
            setCurrentMaterialId(data.materialId);
            fetchUserMaterials();
            return data.materialId;
          }
        } catch (e) {
          console.warn('Failed to save material to DB:', e.message);
        }
        return null;
      };

      // حفظ تقدم الاختبار للاستئناف لاحقاً
      const saveProgressToDb = async (qIndex, currentScore, isCompleted = false) => {
        if (!authToken || !currentMaterialId) return;
        try {
          await fetch(getApiUrl('/api/progress'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({
              materialId: currentMaterialId,
              mode,
              currentIndex: qIndex,
              score: currentScore,
              totalQuestions: shuffledQuestions.length || questionsData.length,
              isCompleted: isCompleted ? 1 : 0,
              state: {
                shuffledQuestions,
                currentIndex: qIndex,
                score: currentScore
              }
            })
          });
        } catch (e) {
          console.warn('Failed to auto-save progress:', e.message);
        }
      };

      // استئناف مادة واختبار من قاعدة البيانات
      const handleResumeMaterial = async (mat) => {
        if (!mat || !mat.id) return;
        try {
          const res = await fetch(getApiUrl(`/api/materials/${mat.id}`), {
            headers: { 'Authorization': `Bearer ${authToken}` }
          });
          const data = await res.json();
          if (data.success && data.material) {
            const rawQuestions = data.material.questions || [];
            const sanitized = rawQuestions.map(normalizeQuestion).filter(Boolean);
            if (sanitized.length === 0) {
              alert('المادة المحددة لا تحتوي على أسئلة صالحة');
              return;
            }

            setCurrentMaterialId(mat.id);
            setQuestionsData(sanitized);
            setAllOriginalQuestions(sanitized);

            const resumeIndex = (typeof mat.current_index === 'number' && mat.current_index < sanitized.length) ? mat.current_index : 0;
            const resumeScore = (typeof mat.score === 'number') ? mat.score : 0;

            const shuffled = [...sanitized];
            setShuffledQuestions(shuffled);
            setCurrentIndex(resumeIndex);
            setScore(resumeScore);
            setSelectedAnswer(null);
            setIsAnswerChecked(false);
            setStudentShortAnswer('');
            setShortAnswerEvaluation(null);

            setShowUserDashboard(false);
            setMode('quiz');
            setTimerActive(true);
            speak(shuffled[resumeIndex]?.text);
          }
        } catch (e) {
          alert('تعذر استئناف المادة: ' + e.message);
        }
      };

      // حذف مادة محفوظة
      const handleDeleteMaterial = async (matId) => {
        if (!confirm('هل أنت متأكد من حذف هذه المادة وتقدمها بالكامل؟')) return;
        try {
          const res = await fetch(getApiUrl(`/api/materials/${matId}`), {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${authToken}` }
          });
          const d = await res.json();
          if (d.success) {
            setUserMaterials(prev => prev.filter(m => m.id !== matId));
            if (currentMaterialId === matId) setCurrentMaterialId(null);
          }
        } catch (e) {
          alert('فشل الحذف: ' + e.message);
        }
      };

      // جلب بيانات لوحة تحكم المشرف (Admin Dashboard)
      const fetchAdminData = async () => {
        if (!authToken || currentUser?.role !== 'admin') return;
        setIsLoadingAdmin(true);
        try {
          const [statsRes, usersRes, settingsRes] = await Promise.all([
            fetch(getApiUrl('/api/admin/stats'), { headers: { 'Authorization': `Bearer ${authToken}` } }).then(r => r.json()),
            fetch(getApiUrl(`/api/admin/users${adminSearch ? `?search=${encodeURIComponent(adminSearch)}` : ''}`), { headers: { 'Authorization': `Bearer ${authToken}` } }).then(r => r.json()),
            fetch(getApiUrl('/api/admin/settings'), { headers: { 'Authorization': `Bearer ${authToken}` } }).then(r => r.json())
          ]);

          if (statsRes.success) setAdminStats(statsRes.stats);
          if (usersRes.success) setAdminUsers(usersRes.users);
          if (settingsRes.success) setAdminSettingsState(settingsRes.settings);
        } catch (e) {
          console.error('Fetch admin data error:', e);
        } finally {
          setIsLoadingAdmin(false);
        }
      };

      // تبديل صلاحية مفتاح السيرفر لمستخدم معين في لوحة المشرف
      const handleToggleUserAiAccess = async (userId, currentStatus) => {
        try {
          const res = await fetch(getApiUrl(`/api/admin/users/${userId}/toggle-ai`), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({ hasAccess: !currentStatus })
          });
          const data = await res.json();
          if (data.success) {
            setAdminUsers(prev => prev.map(u => u.id === userId ? { ...u, has_server_ai_access: currentStatus ? 0 : 1 } : u));
          }
        } catch (e) {
          alert('فشل تعديل الصلاحية: ' + e.message);
        }
      };

      // حفظ مفتاح السيرفر في قاعدة البيانات من لوحة المشرف
      const handleSaveServerAiKey = async () => {
        if (!serverGeminiInput.trim()) return;
        try {
          const res = await fetch(getApiUrl('/api/admin/settings'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({ geminiKey: serverGeminiInput.trim() })
          });
          const d = await res.json();
          if (d.success) {

            setServerGeminiInput('');
            fetchAdminData();
          }
        } catch (e) {
          alert('فشل حفظ المفتاح: ' + e.message);
        }
      };

      // اختبار مفتاح السيرفر من لوحة المشرف
      const handleTestServerAi = async () => {
        try {
          const res = await fetch(getApiUrl('/api/admin/test-ai'), {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${authToken}` }
          });

        }
      };

      // تسجيل الدخول التجريبي السريع (Dev/Demo Login)
      const handleDevLogin = async (email, name, role = 'user') => {
        try {
          const res = await fetch(getApiUrl('/api/auth/dev-login'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
