      justify-content: space-between;

      'يرجى كتابة إجابتك أولاً يا بطل! ✍️': 'Please write your answer first, champion! ✍️',
      'تنبيه إدخال': 'Input notice',
      'تنبيه الميكروفون': 'Microphone notice',
      'خاصية الإملاء الصوتي غير مدعومة في هذا المتصفح. على iPad يرجى استخدام متصفح Safari والتأكد من تفعيل الميكروفون والإملاء في الإعدادات.': 'Voice dictation is not supported in this browser. On iPad, use Safari and enable the microphone and dictation in settings.',
      'إذن الميكروفون في iPad': 'iPad microphone permission',
      'يرجى السماح لـ Safari بالوصول للميكروفون وتفعيل "تمكين الإملاء" (Enable Dictation) في إعدادات لوحة المفاتيح على iPad.': 'Allow Safari to access the microphone and turn on Enable Dictation in your iPad keyboard settings.',
      'اتصال الميكروفون': 'Microphone connection',
      'يتطلب التعرف على الصوت في iPad اتصالاً مستقراً بالإنترنت لمعالجة الإملاء.': 'Speech recognition on iPad requires a stable internet connection to process dictation.',
      'يرجى إدخال معرف مشروع Google Cloud (Project ID)': 'Enter your Google Cloud Project ID',
      'يرجى إدخال مفتاح Gemini API لجلب النماذج': 'Enter a Gemini API key to fetch models',
      'خطأ في جلب النماذج: {status}': 'Error fetching models: {status}',
      'خطأ من الخادم ({status})': 'Server error ({status})',
      'لم يصل رد صالح من الذكاء الاصطناعي.': 'No valid response was received from AI.',
      'لم يتم كتابة إجابة.': 'No answer was entered.',
      'إجابة عبقرية ومطابقة تماماً للمفهوم المطلوب! 🌟': 'Brilliant answer — an exact match for the required concept! 🌟',
      'إجابة مقبولة! 👍': 'Accepted answer! 👍',
      'الإجابة غير مكتملة.': 'The answer is incomplete.',
      'إجابة رائعة! مفهومك صحيح ودقيق (85% فأكثر) بالرغم من تفاوت الصياغة 🌟': 'Great answer! Your concept is correct and accurate (85% or higher), despite differences in wording 🌟',
      'إجابة تحتاج إلى مزيد من الدقة والتوضيح (أقل من 85%) مقارنة بالإجابة النموذجية 💡': 'Your answer needs more accuracy and detail (below 85%) compared with the reference answer 💡',
      'إجابة صحيحة ومفهومك دقيق وممتاز (85%+)! 👏': 'Correct answer with an accurate, excellent concept (85%+)! 👏',
      'الإجابة تحتاج إلى مزيد من الدقة والوضوح (أقل من 85%).': 'The answer needs more accuracy and clarity (below 85%).'
    };
    const UI_DICTIONARIES = {
      ar: Object.fromEntries(Object.keys(UI_EN).map(key => [key, key])),
      en: UI_EN
    };
    const readUiLanguage = () => {
      try { return localStorage.getItem('fl_ui_language') === 'en' ? 'en' : 'ar'; }
      catch (_) { return 'ar'; }
    };
    let currentUiLanguage = readUiLanguage();
    // Descriptors are stored in UI state so an open toast/report switches immediately too.
    const uiText = (key, values = {}) => ({ uiKey: key, uiValues: values });
    // Explicit UI error values translate at render time; API text stays verbatim.
    const uiErrorText = (message) => ({ uiErrorText: String(message ?? '') });
    const translateUi = (input, values = {}, language = currentUiLanguage) => {
      if (input == null) return '';
      const descriptor = typeof input === 'object' && input.uiKey;
      const key = descriptor ? input.uiKey : String(input);
      const params = descriptor ? input.uiValues : values;
      const dictionary = UI_DICTIONARIES[language] || UI_DICTIONARIES.ar;
      const text = dictionary[key] || key;
      return text.replace(/\{(\w+)\}/g, (match, name) => {
        if (!Object.prototype.hasOwnProperty.call(params, name)) return match;
        const value = params[name];
        // Only explicit nested UI descriptors are translated; user/API values stay verbatim.
        if (value && typeof value === 'object' && 'uiErrorText' in value) {
          return translateUiError(value.uiErrorText, language);
        }
        return value && typeof value === 'object' && value.uiKey
          ? translateUi(value, {}, language) : String(value ?? '');
      });
    };
    // UI-authored errors remain Arabic internally (existing error classification is unchanged).
    // Display only known UI strings; never run this helper over material or API feedback.
    const translateUiError = (input, language = currentUiLanguage) => {
      if (input && typeof input === 'object') return translateUi(input, {}, language);
      const text = String(input ?? '');
      if (UI_EN[text]) return translateUi(text, {}, language);
      const models = text.match(/^خطأ في جلب النماذج: (\d+)$/);
      if (models) return translateUi('خطأ في جلب النماذج: {status}', { status: models[1] }, language);
      const server = text.match(/^خطأ من الخادم \((\d+)\)$/);
      if (server) return translateUi('خطأ من الخادم ({status})', { status: server[1] }, language);
      return text;
    };

    // === محرك المؤثرات الصوتية والموسيقى العصبية التوليدية (Neuro-Acoustic Engine - Web Audio API) ===
    let audioCtx = null;
    let mainGain = null;
    let bgOscillators = [];
    let bgNoiseNode = null;
    let melodyTimer = null;
    let nextNoteTime = 0;
    let activeBinauralType = 'gamma'; // 'gamma' (40Hz) | 'alpha' (10Hz)

    const initAudio = () => {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn("Audio init warning:", e);
      }
    };

    const playTone = (freq, type, duration, vol = 0.1) => {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    };

    const playClick = () => playTone(600, 'sine', 0.08, 0.05);
    
    // نغمة كشف البطاقة (Card Flip & Reveal Tone)
    const playFlipTone = () => {
      if (!audioCtx) return;
      try {
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(580, t + 0.12);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
      } catch(e){}
    };

    // نغمة السحر والوميض لمفتاح الحفظ (Mnemonic Magic Sparkle)
    const playSparkleTone = () => {
      if (!audioCtx) return;
      try {
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((f, i) => {
          setTimeout(() => playTone(f, 'sine', 0.18, 0.06), i * 55);
        });
      } catch(e){}
    };

    // نغمة التثبيت الدائم في الذاكرة (Memory Mastered Level-Up)
    const playMasteredTone = () => {
      if (!audioCtx) return;
      try {
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((f, i) => {
          setTimeout(() => playTone(f, 'triangle', 0.25, 0.09), i * 90);
        });
      } catch(e){}
    };

    // نغمة سلاسل الإتقان المتتالية (Streak Multiplier Chime)
    const playStreakTone = (streakCount = 2) => {
      if (!audioCtx) return;
      try {
        const base = 440 + Math.min(streakCount * 60, 400);
        playTone(base, 'triangle', 0.12, 0.1);
        setTimeout(() => playTone(base * 1.25, 'triangle', 0.15, 0.12), 80);
        setTimeout(() => playTone(base * 1.5, 'sine', 0.3, 0.15), 160);
      } catch(e){}
    };

    // نغمة الرنين الذاكرتي التوافقي (Targeted Memory Reactivation - TMR Acoustic Anchor)
    // نغمات خماسية عذبة ترتبط بكل سؤال لا شعورياً وتُعاد برقة أثناء الاختبار لتحفيز التذكر الفوري
    const memoryChords = [
      [261.63, 392.00], // C4 - G4
      [293.66, 440.00], // D4 - A4
      [329.63, 493.88], // E4 - B4
      [349.23, 523.25], // F4 - C5
      [392.00, 587.33]  // G4 - D5
    ];
    const playMemoryAnchor = (seedIndex = 0) => {
      if (!audioCtx) return;
      try {
        const chord = memoryChords[Math.abs(seedIndex) % memoryChords.length];
        const t = audioCtx.currentTime;
        chord.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.045, t + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0005, t + 1.2 + idx * 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 1.5);
        });
      } catch(e){}
    };

    const playCorrect = () => {
      playTone(523.25, 'sine', 0.1, 0.12);
      setTimeout(() => playTone(659.25, 'sine', 0.1, 0.12), 100);
      setTimeout(() => playTone(783.99, 'sine', 0.3, 0.15), 200);
    };
    const playWrong = () => {
      playTone(300, 'triangle', 0.15, 0.12);
      setTimeout(() => playTone(240, 'triangle', 0.25, 0.12), 120);
    };
    const playWin = () => {
      playTone(523.25, 'triangle', 0.18, 0.12);
      setTimeout(() => playTone(659.25, 'triangle', 0.18, 0.12), 180);
      setTimeout(() => playTone(783.99, 'triangle', 0.18, 0.12), 360);
      setTimeout(() => playTone(1046.50, 'triangle', 0.5, 0.18), 540);
    };

    // توليد ضوضاء وردية ناعمة لعزل الضوضاء المحيطة وتصفية الذهن (Soothing Pink Noise Floor)
    const createPinkNoiseBuffer = (ctx) => {
      const bufferSize = ctx.sampleRate * 2;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.08;
        b6 = white * 0.115926;
      }
      return buffer;
    };

    // موسيقى التركيز العلمي: موجات غاما (40Hz Gamma Focus) وموجات ألفا (10Hz Alpha Flow) مع الضوضاء الوردية المهدئة
    const startAmbientMusic = (mode = 'gamma') => {
      initAudio();
      if (!audioCtx) return;
      if (mainGain) stopAmbientMusic();
      activeBinauralType = mode;
      try {
        mainGain = audioCtx.createGain();
        mainGain.gain.value = 0.22;
        mainGain.connect(audioCtx.destination);

        const delayNode = audioCtx.createDelay();
        delayNode.delayTime.value = 0.8;
        const delayFeedback = audioCtx.createGain();
        delayFeedback.gain.value = 0.38;
        delayNode.connect(delayFeedback);
        delayFeedback.connect(delayNode);
        delayNode.connect(mainGain);

        const createLayer = (freq, panValue, type, vol, useDelay = false) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          let panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : audioCtx.createGain();
          if (panner.pan) panner.pan.value = panValue;
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.value = vol;
          osc.connect(gain);
          gain.connect(panner);
          panner.connect(mainGain);
          if (useDelay) panner.connect(delayNode);
          osc.start();
          bgOscillators.push(osc);
          return osc;
        };

        if (mode === 'gamma') {
          // موجات غاما 40Hz: أثبتت الأبحاث دورها في الربط العصبي (Feature Binding) وتثبيت الذاكرة وسرعة المعالجة
          // الأذن اليسرى 200Hz والأذن اليمنى 240Hz (فارق 40Hz دقيق)
          createLayer(200.0, -0.9, 'sine', 0.28);
          createLayer(240.0, 0.9, 'sine', 0.28);
          createLayer(100.0, 0.0, 'triangle', 0.14);
        } else {
          // موجات ألفا 10Hz: للاسترخاء والتدفق الذهني الخالي من التوتر
          // الأذن اليسرى 261.63Hz والأذن اليمنى 271.63Hz (فارق 10Hz)
          createLayer(261.63, -0.9, 'sine', 0.30);
          createLayer(271.63, 0.9, 'sine', 0.30);
          createLayer(130.81, -0.3, 'triangle', 0.16);
        }

        // تشغيل عازل الضوضاء الوردية الناعمة (Pink Noise Floor) بدرجة مسموعة ومريحة (مثل صوت المطر الهادئ)
        try {
          const noiseBuffer = createPinkNoiseBuffer(audioCtx);
          bgNoiseNode = audioCtx.createBufferSource();
          bgNoiseNode.buffer = noiseBuffer;
          bgNoiseNode.loop = true;
          const noiseFilter = audioCtx.createBiquadFilter();
          noiseFilter.type = 'lowpass';
          noiseFilter.frequency.value = 550; // تردد دافئ ومريح
          bgNoiseGainNode = audioCtx.createGain();
          const currentNoiseVol = parseFloat(localStorage.getItem('pink_noise_volume') || '0.08');
          const isNoiseEnabled = localStorage.getItem('pink_noise_enabled') !== 'false';
          bgNoiseGainNode.gain.value = isNoiseEnabled ? currentNoiseVol : 0;
          bgNoiseNode.connect(noiseFilter);
          noiseFilter.connect(bgNoiseGainNode);
          bgNoiseGainNode.connect(mainGain);
          bgNoiseNode.start();
        } catch(noiseErr) {
          console.warn("Pink noise init skipped:", noiseErr);
        }

        // ألحان تأملية خماسية لطيفة متباعدة
        const scale = mode === 'gamma' 
          ? [261.63, 329.63, 392.00, 523.25, 659.25] // نغمات مشرقة
          : [220.00, 261.63, 293.66, 329.63, 440.00]; // نغمات هادئة
        nextNoteTime = audioCtx.currentTime + 0.8;

        const scheduleMelody = () => {
          if (!mainGain || !audioCtx) return;
          while (nextNoteTime < audioCtx.currentTime + 0.15) {
            const freq = scale[Math.floor(Math.random() * scale.length)];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, nextNoteTime);
            gain.gain.linearRampToValueAtTime(0.16, nextNoteTime + 0.4);
            gain.gain.exponentialRampToValueAtTime(0.001, nextNoteTime + 4.2);
            osc.connect(gain);
            gain.connect(mainGain);
            gain.connect(delayNode);
            osc.start(nextNoteTime);
            osc.stop(nextNoteTime + 4.2);
            nextNoteTime += 2.0 + Math.random() * 2.5;
          }
          melodyTimer = setTimeout(scheduleMelody, 120);
        };
        scheduleMelody();
      } catch (e) {
        console.warn("Ambient music error:", e);
      }
    };

    const stopAmbientMusic = () => {
      try {
        bgOscillators.forEach(osc => { try { osc.stop(); } catch(e){} });
        bgOscillators = [];
        if (bgNoiseNode) {
          try { bgNoiseNode.stop(); } catch(e){}
          bgNoiseNode = null;
        }
        bgNoiseGainNode = null;
        if (melodyTimer) clearTimeout(melodyTimer);
        if (mainGain) { mainGain.disconnect(); mainGain = null; }
      } catch (e) {}
    };

    // إطلاق الاحتفالات
    const triggerConfetti = () => {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 50,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#3b82f6']
        });
      }
    };

    // Local HTML previews still need the Node API; hosted pages stay same-origin.
    const getApiUrl = (endpoint) => {
      const isLocalFile = window.location.protocol === 'file:';
      const isSubpath = /^\/fast-learning(?:\/|$)/.test(window.location.pathname);
      const base = isLocalFile ? 'http://localhost:3000/api' : (isSubpath ? '/fast-learning/api' : '/api');
      const clean = endpoint.startsWith('/api') ? endpoint.substring(4) : (endpoint.startsWith('/') ? endpoint : '/' + endpoint);
      return base + (clean.startsWith('/') ? clean : '/' + clean);
    };

    // طلبات API مع إعادة المحاولة
    const fetchWithRetry = async (url, options, retries = 4) => {
      let delay = 1000;
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) {
            const errorBody = await response.text();
            throw new Error(`HTTP ${response.status}: ${errorBody}`);
          }
          return await response.json();
        } catch (error) {
          if (i === retries - 1) throw error;
          await new Promise(res => setTimeout(res, delay));
          delay *= 2;
        }
      }
    };

    // AI is configured on the server; guests use the same endpoint as accounts.
    const requestAiCompletion = async ({ purpose = 'brain', payload, signal = null }) => {
      const headers = { 'Content-Type': 'application/json' };
      const token = localStorage.getItem('auth_token');
      if (token) headers.Authorization = `Bearer ${token}`;
      let res;
      try {
        res = await fetch(getApiUrl('/ai/generate'), {
          method: 'POST',
          headers,
          body: JSON.stringify({ purpose, payload }),
          signal
        });
      } catch (error) {
        if (error.name === 'AbortError') throw error;
        throw new Error(window.location.protocol === 'file:'
          ? 'تعذر الاتصال بالخادم المحلي. شغّل npm start من مجلد المشروع ثم افتح http://localhost:3000.'
          : 'تعذر الاتصال بخادم التطبيق. تحقق من اتصال الشبكة وتشغيل الخادم ثم حاول مرة أخرى.');
      }
      let json;
      try {
        json = await res.json();
      } catch (_) {
        throw new Error('استجابة الخادم غير صالحة. تحقق من تشغيل خادم التطبيق وتوجيه مسار API إليه.');
      }
      if (!res.ok) {
        throw new Error(json.message || `خطأ من الخادم (${res.status})`);
      }
      return json.data || json;
    };

    // بناء أجزاء المحتوى للذكاء الاصطناعي مع دعم دمج عدة صور ومستندات ونصوص في جلسة موحدة
    const buildContentsParts = (prompt, material) => {
      const parts = [{ text: prompt }];
      if (!material) return parts;

      if (material.type === 'text') {
        parts.push({ text: `\n--- محتوى المادة التعليمية ---\n${material.data}` });
      } else if (material.type === 'file') {
        parts.push({ inlineData: { mimeType: material.mimeType, data: material.data } });
      } else if (material.type === 'multi' && Array.isArray(material.items)) {
        parts.push({ 
          text: `\n--- محتوى المادة التعليمية الموحدة (مكون من ${material.items.length} مرفقات وصور تم دمجها معاً في جلسة تعليمية واحدة كاملة) ---` 
        });
        material.items.forEach((item, idx) => {
          if (item.type === 'text') {
            parts.push({ text: `\n[المرفق ${idx + 1}: ${item.name || 'مستند نصي'}]\n${item.data}` });
          } else if (item.data) {
            parts.push({ text: `\n[المرفق ${idx + 1}: ${item.name || 'صورة / مستند مرفق'}]` });
            parts.push({ 
              inlineData: { 
                mimeType: item.mimeType || 'image/jpeg', 
                data: item.data 
              } 
            });
          }
        });
      }
      return parts;
    };

    // === محرك الصوت والذاكرة المؤقتة الذكية والتسريع الفائق (Ultra-Fast TTS Engine) ===
    const voiceCache = {}; // cacheKey -> { data, mimeType, buffer }
    const inFlightAudioFetches = {}; // cacheKey -> Promise
    let currentAudioSource = null;
    let currentHtmlAudio = null;
    let activeSpeechId = 0;
    let activeAbortController = null;

    // إيقاف أي صوت أو نطق جاري فوراً لمنع التداخل (Overlap)
    const stopAllSpeech = () => {
      if (activeAbortController) {
        try { activeAbortController.abort(); } catch(e){}
        activeAbortController = null;
      }
      if (currentAudioSource) {
        try { currentAudioSource.stop(); } catch(e){}
        currentAudioSource = null;
      }
      if (currentHtmlAudio) {
        try { currentHtmlAudio.pause(); currentHtmlAudio.currentTime = 0; } catch(e){}
        currentHtmlAudio = null;
      }
      if ('speechSynthesis' in window) {
        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          window.speechSynthesis.cancel();
        } catch(e){}
      }
      try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
    };

    let bgNoiseGainNode = null;
    const updatePinkNoiseLive = (enabled, vol) => {
      localStorage.setItem('pink_noise_enabled', enabled ? 'true' : 'false');
      localStorage.setItem('pink_noise_volume', String(vol));
      if (bgNoiseGainNode && audioCtx && audioCtx.state !== 'suspended') {
        try {
          bgNoiseGainNode.gain.setValueAtTime(enabled ? vol : 0, audioCtx.currentTime);
        } catch(e){}
      }
    };

    // خوارزمية ذكية لاكتشاف واستئصال ذيل التشويش والهمس (Anti-Hiss Vocoder Truncation & Cosine Fade-out)
    const processPcmBytesAntiHiss = (pcmBytes, sampleRate = 24000) => {
      let len = pcmBytes.length;
      if (len % 2 !== 0) len -= 1;
      const totalSamples = len / 2;
      if (totalSamples < sampleRate * 0.2) return { pcmBytes, len };

      const view = new DataView(pcmBytes.buffer, pcmBytes.byteOffset, len);

      // مسح عكسي دقيق لاكتشاف موضع انتهاء الصوت البشري الفعلي
      // عتبة حساسة تلتقط أدق الهمسات والروابط اللغوية الساكنة (مثل: ة، ت، س، هـ) لمنع قطع أي كلمة
      const windowSize = Math.floor(sampleRate * 0.01); // 10ms = 240 عينة
      const maxScanSamples = Math.min(Math.floor(sampleRate * 0.45), Math.floor(totalSamples * 0.3));

      let lastSpeechSample = -1;
      for (let s = totalSamples - windowSize; s >= totalSamples - maxScanSamples; s -= windowSize) {
        let sum = 0;
        let maxVal = 0;
        for (let k = 0; k < windowSize; k++) {
          const v = Math.abs(view.getInt16((s + k) * 2, true));
          sum += v;
          if (v > maxVal) maxVal = v;
        }
        const avg = sum / windowSize;
        // طاقة الصوت البشري (فوق أرضية التشويش والهمس الرقمي)
        if (avg >= 200 || maxVal >= 550) {
          lastSpeechSample = s + windowSize;
          break;
        }
      }

      let cutSample = totalSamples;
      if (lastSpeechSample !== -1) {
        // حماية تامة لنهاية الكلمة: نضيف هامش أمان مريح لا يقل عن 100ms ليخرج الحرف الأخير كاملاً وطبيعياً دون أي بتر
        const safeMargin = Math.floor(sampleRate * 0.10);
        cutSample = Math.min(totalSamples, lastSpeechSample + safeMargin);
      }

      // تطبيق خفوت ناعم متدرج على آخر 30ms فقط من الملف لمنع أي طقطقة عتادية دون التأثير على الكلمات
      const fadeSamples = Math.min(Math.floor(sampleRate * 0.03), Math.floor(cutSample * 0.1));
      const fadeStart = cutSample - fadeSamples;
      for (let i = 0; i < fadeSamples; i++) {
        const s = fadeStart + i;
        const orig = view.getInt16(s * 2, true);
        const gain = 0.5 * (1 + Math.cos((Math.PI * i) / fadeSamples));
        view.setInt16(s * 2, Math.round(orig * gain), true);
      }

      // تصفير آخر 4ms فقط لضمان الهبوط إلى الصفر المطلق
      const zeroSamples = Math.min(Math.floor(sampleRate * 0.004), fadeSamples);
      for (let s = cutSample - zeroSamples; s < cutSample; s++) {
        view.setInt16(s * 2, 0, true);
      }

      const cleanLen = cutSample * 2;
      const cleanBytes = new Uint8Array(pcmBytes.buffer, pcmBytes.byteOffset, cleanLen);
      return { pcmBytes: cleanBytes, len: cleanLen };
    };

    // تحويل سريع مباشر من Base64 PCM 16-bit 24kHz إلى ArrayBuffer WAV بصيغة RIFF بعد استئصال التشويش
    const base64PcmToWavArrayBuffer = (base64Pcm, sampleRate = 24000, numChannels = 1, bitsPerSample = 16) => {
      try {
        const binaryString = atob(base64Pcm);
        let len = binaryString.length;
        if (len % 2 !== 0) len -= 1; // محاذاة عينات 16-bit
        const pcmBytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) pcmBytes[i] = binaryString.charCodeAt(i);

        const { pcmBytes: cleanPcm, len: cleanLen } = processPcmBytesAntiHiss(pcmBytes, sampleRate);

        const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
        const blockAlign = (numChannels * bitsPerSample) / 8;
        const totalBuffer = new ArrayBuffer(44 + cleanLen);
        const view = new DataView(totalBuffer);

        // "RIFF"
        view.setUint32(0, 0x52494646, false);
        view.setUint32(4, 36 + cleanLen, true);
        view.setUint32(8, 0x57415645, false);

        // "fmt "
        view.setUint32(12, 0x666d7420, false);
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); // PCM format
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitsPerSample, true);

        // "data"
        view.setUint32(36, 0x64617461, false);
        view.setUint32(40, cleanLen, true);

        new Uint8Array(totalBuffer, 44).set(cleanPcm);
        return totalBuffer;
      } catch (err) {
        console.warn("base64PcmToWavArrayBuffer error:", err);
        return null;
      }
    };

    // تحويل Base64 إلى ArrayBuffer عام
    const base64ToArrayBuffer = (base64) => {
      try {
        const binaryString = atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
        return bytes.buffer;
      } catch (e) {
        return null;
      }
    };

    // تنقية AudioBuffer بعد فك التشفير مع الحفاظ التام على مخارج الحروف دون أي بتر إضافي
    const cleanAudioBuffer = (audioBuffer) => {
      return audioBuffer;
    };

    // فك تشفير الصوت مسبقاً وتجهيز AudioBuffer للتشغيل الفوري (<1ms)
    const decodeAudioDataSafely = async (arrayBuffer) => {
      try {
        initAudio();
        if (!audioCtx) return null;
        const copy = arrayBuffer.slice(0);
        const decoded = await new Promise((resolve, reject) => {
          audioCtx.decodeAudioData(copy, resolve, reject);
        });
        return decoded;
      } catch (err) {
        return null;
      }
    };

    // تحويل دفق PCM 16-bit 24kHz الخام إلى ملف WAV قياسي برأس RIFF صالح ليعمل فورياً في جميع المتصفحات مع استئصال التشويش
    const pcmBase64ToWavBase64 = (base64Pcm, sampleRate = 24000, numChannels = 1, bitsPerSample = 16) => {
      try {
        const binaryString = atob(base64Pcm);
        let len = binaryString.length;
        if (len % 2 !== 0) len -= 1;
        const pcmBytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) pcmBytes[i] = binaryString.charCodeAt(i);

        const { pcmBytes: cleanPcm, len: cleanLen } = processPcmBytesAntiHiss(pcmBytes, sampleRate);

        const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
        const blockAlign = (numChannels * bitsPerSample) / 8;
        const wavHeader = new ArrayBuffer(44);
        const view = new DataView(wavHeader);

        view.setUint32(0, 0x52494646, false);
        view.setUint32(4, 36 + cleanLen, true);
        view.setUint32(8, 0x57415645, false);

        view.setUint32(12, 0x666d7420, false);
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitsPerSample, true);

        view.setUint32(36, 0x64617461, false);
        view.setUint32(40, cleanLen, true);

        const fullBytes = new Uint8Array(44 + cleanLen);
        fullBytes.set(new Uint8Array(wavHeader), 0);
        fullBytes.set(cleanPcm, 44);

        let binary = '';
        const chunk = 8192;
        for (let i = 0; i < fullBytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, fullBytes.subarray(i, i + chunk));
        }
        return btoa(binary);
      } catch (err) {
        console.warn("PCM to WAV conversion error:", err);
        return base64Pcm;
      }
    };

    // تشغيل الصوت من Base64 أو AudioBuffer بدون أي تأخير مع غلاف خفوت عتادي لمنع أي تشويش نهائي
    const playBase64Audio = async (base64Data, mimeType = 'audio/wav', speechId = null, preDecodedBuffer = null, spokenText = null) => {
      try {
        initAudio();
        if (speechId !== null && speechId !== activeSpeechId) return;

        // إيقاف أي صوت سابق فوراً
        if (currentAudioSource) {
          try { currentAudioSource.stop(); } catch(e){}
          currentAudioSource = null;
        }
        if (currentHtmlAudio) {
          try { currentHtmlAudio.pause(); currentHtmlAudio.currentTime = 0; } catch(e){}
          currentHtmlAudio = null;
        }

        try { window.__onSpeechStateChange?.({ status: 'speaking', text: spokenText }); } catch(e){}

        const playViaWebAudio = (buf) => {
          const source = audioCtx.createBufferSource();
          source.buffer = buf;
          const gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
          // غلاف هبوط عتادي دقيق على آخر 70ms لضمان صفر طقطقة أو تشويش
          const fadeStart = Math.max(0, buf.duration - 0.02);
          gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime + fadeStart);
          gainNode.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + buf.duration);
          source.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          source.onended = () => {
            if (currentAudioSource === source) {
              currentAudioSource = null;
              try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
            }
          };
          source.start();
          currentAudioSource = source;
        };

        // إذا كان الـ AudioBuffer مفكوكاً مسبقاً، نشغله فوراً بزمن 0ms
        if (preDecodedBuffer && audioCtx && audioCtx.state !== 'suspended') {
          playViaWebAudio(preDecodedBuffer);
          return;
        }

        let audioDataB64 = base64Data;
        let finalMime = mimeType || 'audio/wav';

        let audioBuffer = null;
        if (audioCtx) {
          try {
            let arrayBuf = null;
            if (finalMime.toLowerCase().includes('pcm') || finalMime.toLowerCase().includes('l16')) {
              arrayBuf = base64PcmToWavArrayBuffer(base64Data, 24000);
            } else {
              arrayBuf = base64ToArrayBuffer(base64Data);
            }
            if (arrayBuf) {
              audioBuffer = await decodeAudioDataSafely(arrayBuf);
            }
          } catch (decodeErr) {
            console.warn("audioCtx decodeAudioData fallback to HTML Audio:", decodeErr);
          }
        }

        if (speechId !== null && speechId !== activeSpeechId) return;

        if (audioBuffer && audioCtx && audioCtx.state !== 'suspended') {
          playViaWebAudio(audioBuffer);
          return;
        }

        // تحويل PCM إلى WAV في حال استخدام مشغل المتصفح HTML5
        if (finalMime.toLowerCase().includes('pcm') || finalMime.toLowerCase().includes('l16')) {
          audioDataB64 = pcmBase64ToWavBase64(base64Data, 24000);
          finalMime = 'audio/wav';
        }

        const audio = new Audio(`data:${finalMime};base64,${audioDataB64}`);
        currentHtmlAudio = audio;
        audio.onended = () => {
          if (currentHtmlAudio === audio) {
            currentHtmlAudio = null;
            try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
          }
        };
        audio.onerror = () => {
          if (currentHtmlAudio === audio) {
            currentHtmlAudio = null;
            try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
          }
        };
        await audio.play();
      } catch (e) {
        console.warn("Audio playback failed:", e);
        try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
      }
    };

    // القراءة عبر محرك المتصفح كبديل احتياطي أخير مع تفضيل الأصوات الطبيعية والسرعة المعتدلة
    const speakWithWebSpeech = (text, speechId = null, language = getContentLanguage(text)) => {
      if (!('speechSynthesis' in window)) return;
      if (speechId !== null && speechId !== activeSpeechId) return;

      try {
        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        window.speechSynthesis.cancel();
      } catch(e){}

      const cleanText = text.replace(/[*_#`~\[\]]/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = getSpeechLocale({ language });
      utterance.rate = 1.0;

      const voices = window.speechSynthesis.getVoices() || [];
      const matchingVoices = voices.filter(v => v.lang?.replace('_', '-').split('-')[0].toLowerCase() === language.split('-')[0].toLowerCase());
      const naturalVoice = matchingVoices.find(v => /natural|online|neural|hamed|zariyah|shakir|tariq/i.test(v.name))
        || matchingVoices.find(v => v.lang?.replace('_', '-') === utterance.lang)
        || matchingVoices[0];
      if (naturalVoice) utterance.voice = naturalVoice;

      utterance.onstart = () => {
        try { window.__onSpeechStateChange?.({ status: 'speaking', text: cleanText }); } catch(e){}
      };
      utterance.onend = () => {
        try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
      };
      utterance.onerror = () => {
        try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
      };

      setTimeout(() => {
        if (speechId !== null && speechId !== activeSpeechId) return;
        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          window.speechSynthesis.speak(utterance);
        } catch(e){}
      }, 15);
    };

    // جلب ومعالجة الصوت من API مع التخزين المؤقت وفك التشفير في خطوة واحدة
    // تنظيف وضبط النص لتوليد صوت فصيح نقي ومتقن 100% بدون أي تعتعة أو رموز
    const cleanTextForTts = (text, language = getContentLanguage(text)) => {
      if (!text || typeof text !== 'string') return '';
      return text
        .replace(/\[\s*_{2,}\s*\]|_{2,}|\[\s*\.{3,}\s*\]/g, language.startsWith('ar') ? ' فَـرَاغ ' : ' ... ')
        .replace(/\.{3,}/g, '، ')
        .replace(/[*_#`~\[\]\(\)\{\}<>]/g, ' ')
        .replace(/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '')
        .replace(/\s+/g, ' ')
        .trim();
    };

    const fetchTtsAudio = async (text, signal = null, language = getContentLanguage(text)) => {
      if (!text) return null;
      const spokenCleanText = cleanTextForTts(text, language) || text;
      const cacheKey = `${language}_${spokenCleanText}`;
      if (voiceCache[cacheKey]) return voiceCache[cacheKey];

      if (signal?.aborted) return null;
      const timeoutController = new AbortController();
      const timeoutId = setTimeout(() => timeoutController.abort(), 45000);
      const combinedSignal = signal ? AbortSignal.any([signal, timeoutController.signal]) : timeoutController.signal;
      try {
        const payload = {
          contents: [{ role: 'user', parts: [{ text: spokenCleanText }] }],
          generationConfig: {
            responseModalities: ['AUDIO'],
            speechConfig: { languageCode: getSpeechLocale({ language }) }
          }
        };
        const data = await requestAiCompletion({ purpose: 'tts', payload, signal: combinedSignal });
        const inlineAudio = data.candidates?.[0]?.content?.parts?.find(part => part.inlineData?.data)?.inlineData;
        if (!inlineAudio?.data) return null;
        let audioData = inlineAudio.data;
        let mimeType = inlineAudio.mimeType || 'audio/pcm;rate=24000';
        let arrayBuffer;
        if (/pcm|l16/i.test(mimeType)) {
          const sampleRate = Number(mimeType.match(/rate=(\d+)/i)?.[1]) || 24000;
          arrayBuffer = base64PcmToWavArrayBuffer(audioData, sampleRate);
          audioData = pcmBase64ToWavBase64(audioData, sampleRate);
          mimeType = 'audio/wav';
        } else {
          const binary = atob(audioData);
          arrayBuffer = Uint8Array.from(binary, char => char.charCodeAt(0)).buffer;
        }
        const buffer = arrayBuffer ? await decodeAudioDataSafely(arrayBuffer) : null;
        const result = { data: audioData, mimeType, buffer };
        voiceCache[cacheKey] = result;
        return result;
      } catch (err) {
        if (err.name !== 'AbortError') console.warn('Server narration unavailable:', err);
        return null;
      } finally {
        clearTimeout(timeoutId);
      }
    };

    const prefetchVoice = (text, voiceEnabled = true, language = getContentLanguage(text)) => {
      if (!voiceEnabled || !text) return;
      const cacheKey = `${language}_${cleanTextForTts(text, language) || text}`;
      if (voiceCache[cacheKey] || inFlightAudioFetches[cacheKey]) return;

      inFlightAudioFetches[cacheKey] = fetchTtsAudio(text, null, language)
        .catch(err => {
          console.warn("Prefetch warning:", err);
          return null;
        })
        .finally(() => {
          delete inFlightAudioFetches[cacheKey];
        });
    };

    // توليد الصوت الذكي بنبرة المساعد الصوتي وتشغيله فوراً وبدون أي تأخير
    const speakText = async (text, voiceEnabled = true, language = getContentLanguage(text)) => {
      if (!voiceEnabled || !text) {
        stopAllSpeech();
        return;
      }

      stopAllSpeech();
      const currentSpeechId = ++activeSpeechId;
      activeAbortController = new AbortController();
      const abortSignal = activeAbortController.signal;

      const cacheKey = `${language}_${cleanTextForTts(text, language) || text}`;

      const playDirectBuffer = (buf) => {
        try {
          if (currentAudioSource) { try { currentAudioSource.stop(); } catch(e){} }
          const source = audioCtx.createBufferSource();
          source.buffer = buf;
          const gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
          gainNode.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + 0.015);
          const fadeStart = Math.max(0, buf.duration - 0.02);
          gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime + fadeStart);
          gainNode.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + buf.duration);
          source.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          source.onended = () => {
            if (currentAudioSource === source) {
              currentAudioSource = null;
              try { window.__onSpeechStateChange?.({ status: 'idle', text: null }); } catch(e){}
            }
          };
          try { window.__onSpeechStateChange?.({ status: 'speaking', text }); } catch(e){}
          source.start();
          currentAudioSource = source;
          return true;
        } catch(e) {
          return false;
        }
      };

      // 1. إذا كان الصوت مخزناً وجاهزاً في الذاكرة (من التحميل المسبق): تشغيل فوري بدون أي انتظار (<1ms)
      if (voiceCache[cacheKey]) {
        if (currentSpeechId !== activeSpeechId) return;
        const item = voiceCache[cacheKey];
        if (item.buffer && audioCtx && audioCtx.state !== 'suspended') {
          if (playDirectBuffer(item.buffer)) return;
        }
        await playBase64Audio(item.data, item.mimeType, currentSpeechId, item.buffer, text);
        return;
      }

      // 2. إذا كان الصوت قيد التحميل المسبق حالياً: انتظار نفس الطلب الجاري بدلاً من تكرار الطلب
      if (inFlightAudioFetches[cacheKey]) {
        try {
          try { window.__onSpeechStateChange?.({ status: 'loading', text }); } catch(e){}
          const item = await inFlightAudioFetches[cacheKey];
          if (currentSpeechId !== activeSpeechId) return;
          if (item) {
            if (item.buffer && audioCtx && audioCtx.state !== 'suspended') {
              if (playDirectBuffer(item.buffer)) return;
            }
            await playBase64Audio(item.data, item.mimeType, currentSpeechId, item.buffer, text);
            return;
          }
        } catch(e){}
      }

      // 3. جلب الصوت المباشر من الـ API مع إشعار واجهة المستخدم بحالة التحميل (Loading / Spinning)
      try { window.__onSpeechStateChange?.({ status: 'loading', text }); } catch(e){}
      const result = await fetchTtsAudio(text, abortSignal, language);
      if (currentSpeechId !== activeSpeechId) return;

      if (result) {
        if (result.buffer && audioCtx && audioCtx.state !== 'suspended') {
          if (playDirectBuffer(result.buffer)) return;
        }
        await playBase64Audio(result.data, result.mimeType, currentSpeechId, result.buffer, text);
        return;
      }

      // 4. البديل الفوري بصوت نقي وطبيعي أو محرك المتصفح في حال تعذر الاتصال أو تجاوز الحصة
      if (currentSpeechId === activeSpeechId) {
        speakWithWebSpeech(text, currentSpeechId, language);
      }
    };

    // Content language is independent of the interface setting. AI detects it from
    // the source (including images/PDFs); older saved questions use their own text.
    const getContentLanguage = (content) => {
      if (content && typeof content === 'object' && /^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$/i.test(content.language || '')) {
        return content.language.toLowerCase();
      }
      const text = typeof content === 'string' ? content : (content?.text || content?.clozeText || content?.expectedAnswer || (Array.isArray(content?.options) ? content.options.join(' ') : ''));
      const arabicLetters = (text.match(/[\u0620-\u064A\u066E-\u06D3]/g) || []).length;
      const latinLetters = (text.match(/[a-z]/gi) || []).length;
      return arabicLetters > latinLetters ? 'ar' : 'en';
    };
    const getSpeechLocale = (content) => {
      const language = getContentLanguage(content);
      return language === 'ar' ? 'ar-SA' : language === 'en' ? 'en-US' : language;
    };
    const contentLanguageInstructions = `
LANGUAGE REQUIREMENT (applies to every learner-facing field):
Detect the teaching language from the actual source material, including text in images and PDFs, NOT from these instructions, attachment names, JSON examples, or the app interface.
Write text, options, expectedAnswer, missingWord, clozeText, hint, visualSketch, whyExplanation and coreConcept in that source language. Do not translate the lesson into Arabic just because these instructions/examples are Arabic.
For mixed-language sources, follow the language of the relevant passage for each question, preserving technical terms in their original language.
Include a "language" field on EVERY question with the source language's BCP-47 code (e.g. "en", "ar", "fr"). JSON field names and type identifiers must stay unchanged.
True/false and yes/no options must also use the source language (e.g. ["True", "False"] for English, ["صح", "خطأ"] for Arabic).
`;

    // توحيد وتنظيم هيكل السؤال عبر منظومة علوم الإدراك والذاكرة المتعددة (Multi-Sensory Cognitive Model)
    const normalizeQuestion = (q, idx = 0) => {
      if (!q) return null;
      const hasOptions = Array.isArray(q.options) && q.options.length > 1;
      const isFillBlank = q.type === 'fill_blank' || Boolean(q.missingWord && q.clozeText);
      const isShort = !isFillBlank && (q.type === 'short_answer' || (!hasOptions && Boolean(q.expectedAnswer || !q.options?.length)));
      const finalType = isFillBlank ? 'fill_blank' : (isShort ? 'short_answer' : 'mcq');

      const expected = q.expectedAnswer || (isFillBlank ? (q.missingWord || '') : (hasOptions && typeof q.correct === 'number' ? q.options[q.correct] : '')) || '';
      const missingWord = q.missingWord || (isFillBlank ? expected : '');
      const clozeText = q.clozeText || (isFillBlank && q.text && missingWord ? q.text.replace(missingWord, '[_____]') : (q.text || ''));
      const language = getContentLanguage(q);

      return {
        language,
        id: q.id || `q_${Date.now()}_${idx}_${Math.random().toString(36).substring(2, 7)}`,
        type: finalType,
        text: q.text || '',
        options: Array.isArray(q.options) ? q.options : (isFillBlank && missingWord ? [missingWord] : []),
        correct: typeof q.correct === 'number' ? q.correct : 0,
        expectedAnswer: expected,
        missingWord: missingWord,
        clozeText: clozeText,
        hint: q.hint || '',
        // الرابط البصري الخيالي (Dual Coding Theory - Allan Paivio): ترسيخ صوري خيالي يضاعف مسارات الاسترجاع
        visualSketch: q.visualSketch || q.visualAnchor || q.hint || '',
        // سر الفكرة والتعليل الذاتي (Elaborative Interrogation / Feynman Method): لماذا هذا المفهوم منطقي؟
        whyExplanation: q.whyExplanation || q.explanation || '',
        // الكبسولة الجوهرية (Chunking & Cognitive Load): المفهوم المركزي في 2-3 كلمات
        coreConcept: q.coreConcept || (q.text ? q.text.split(' ').slice(0, 3).join(' ') : ''),

        masteryLevel: typeof q.masteryLevel === 'number' ? q.masteryLevel : 0,
        // معرف الرنين الذاكرتي الصوتي الخماسي (Targeted Memory Reactivation - TMR)
        soundAnchorId: typeof q.soundAnchorId === 'number' ? q.soundAnchorId : (idx % 5),
        reviewQueueCount: typeof q.reviewQueueCount === 'number' ? q.reviewQueueCount : 0
      };
    };

    // فحص ما إذا كان السؤال سؤال إجابة قصيرة (Short Answer)
    const isShortAnswerQuestion = (q) => {
      if (!q) return false;
      return q.type === 'short_answer';
    };

    // فحص ما إذا كان السؤال إكمال فراغ وتوليد نشط (Cloze Deletion / Fill in the blank)
    const isFillBlankQuestion = (q) => {
      if (!q) return false;
      return q.type === 'fill_blank';
    };

    // استخراج النص الصوتي الآمن للسؤال لمنع نطق كلمة الإجابة في أسئلة إكمال الفراغ سلفاً
    const getSpokenQuestionText = (q) => {
      if (!q) return '';
      if (isFillBlankQuestion(q)) {
        const blank = getContentLanguage(q).startsWith('ar') ? '... فراغ ...' : ' ... ';
        if (q.clozeText) {
          return q.clozeText.replace(/\[\s*_{2,}\s*\]|_{2,}/g, blank);
        }
        const word = q.missingWord || q.expectedAnswer;
        if (word && q.text) {
          return q.text.replace(word.trim(), blank);
        }
      }
      return q.text || '';
    };

    // تسوية ومعالجة النصوص العربية للمقارنة الذكية والتقييم المحلي
    const normalizeArabicText = (text) => {
      if (!text) return '';
      return text
        .toString()
        .toLowerCase()
        .replace(/[\u064B-\u065F\u0670]/g, '') // حذف التشكيل والتنوين
        .replace(/[إأآا]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/ؤ/g, 'و')
        .replace(/ئ/g, 'ي')
        .replace(/[^\p{L}\p{N}\s]/gu, ' ') // إزالة علامات الترقيم والرموز
        .replace(/\s+/g, ' ')
        .trim();
    };

    const localEvaluateShortAnswer = (expectedAnswer, studentAnswer, language = getContentLanguage(expectedAnswer)) => {
      const normExpected = normalizeArabicText(expectedAnswer);
      const normStudent = normalizeArabicText(studentAnswer);

      if (!normStudent) {
        return {
          isCorrect: false,
          similarityScore: 0,
          uiFeedback: true,
          language,
          feedback: "لم يتم كتابة إجابة.",
          revisedAnswer: expectedAnswer
        };
      }

      if (normExpected === normStudent || normExpected.includes(normStudent) || normStudent.includes(normExpected)) {
        return {
          isCorrect: true,
          similarityScore: 100,
          uiFeedback: true,
          language,
          feedback: "إجابة عبقرية ومطابقة تماماً للمفهوم المطلوب! 🌟",
          revisedAnswer: expectedAnswer
        };
      }

      const expectedTokens = normExpected.split(/\s+/).filter(w => w.length > 1 && !stopWords.has(w));
      const studentTokens = normStudent.split(/\s+/).filter(w => w.length > 1 && !stopWords.has(w));

      if (expectedTokens.length === 0) {
        const isCorr = normStudent.length > 0;
        return {
          isCorrect: isCorr,
          similarityScore: isCorr ? 85 : 0,
          uiFeedback: true,
          language,
          feedback: isCorr ? "إجابة مقبولة! 👍" : "الإجابة غير مكتملة.",
          revisedAnswer: expectedAnswer
        };
      }

      let matchCount = 0;
      for (const sToken of studentTokens) {
        const matched = expectedTokens.some(eToken => {
          if (eToken === sToken) return true;
          if (eToken.length >= 3 && sToken.length >= 3) {
            if (eToken.includes(sToken) || sToken.includes(eToken)) return true;
          }
          return false;
        });
        if (matched) matchCount++;
      }

      const recall = matchCount / Math.max(expectedTokens.length, 1);
      const precision = matchCount / Math.max(studentTokens.length, 1);
      const score = Math.round(Math.max(recall * 75 + precision * 25, 0));
      // معيار القبول الصارم: 85% أو أكثر
      const isCorrect = score >= 85 || (recall >= 0.85);

      return {
        isCorrect,
        similarityScore: Math.min(score, 100),
        uiFeedback: true,
        language,
        feedback: isCorrect 
          ? "إجابة رائعة! مفهومك صحيح ودقيق (85% فأكثر) بالرغم من تفاوت الصياغة 🌟" 
          : "إجابة تحتاج إلى مزيد من الدقة والتوضيح (أقل من 85%) مقارنة بالإجابة النموذجية 💡",
        revisedAnswer: expectedAnswer
      };
    };

        2. هل سقط أي سؤال أو جزء تعليمي سهواً من المادة؟ إذا نعم، أضفه فوراً بالنوع الملائم لسياق المادة (غالباً mcq أو صح/خطأ إلا إذا كان مقالياً في الأصل).
        3. التدقيق حسب النوع:
           - لأسئلة الاختيار من متعدد وصح/خطأ ("type": "mcq"): تأكد أن حقل "correct" دقيق ومطابق 100% والخيارات صحيحة وواضحة (وإذا كان صح/خطأ فالخيارات بلغة المادة الأصلية).
           - لأسئلة الإجابة القصيرة ("type": "short_answer"): تأكد أن الإجابة النموذجية "expectedAnswer" نموذجية، دقيقة، علمية، وموجزة ومطابقة للمادة تماماً.
        4. دقة نصوص الأسئلة ومفاتيح الحفظ (hint): تأكد من سلامتها لغوياً وإتقان مفتاح الحفظ وتثبيته في ذهن الطالب.
        
        المسودة للمراجعة:
        ${JSON.stringify(draftQuestions)}

        أرجع مصفوفة JSON النهائية المصححة فقط بدون أي نصوص إضافية بنفس الهيكل المعرفي:
        [{ "language", "type", "text", "options", "correct", "expectedAnswer", "missingWord", "clozeText", "hint", "visualSketch", "whyExplanation", "coreConcept" }]
        ${contentLanguageInstructions}
      `;

      const generationConfig = { responseMimeType: "application/json", temperature: 0.1 };

      const payload = {
        contents: [{ role: "user", parts: buildContentsParts(prompt, material) }],
        generationConfig
      };

      const data = await requestAiCompletion({ payload });

      const parts = data.candidates?.[0]?.content?.parts || [];
      const contentPart = parts.find(p => !p.thought && p.text) || parts[parts.length - 1];
      let responseText = contentPart?.text;
      
      if (!responseText) return draftQuestions;
      responseText = responseText.replace(/^```json\s*/i, '').replace(/\s*```$/, '').trim();
      let parsed = JSON.parse(responseText);
      if (!Array.isArray(parsed) && parsed.questions && Array.isArray(parsed.questions)) {
        parsed = parsed.questions;
      }
      return (parsed || []).map(normalizeQuestion).filter(Boolean);
    };

      // تنظيف وإلغاء أي تحديد مسبق وإعادة ضبط الاسترجاع النشط والتنبيه الصوتي الذاكرتي الخفي (TMR)
      // مع إخفاء الملاحظات والإنذارات تلقائياً عند الانتقال لسؤال أو مرحلة جديدة
      useEffect(() => {

      // تحميل مسبق فوري في الخلفية لصوت السؤال القادم ولصوت النتيجة النهائية لتصفير زمن التأخير (Zero-Delay Voice Engine)
      useEffect(() => {

            const totalQ = shuffledQuestions.length;

            prefetch(getFinishSpeechText(playerName, scoreWin, totalQ, Math.round((scoreWin / totalQ) * 100)));

        } else if (mode === 'learn' && questionsData[currentIndex + 1]) {

      }, [currentIndex, mode, shuffledQuestions, questionsData, voiceEnabled, score, playerName]);

      // استعادة الجلسة في حالة إعادة التحميل أو قلب شاشة الآيباد
      useEffect(() => {

      // حفظ الجلسة المستمرة
      useEffect(() => {

            }));

      }, [playerName, mode, questionsData, allOriginalQuestions, wrongQuestions, currentIndex, score, timeLeft, timerActive, generationStatus, shuffledQuestions]);

      useEffect(() => {

      const formatTime = (seconds) => {

      // نافذة التحذير قبل مسح المادة ورفع ملف جديد

      // معالجة البيانات عبر الذكاء الاصطناعي المُدار في السيرفر، بما في ذلك الضيوف.

            || (textInput ? textInput.trim().slice(0, 30) + '...' : null)

            speechText: welcomeSpeech,

      // تنسيق حجم الملف للعرض البصري الجميل
      const formatFileSize = (bytes) => {
        if (!bytes || bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
      };

      // قراءة الملف بصيغة Base64
      const readFileAsBase64 = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const res = reader.result;
            const base64 = typeof res === 'string' ? res.split(',')[1] : '';

          reader.onerror = (err) => reject(err);
          reader.readAsDataURL(file);
        });

      // تحسين أبعاد الصور الضخمة المأخوذة بكاميرا الهاتف/الآيباد لتسريع الرفع والتوليد
      const optimizeImageFile = async (file) => {
        if (!file.type.startsWith('image/')) return file;
        if (file.size < 2.5 * 1024 * 1024) return file;
        try {
          const bitmap = await createImageBitmap(file);
          const maxDimension = 1800;
          if (bitmap.width <= maxDimension && bitmap.height <= maxDimension) return file;
          let w = bitmap.width;
          let h = bitmap.height;
          if (w > h) {
            h = Math.round((h * maxDimension) / w);
            w = maxDimension;
          } else {
            w = Math.round((w * maxDimension) / h);
            h = maxDimension;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(bitmap, 0, 0, w, h);
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.88));
          if (blob) {
            return new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' });
          }
        } catch (e) {
          console.warn("Image optimization fallback:", e);
        }
        return file;
      };

      // معالجة اختيار ملفات وصور متعددة (تراكمية)
      const handleFilesSelected = (fileList) => {

            id: Math.random().toString(36).substring(2, 9) + Date.now(),

            name: file.name,
            size: file.size,
            type: file.type || (isPDF ? 'application/pdf' : isImage ? 'image/jpeg' : ''),
            isImage,
            isPDF,
            isWord,
            previewUrl

        }).filter(f => f.isImage || f.isPDF || f.isWord);

        if (processed.length === 0) {

      const handleRemoveFile = (idToRemove) => {

      const handleClearAllFiles = () => {

        if (soundEnabled) playClick();

      // دمج ومعالجة كافة الملفات والصور المختارة في مادة موحدة وبدء استخراج الأسئلة
      const handleProcessAllFiles = async () => {
        if (selectedFiles.length === 0) {
          const msg = "يرجى اختيار صورة أو ملف واحد على الأقل قبل بدء التوليد.";
          setErrorMsg(msg);
          setErrorAnnouncement({ type: 'Selection Required', message: msg });
          return;
        }

        setIsProcessingFiles(true);
        setErrorMsg("");
        if (soundEnabled) playClick();

        try {
          const items = [];
          for (let i = 0; i < selectedFiles.length; i++) {
            const item = selectedFiles[i];
            let f = item.file;

            if (item.isWord) {
              if (!window.mammoth) {
                throw new Error("جاري تحميل مكتبة قراءة ملفات Word، يرجى المحاولة بعد قليل.");
              }
              const arrayBuffer = await f.arrayBuffer();
              const result = await window.mammoth.extractRawText({ arrayBuffer });
              const extractedText = (result.value || '').trim();
              if (extractedText) {
                items.push({
                  type: 'text',
                  name: f.name || `مستند ${i + 1}`,
                  data: extractedText
                });
              }
            } else {
              // تحسين الصورة إذا كانت ضخمة
              if (item.isImage) {
                f = await optimizeImageFile(f);

              const base64Data = await readFileAsBase64(f);
              if (base64Data) {
                items.push({
                  type: 'file',
                  name: f.name || `مرفق ${i + 1}`,
                  mimeType: f.type || (item.isPDF ? 'application/pdf' : 'image/jpeg'),
                  data: base64Data
                });
              }
            }

          }

          // بناء حمولة المادة الموحدة (Composite Session Payload)
          const fileTitle = selectedFiles.map(f => f.name || f.file?.name).filter(Boolean).join(' + ');
          const materialPayload = {
            type: 'multi',
            title: fileTitle || 'مادة مرفوعة',
            items
          };

          await processMaterial(materialPayload);
        } catch (err) {
          console.error("Multi-file processing error:", err);
          setErrorMsg(err.message || "حدث خطأ أثناء قراءة ومعالجة الملفات.");
          setErrorAnnouncement({ type: 'File Process Error', message: err.message || 'حدث خطأ أثناء معالجة الملفات.' });
        } finally {
          setIsProcessingFiles(false);
        }
      };

      const handleTextSubmit = async () => {
        if (!textInput.trim()) {
          const err = "الرجاء كتابة أو لصق نص المادة أو الأسئلة.";

          setErrorAnnouncement({ type: 'Input Error', message: err });
          return;

        await processMaterial({
          type: 'text',
          title: textInput.trim().slice(0, 30) + (textInput.trim().length > 30 ? '...' : ''),
