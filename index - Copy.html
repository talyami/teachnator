  <title>المولد الذكي للاختبارات 🧠✨</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {

          fontFamily: {

          },

            'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons for universal browser compatibility -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- Mammoth.js for Word (.docx) support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: linear-gradient(135deg, #eef2ff 0%, #f1f5f9 50%, #e0e7ff 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

      animation: float 4s ease-in-out infinite;
    }

<body class="selection:bg-indigo-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // === محرك المؤثرات الصوتية والموسيقى التوليدية (Web Audio API) ===
    let audioCtx = null;
    let mainGain = null;
    let bgOscillators = [];
    let melodyTimer = null;
    let nextNoteTime = 0;

    const initAudio = () => {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn("Audio init warning:", e);
      }
    };

    const playTone = (freq, type, duration, vol = 0.1) => {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    };

    const playClick = () => playTone(600, 'sine', 0.08, 0.05);
    const playCorrect = () => {
      playTone(523.25, 'sine', 0.1, 0.12);
      setTimeout(() => playTone(659.25, 'sine', 0.1, 0.12), 100);
      setTimeout(() => playTone(783.99, 'sine', 0.3, 0.15), 200);
    };
    const playWrong = () => {
      playTone(300, 'triangle', 0.15, 0.12);
      setTimeout(() => playTone(240, 'triangle', 0.25, 0.12), 120);
    };
    const playWin = () => {
      playTone(523.25, 'triangle', 0.18, 0.12);
      setTimeout(() => playTone(659.25, 'triangle', 0.18, 0.12), 180);
      setTimeout(() => playTone(783.99, 'triangle', 0.18, 0.12), 360);
      setTimeout(() => playTone(1046.50, 'triangle', 0.5, 0.18), 540);
    };

    // موسيقى التركيز (Binaural Beats ألفا 8Hz + سلم دو الكبير)
    const startAmbientMusic = () => {
      initAudio();
      if (!audioCtx || mainGain) return;
      try {
        mainGain = audioCtx.createGain();
        mainGain.gain.value = 0.18;
        mainGain.connect(audioCtx.destination);

        const delayNode = audioCtx.createDelay();
        delayNode.delayTime.value = 0.8;
        const delayFeedback = audioCtx.createGain();
        delayFeedback.gain.value = 0.38;
        delayNode.connect(delayFeedback);
        delayFeedback.connect(delayNode);
        delayNode.connect(mainGain);

        const createLayer = (freq, panValue, type, vol, useDelay = false) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          let panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : audioCtx.createGain();
          if (panner.pan) panner.pan.value = panValue;
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.value = vol;
          osc.connect(gain);
          gain.connect(panner);
          panner.connect(mainGain);
          if (useDelay) panner.connect(delayNode);
          osc.start();
          bgOscillators.push(osc);
          return osc;
        };

        // 8Hz فرق التردد لموجات الألفا الدماغية (261.63Hz vs 269.63Hz)
        createLayer(261.63, -0.9, 'sine', 0.32);
        createLayer(269.63, 0.9, 'sine', 0.32);
        createLayer(130.81, -0.4, 'triangle', 0.18);
        createLayer(196.00, 0.4, 'triangle', 0.14);

        const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 659.25];
        nextNoteTime = audioCtx.currentTime + 0.8;

        const scheduleMelody = () => {
          if (!mainGain || !audioCtx) return;
          while (nextNoteTime < audioCtx.currentTime + 0.15) {
            const freq = scale[Math.floor(Math.random() * scale.length)];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, nextNoteTime);
            gain.gain.linearRampToValueAtTime(0.18, nextNoteTime + 0.4);
            gain.gain.exponentialRampToValueAtTime(0.001, nextNoteTime + 4.5);
            osc.connect(gain);
            gain.connect(mainGain);
            gain.connect(delayNode);
            osc.start(nextNoteTime);
            osc.stop(nextNoteTime + 4.5);
            nextNoteTime += 1.8 + Math.random() * 2.5;
          }
          melodyTimer = setTimeout(scheduleMelody, 120);
        };
        scheduleMelody();
      } catch (e) {
        console.warn("Ambient music error:", e);
      }
    };

    const stopAmbientMusic = () => {
      try {
        bgOscillators.forEach(osc => { try { osc.stop(); } catch(e){} });
        bgOscillators = [];
        if (melodyTimer) clearTimeout(melodyTimer);
        if (mainGain) { mainGain.disconnect(); mainGain = null; }
      } catch (e) {}
    };

    // إطلاق الاحتفالات
    const triggerConfetti = () => {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 50,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#3b82f6']
        });
      }
    };

    // طلبات API مع إعادة المحاولة
    const fetchWithRetry = async (url, options, retries = 4) => {
      let delay = 1000;
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) {
            const errorBody = await response.text();
            throw new Error(`HTTP ${response.status}: ${errorBody}`);
          }
          return await response.json();
        } catch (error) {
          if (i === retries - 1) throw error;
          await new Promise(res => setTimeout(res, delay));
          delay *= 2;
        }
      }
    };

    const buildContentsParts = (prompt, material) => {
      const parts = [{ text: prompt }];
      if (material.type === 'text') {
        parts.push({ text: `\n--- محتوى المادة التعليمية ---\n${material.data}` });
      } else {
        parts.push({ inlineData: { mimeType: material.mimeType, data: material.data } });
      }
      return parts;
    };

    // ذاكرة تخزين مؤقت للصوتيات لتجنب تكرار استدعاءات API
    const voiceCache = {};
    let currentAudioSource = null;
    let currentHtmlAudio = null;
    let activeSpeechId = 0;
    let activeAbortController = null;

    // إيقاف أي صوت أو نطق جاري فوراً لمنع التداخل (Overlap)
    const stopAllSpeech = () => {
      if (activeAbortController) {
        try { activeAbortController.abort(); } catch(e){}
        activeAbortController = null;
      }
      if (currentAudioSource) {
        try { currentAudioSource.stop(); } catch(e){}
        currentAudioSource = null;
      }
      if (currentHtmlAudio) {
        try { currentHtmlAudio.pause(); currentHtmlAudio.currentTime = 0; } catch(e){}
        currentHtmlAudio = null;
      }
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch(e){}
      }
    };

    // تحويل دفق PCM 16-bit 24kHz الخام إلى ملف WAV قياسي برأس RIFF صالح ليعمل فورياً في جميع المتصفحات
    const pcmBase64ToWavBase64 = (base64Pcm, sampleRate = 24000, numChannels = 1, bitsPerSample = 16) => {
      try {
        const binaryString = atob(base64Pcm);
        const len = binaryString.length;
        const pcmBytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) pcmBytes[i] = binaryString.charCodeAt(i);

        const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
        const blockAlign = (numChannels * bitsPerSample) / 8;
        const wavHeader = new ArrayBuffer(44);
        const view = new DataView(wavHeader);

        // "RIFF"
        view.setUint32(0, 0x52494646, false);
        view.setUint32(4, 36 + len, true);
        view.setUint32(8, 0x57415645, false);

        // "fmt "
        view.setUint32(12, 0x666d7420, false);
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitsPerSample, true);

        // "data"
        view.setUint32(36, 0x64617461, false);
        view.setUint32(40, len, true);

        const fullBytes = new Uint8Array(44 + len);
        fullBytes.set(new Uint8Array(wavHeader), 0);
        fullBytes.set(pcmBytes, 44);

        let binary = '';
        const chunk = 8192;
        for (let i = 0; i < fullBytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, fullBytes.subarray(i, i + chunk));
        }
        return btoa(binary);
      } catch (err) {
        console.warn("PCM to WAV conversion error:", err);
        return base64Pcm;
      }
    };

    // تعيين نبرة الصوت المعتمدة لدى Gemini TTS رسمياً (مواءمة شخصية تافي مع النبرة المعتمدة لدى Google)
    const mapVoiceName = (voice) => {
      if (!voice || voice.toLowerCase() === 'tavi') {
        return 'Aoede'; // النبرة المعتمدة والدافئة للمساعد الصوتي تافي
      }
      return voice;
    };

    // جلب إعدادات Vertex AI المحفوظة في المتصفح بكافة الهياكل الممكنة
    const getStoredVertexConfig = () => {
      try {
        const raw = localStorage.getItem('vertex_config');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            return {
              project: parsed.project || localStorage.getItem('vertex_project_id') || '',
              region: parsed.region || localStorage.getItem('vertex_region') || 'global',
              key: parsed.key || parsed.token || localStorage.getItem('vertex_key_token') || '',
              token: parsed.token || parsed.key || localStorage.getItem('vertex_key_token') || ''
            };
          }
        }
      } catch(e){}
      return {
        project: localStorage.getItem('vertex_project_id') || '',
        region: localStorage.getItem('vertex_region') || 'global',
        key: localStorage.getItem('vertex_key_token') || '',
        token: localStorage.getItem('vertex_key_token') || ''
      };
    };

    // تشغيل الصوت من Base64 (يدعم WAV و MP3 و PCM 24kHz بدون حظر Autoplay)
    const playBase64Audio = async (base64Data, mimeType = 'audio/mp3', speechId = null) => {
      try {
        initAudio();
        if (speechId !== null && speechId !== activeSpeechId) return;

        // إيقاف أي صوت سابق فوراً
        if (currentAudioSource) {
          try { currentAudioSource.stop(); } catch(e){}
          currentAudioSource = null;
        }
        if (currentHtmlAudio) {
          try { currentHtmlAudio.pause(); currentHtmlAudio.currentTime = 0; } catch(e){}
          currentHtmlAudio = null;
        }

        let audioDataB64 = base64Data;
        let finalMime = mimeType || 'audio/mp3';

        // إذا كانت البيانات PCM خام 16-bit 24kHz، نحولها فوراً إلى WAV قياسي لضمان التشغيل الفوري
        if (finalMime.toLowerCase().includes('pcm') || finalMime.toLowerCase().includes('l16')) {
          audioDataB64 = pcmBase64ToWavBase64(base64Data, 24000);
          finalMime = 'audio/wav';
        }

        const binaryString = atob(audioDataB64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

        let audioBuffer = null;
        try {
          const bufferCopy = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
          audioBuffer = await new Promise((resolve, reject) => {
            audioCtx.decodeAudioData(bufferCopy, resolve, reject);
          });
        } catch (decodeErr) {
          console.warn("audioCtx decodeAudioData fallback to HTML Audio:", decodeErr);
        }

        if (speechId !== null && speechId !== activeSpeechId) return;

        if (audioBuffer) {
          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(audioCtx.destination);
          source.start();
          currentAudioSource = source;
          return;
        }

        const audio = new Audio(`data:${finalMime};base64,${audioDataB64}`);
        currentHtmlAudio = audio;
        await audio.play();
      } catch (e) {
        console.warn("Base64 audio playback failed:", e);
      }
    };

    // القراءة عبر محرك المتصفح كبديل فوري في حال انقطاع الشبكة أو تعذر الـ API مع تفضيل الأصوات الطبيعية
    const speakWithWebSpeech = (text, speechId = null) => {
      if (!('speechSynthesis' in window)) return;
      if (speechId !== null && speechId !== activeSpeechId) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ar-SA';
      utterance.rate = 1.1;
      const voices = window.speechSynthesis.getVoices();
      const arabicVoices = voices.filter(v => v.lang === 'ar-SA' || v.lang === 'ar_SA' || v.lang.startsWith('ar'));
      // تفضيل الأصوات الطبيعية والعصرية إذا كانت متوفرة في النظام (مثل أصوات Natural / Online في Edge و Chrome)
      const naturalVoice = arabicVoices.find(v => /natural|online|neural|shakir|zariyah|tariq/i.test(v.name))
        || arabicVoices.find(v => v.lang === 'ar-SA' || v.lang === 'ar_SA')
        || arabicVoices[0];
      if (naturalVoice) utterance.voice = naturalVoice;
      window.speechSynthesis.speak(utterance);
    };

    // توليد الصوت الذكي بنبرة تافي (Tavi) عبر أحدث نماذج Gemini TTS على Vertex AI و AI Studio
    const speakText = async (text, apiKey = null, voiceEnabled = true, chosenTtsModel = null, activeProvider = null, activeVertexConfig = null, chosenVoice = null) => {
      if (!voiceEnabled || !text) {
        stopAllSpeech();
        return;
      }

      // إلغاء أي قراءة سابقة فوراً لمنع التداخل عند النقر السريع
      stopAllSpeech();
      const currentSpeechId = ++activeSpeechId;
      activeAbortController = new AbortController();
      const abortSignal = activeAbortController.signal;

      const prov = activeProvider || localStorage.getItem('ai_provider') || localStorage.getItem('quiz_ai_provider') || 'gemini';
      const vConfig = activeVertexConfig || getStoredVertexConfig();
      const effectiveKey = (apiKey !== null && apiKey !== undefined) ? apiKey : (localStorage.getItem('gemini_api_key') || '');
      const rawVoice = chosenVoice || localStorage.getItem('gemini_tts_voice') || 'Aoede';
      const actualVoice = mapVoiceName(rawVoice);

      const cacheKey = `${prov}_${actualVoice}_${text}`;
      if (voiceCache[cacheKey]) {
        if (currentSpeechId !== activeSpeechId) return;
        playBase64Audio(voiceCache[cacheKey].data, voiceCache[cacheKey].mimeType, currentSpeechId);
        return;
      }

      // 1. مسار Google Cloud Vertex AI (Gemini TTS المتقدم والحي)
      if (prov === 'vertex') {
        const project = (vConfig.project || '').trim();
        const cred = (vConfig.key || vConfig.token || '').trim();

        if (project && cred) {
          const loc = (vConfig.region && vConfig.region.trim()) ? vConfig.region.trim().toLowerCase() : 'global';
          const host = (loc === 'global') ? 'aiplatform.googleapis.com' : `${loc}-aiplatform.googleapis.com`;
          const isBearer = cred.startsWith('ya29.') || cred.toLowerCase().startsWith('bearer ');
          const cleanToken = cred.replace(/^bearer\s+/i, '');

          let baseModel = chosenTtsModel || localStorage.getItem('gemini_tts_model') || 'gemini-2.5-flash-tts';
          if (baseModel.includes('3.8')) baseModel = 'gemini-2.5-flash-tts';

          const candidateModels = [
            baseModel,
            "gemini-2.5-flash-tts",
            "gemini-3.1-flash-tts-preview",
            "gemini-2.5-flash-lite-preview-tts",
            "gemini-2.5-pro-tts"
          ].filter((m, idx, arr) => m && arr.indexOf(m) === idx);

          let vertexError = null;

          for (const model of candidateModels) {
            if (abortSignal.aborted || currentSpeechId !== activeSpeechId) return;
            try {
              let ttsUrl = `https://${host}/v1beta1/projects/${project}/locations/${loc}/publishers/google/models/${model}:generateContent`;
              const headers = { "Content-Type": "application/json" };
              if (isBearer) {
                headers["Authorization"] = `Bearer ${cleanToken}`;
                headers["x-goog-user-project"] = project;
              } else {
                ttsUrl += (ttsUrl.includes('?') ? '&' : '?') + `key=${encodeURIComponent(cred)}`;
                headers["x-goog-api-key"] = cred;
              }

              const payload = {
                contents: [{
                  role: "user",
                  parts: [{
                    text: text,
                    speech_metadata: {
                      style: "clear and natural in authentic Saudi Najdi accent, crisp and articulate"
                    }
                  }]
                }],
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: {
                    voiceConfig: {
                      prebuiltVoiceConfig: {
                        voiceName: actualVoice
                      }
                    }
                  }
                }
              };

              const res = await fetch(ttsUrl, {
                method: "POST",
                headers,
                body: JSON.stringify(payload),
                signal: abortSignal
              });

              if (currentSpeechId !== activeSpeechId) return;

              if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                vertexError = errData?.error?.message || `HTTP ${res.status}`;
                console.warn(`Vertex TTS warning on ${model}:`, vertexError);
                continue;
              }

              const data = await res.json();
              if (currentSpeechId !== activeSpeechId) return;

              const inlineAudio = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;
              if (inlineAudio?.data) {
                const wavData = pcmBase64ToWavBase64(inlineAudio.data, 24000);
                voiceCache[cacheKey] = { data: wavData, mimeType: 'audio/wav' };
                await playBase64Audio(wavData, 'audio/wav', currentSpeechId);
                return;
              }
            } catch (err) {
              if (err.name === 'AbortError') return;
              vertexError = err.message;
              console.warn(`Vertex TTS fetch exception on ${model}:`, err);
            }
          }

          // مسار إضافي: محاولة عبر Cloud Text-to-Speech API مع محرك Gemini-TTS
          if (isBearer) {
            try {
              const url = 'https://texttospeech.googleapis.com/v1/text:synthesize';
              const payload = {
                input: {
                  prompt: "اقرأ بوضوح وبلهجة سعودية فصيحة ومتقنة:",
                  text: text
                },
                voice: {
                  languageCode: 'ar-EG',
                  name: actualVoice,
                  model_name: 'gemini-2.5-flash-tts'
                },
                audioConfig: { audioEncoding: 'MP3' }
              };
              const res = await fetch(url, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${cleanToken}`,
                  'X-Goog-User-Project': project
                },
                body: JSON.stringify(payload),
                signal: abortSignal
              });
              if (res.ok) {
                const data = await res.json();
                if (data.audioContent) {
                  voiceCache[cacheKey] = { data: data.audioContent, mimeType: 'audio/mp3' };
                  await playBase64Audio(data.audioContent, 'audio/mp3', currentSpeechId);
                  return;
                }
              }
            } catch (cErr) {
              if (cErr.name === 'AbortError') return;
            }
          }

          if (vertexError && window.__reportAppError) {
            window.__reportAppError('Vertex TTS Error', `تعذر توليد صوت تافي من Vertex AI: ${vertexError}. تم التحويل مؤقتاً لصوت المتصفح.`);
          }
        }
      }

      // 2. مسار Google AI Studio (Gemini Flash TTS)
      if (effectiveKey) {
        let baseModel = chosenTtsModel || localStorage.getItem('gemini_tts_model') || 'gemini-3.8-flash-tts';
        const candidateModels = [
          baseModel,
          "gemini-3.8-flash-tts",
          "gemini-3.1-flash-tts-preview",
          "gemini-2.5-flash-preview-tts"
        ].filter((m, idx, arr) => m && arr.indexOf(m) === idx);

        let studioError = null;

        for (const model of candidateModels) {
          if (abortSignal.aborted || currentSpeechId !== activeSpeechId) return;
          try {
            const ttsUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${effectiveKey}`;
            const payload = {
              contents: [{
                role: "user",
                parts: [{
                  text: text,
                  speech_metadata: {
                    style: "clear and slightly fast in authentic Saudi Najdi accent, crisp and articulate"
                  }
                }]
              }],
              generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: {
                  voiceConfig: {
                    prebuiltVoiceConfig: {
                      voiceName: actualVoice
                    }
                  }
                }
              }
            };

            const res = await fetch(ttsUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
              signal: abortSignal
            });

            if (currentSpeechId !== activeSpeechId) return;

            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              studioError = errData?.error?.message || `HTTP ${res.status}`;
              console.warn(`Gemini TTS warning on ${model}:`, studioError);
              continue;
            }

            const data = await res.json();
            if (currentSpeechId !== activeSpeechId) return;

            const inlineAudio = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;
            if (inlineAudio?.data) {
              let finalData = inlineAudio.data;
              let finalMime = inlineAudio.mimeType || 'audio/wav';
              if (finalMime.toLowerCase().includes('pcm') || finalMime.toLowerCase().includes('l16')) {
                finalData = pcmBase64ToWavBase64(finalData, 24000);
                finalMime = 'audio/wav';
              }
              voiceCache[cacheKey] = { data: finalData, mimeType: finalMime };
              await playBase64Audio(finalData, finalMime, currentSpeechId);
              return;
            }
          } catch (err) {
            if (err.name === 'AbortError') return;
            studioError = err.message;
            console.warn(`TTS fetch exception on ${model}:`, err);
          }
        }

        if (studioError && window.__reportAppError) {
          const isSpendCap = /spending cap|spend/i.test(studioError);
          const isQuota = /quota|rate limit|429/i.test(studioError);
          let userFriendlyMsg = `تعذر توليد صوت تافي (${baseModel}): ${studioError}`;
          let alertType = 'TTS Voice Error';
          
          if (isSpendCap) {
            alertType = 'حد الإنفاق في Gemini AI Studio';
            userFriendlyMsg = 'انتقل الصوت إلى صوت المتصفح البديل لأن مشروع Gemini API تجاوز حد الإنفاق الشهري (Spending Cap). يمكنك رفع الحد من ai.studio/spend أو تفعيل Google Cloud Vertex AI في الإعدادات ⚙️.';
          } else if (isQuota) {
            alertType = 'حد الاستهلاك اليومي';
            userFriendlyMsg = 'تم تجاوز حصة الطلبات المجانية لنموذج الصوت الذكي، تم التبديل مؤقتاً لصوت المتصفح البديل.';
          }
          window.__reportAppError(alertType, userFriendlyMsg);
        }
      }

      // 3. مسار صوت المتصفح البديل (Web Speech API) فقط في حال تعذر الـ API
      if (currentSpeechId === activeSpeechId) {
        speakWithWebSpeech(text, currentSpeechId);
      }
    };

    // جلب أحدث نماذج Flash & Pro ونماذج TTS الصوتية ديناميكياً وحياً من API
    const fetchDynamicModels = async (provider, apiKey, vertexConfig = {}) => {
      if (provider === 'vertex') {
        const { project, region, key, token } = vertexConfig;
        if (!project) throw new Error("يرجى إدخال معرف مشروع Google Cloud (Project ID)");
        const loc = (region && region.trim()) ? region.trim().toLowerCase() : 'global';
        const host = (loc === 'global') ? 'aiplatform.googleapis.com' : `${loc}-aiplatform.googleapis.com`;
        const cred = (key || token || '').trim();
        const isBearer = cred.startsWith('ya29.') || cred.toLowerCase().startsWith('bearer ');
        const cleanToken = cred.replace(/^bearer\s+/i, '');

        let list = [];
        try {
          const url = `https://${host}/v1beta1/projects/${project}/locations/${loc}/publishers/google/models${!isBearer && cred ? '?key=' + encodeURIComponent(cred) : ''}`;
          const headers = { "Content-Type": "application/json" };
          if (isBearer) headers["Authorization"] = `Bearer ${cleanToken}`;
          const res = await fetch(url, { headers });
          if (res.ok) {
            const data = await res.json();
            list = (data.models || []).map(m => m.name.split('/').pop());
          }
        } catch (e) {
          console.warn("Could not fetch remote models list for Vertex, using verified defaults:", e);
        }

        const brainModels = list.filter(name => (name.includes('flash') || name.includes('pro')) && !name.includes('tts'));
        const verifiedVertexBrain = ["gemini-3.8-flash", "gemini-2.5-flash", "gemini-2.5-pro"];
        const ttsModels = list.filter(name => name.includes('tts') || name.includes('audio'));
        const verifiedVertexTts = ["gemini-2.5-flash-tts", "gemini-3.1-flash-tts-preview", "gemini-2.5-flash-lite-preview-tts", "gemini-2.5-pro-tts"];
        return {
          brainModels: brainModels.length > 0 ? brainModels : verifiedVertexBrain,
          ttsModels: ttsModels.length > 0 ? ttsModels : verifiedVertexTts
        };
      } else {
        if (!apiKey) throw new Error("يرجى إدخال مفتاح Gemini API لجلب النماذج");
        const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`خطأ في جلب النماذج: ${res.status}`);
        const data = await res.json();
        const rawModels = data.models || [];
        
        // استخراج جميع نماذج generateContent
        const allGenModels = rawModels
          .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
          .map(m => m.name.replace(/^models\//, ''));

        // نماذج العقل وتوليد الأسئلة (Brain models)
        const brainModels = allGenModels
          .filter(name => (name.toLowerCase().includes('flash') || name.toLowerCase().includes('pro')) && !name.toLowerCase().includes('tts'));

        // نماذج الصوت والنطق (TTS models)
        const ttsModels = allGenModels
          .filter(name => name.toLowerCase().includes('tts') || name.toLowerCase().includes('audio'));

        const sortModels = (list) => {
          return list.sort((a, b) => {
            const numA = parseFloat(a.match(/\d+(\.\d+)?/)?.[0] || '0');
            const numB = parseFloat(b.match(/\d+(\.\d+)?/)?.[0] || '0');
            if (numB !== numA) return numB - numA;
            if (a.includes('flash') && !b.includes('flash')) return -1;
            if (!a.includes('flash') && b.includes('flash')) return 1;
            return a.localeCompare(b);
          });
        };

        const finalBrain = sortModels(brainModels);
        const finalTts = sortModels(ttsModels);

        return {
          brainModels: finalBrain.length > 0 ? finalBrain : ["gemini-3.8-flash", "gemini-3.8-pro", "gemini-3.5-flash", "gemini-2.5-flash"],
          ttsModels: finalTts.length > 0 ? finalTts : ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts", "gemini-3.1-flash-tts-preview"]
        };
      }
    };

    // إعداد رابط ونوع طلب الـ API حسب المزود (Gemini vs Vertex AI)
    const getApiConfig = (provider, modelName, apiKey, vertexConfig) => {
      if (provider === 'vertex') {
        const { project, region, key, token } = vertexConfig;
        const loc = (region && region.trim()) ? region.trim().toLowerCase() : 'global';
        const host = (loc === 'global') ? 'aiplatform.googleapis.com' : `${loc}-aiplatform.googleapis.com`;
        const cred = (key || token || '').trim();
        const isBearer = cred.startsWith('ya29.') || cred.toLowerCase().startsWith('bearer ');
        const cleanToken = cred.replace(/^bearer\s+/i, '');

        let url = `https://${host}/v1beta1/projects/${project}/locations/${loc}/publishers/google/models/${modelName}:generateContent`;
        const headers = { "Content-Type": "application/json" };

        if (isBearer) {
          headers["Authorization"] = `Bearer ${cleanToken}`;
          if (project) headers["x-goog-user-project"] = project;
        } else if (cred) {
          url += (url.includes('?') ? '&' : '?') + `key=${encodeURIComponent(cred)}`;
          headers["x-goog-api-key"] = cred;
        }
        return { url, headers };
      }
      return {
        url: `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
        headers: { "Content-Type": "application/json" }
      };
    };

    // توحيد وتنظيم هيكل السؤال سواء كان اختيار من متعدد أو سؤال إجابة قصيرة
    const normalizeQuestion = (q) => {
      if (!q) return null;
      const hasOptions = Array.isArray(q.options) && q.options.length > 1;
      const isShort = q.type === 'short_answer' || (!hasOptions && Boolean(q.expectedAnswer || !q.options?.length));
      return {
        type: isShort ? 'short_answer' : 'mcq',
        text: q.text || '',
        options: Array.isArray(q.options) ? q.options : [],
        correct: typeof q.correct === 'number' ? q.correct : 0,
        expectedAnswer: q.expectedAnswer || (hasOptions && typeof q.correct === 'number' ? q.options[q.correct] : '') || '',
        hint: q.hint || ''
      };
    };

    // فحص ما إذا كان السؤال سؤال إجابة قصيرة (Short Answer)
    const isShortAnswerQuestion = (q) => {
      if (!q) return false;
      return q.type === 'short_answer' || (!Array.isArray(q.options) || q.options.length <= 1);
    };

    // تسوية ومعالجة النصوص العربية للمقارنة الذكية والتقييم المحلي
    const normalizeArabicText = (text) => {
      if (!text) return '';
      return text
        .toString()
        .toLowerCase()
        .replace(/[\u064B-\u065F\u0670]/g, '') // حذف التشكيل والتنوين
        .replace(/[إأآا]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/ؤ/g, 'و')
        .replace(/ئ/g, 'ي')
        .replace(/[^\w\s\u0600-\u06FF]/gi, ' ') // إزالة علامات الترقيم والرموز
        .replace(/\s+/g, ' ')
        .trim();
    };

    // المصحح والمراجع المحلي لإجابات الطلاب القصيرة كبديل سريع في حال عدم توفر اتصال بالـ API
    const localEvaluateShortAnswer = (expectedAnswer, studentAnswer) => {
      const normExpected = normalizeArabicText(expectedAnswer);
      const normStudent = normalizeArabicText(studentAnswer);

      if (!normStudent) {
        return {
          isCorrect: false,
          similarityScore: 0,
          feedback: "لم يتم كتابة إجابة.",
          revisedAnswer: expectedAnswer
        };
      }

      if (normExpected === normStudent || normExpected.includes(normStudent) || normStudent.includes(normExpected)) {
        return {
          isCorrect: true,
          similarityScore: 100,
          feedback: "إجابة عبقرية ومطابقة تماماً للمفهوم المطلوب! 🌟",
          revisedAnswer: expectedAnswer
        };
      }

      const stopWords = new Set(['في', 'من', 'على', 'إلى', 'عن', 'مع', 'هذا', 'هذه', 'تم', 'هو', 'هي', 'أن', 'ان', 'ما', 'لا', 'التي', 'الذي', 'و', 'أو', 'او', 'بسبب', 'لأن', 'لكي']);
      const expectedTokens = normExpected.split(/\s+/).filter(w => w.length > 1 && !stopWords.has(w));
      const studentTokens = normStudent.split(/\s+/).filter(w => w.length > 1 && !stopWords.has(w));

      if (expectedTokens.length === 0) {
        const isCorr = normStudent.length > 0;
        return {
          isCorrect: isCorr,
          similarityScore: isCorr ? 85 : 0,
          feedback: isCorr ? "إجابة مقبولة! 👍" : "الإجابة غير مكتملة.",
          revisedAnswer: expectedAnswer
        };
      }

      let matchCount = 0;
      for (const sToken of studentTokens) {
        const matched = expectedTokens.some(eToken => {
          if (eToken === sToken) return true;
          if (eToken.length >= 3 && sToken.length >= 3) {
            if (eToken.includes(sToken) || sToken.includes(eToken)) return true;
          }
          return false;
        });
        if (matched) matchCount++;
      }

      const recall = matchCount / Math.max(expectedTokens.length, 1);
      const precision = matchCount / Math.max(studentTokens.length, 1);
      const score = Math.round(Math.max(recall * 75 + precision * 25, 0));
      const isCorrect = score >= 50 || recall >= 0.5;

      return {
        isCorrect,
        similarityScore: Math.min(score, 100),
        feedback: isCorrect 
          ? "إجابة رائعة! مفهومك صحيح ودقيق بالرغم من تفاوت الصياغة أو سرعة الكتابة 🌟" 
          : "إجابة تحتاج إلى مزيد من الدقة والتوضيح مقارنة بالإجابة النموذجية 💡",
        revisedAnswer: expectedAnswer
      };
    };

    // مراجعة وتقييم إجابة الطالب عبر نموذج الذكاء الاصطناعي لمعالجة تفاوت الكتابة والأخطاء الإملائية
    const evaluateShortAnswerWithAi = async ({ provider, apiKey, vertexConfig, modelName, questionText, expectedAnswer, studentAnswer, hint }) => {
      if ((provider === 'gemini' && !apiKey) || 
          (provider === 'vertex' && (!vertexConfig.project || (!vertexConfig.key && !vertexConfig.token)))) {
        return localEvaluateShortAnswer(expectedAnswer, studentAnswer);
      }

      try {
        const { url, headers } = getApiConfig(provider, modelName, apiKey, vertexConfig);
        const prompt = `
أنت مصحح ومراجع أكاديمي فائق الذكاء، متخصص في تقييم إجابات الطلاب القصيرة (Short Answer Evaluation).
نظراً لاختلاف أساليب الطلاب في الكتابة وتفاوت الصياغة وسرعة الكتابة على لوحة المفاتيح ووجود أخطاء إملائية وطباعية شائعة (Typing inconsistency / Typos / Synonyms)، مهمتك مراجعة إجابة الطالب بذكاء والتأكد من مطابقتها الدلالية والمعرفية للإجابة النموذجية.

سياق السؤال:
- السؤال: "${questionText}"
- الإجابة النموذجية المرجعية: "${expectedAnswer}"
${hint ? `- مفتاح الحفظ الإرشادي: "${hint}"` : ''}

إجابة الطالب المدخلة:
"${studentAnswer}"

تعليمات المراجعة والتقييم:
1. التسامح مع الأخطاء الطباعية والإملائية: تسامح تماماً مع الفروقات الناتجة عن سرعة الكتابة أو أخطاء لوحة المفاتيح مثل (الهمزات: أ/إ/آ/ا، التاء المربوطة والهاء: ة/ه، الياء والألف المقصورة: ي/ى، التنوين والشدة، ونقصان أو زيادة حرف لا يخل بالمعنى).
2. المرادفات والصياغات البديلة: إذا عبّر الطالب عن نفس المفهوم بمرادفات لغوية أو علمية صحيحة (مثال: التمثيل الضوئي = البناء الضوئي، امتصاص الشمس = أخذ ضوء الشمس، ثاني أكسيد الكربون = CO2، ارتفاع = زيادة)، تُعتبر الإجابة صحيحة فوراً.
3. جوهر الفكرة (Core Concept): إذا أوصل الطالب المعنى الجوهري والمطلوب علمياً، تُعتبر الإجابة صحيحة حتى وإن اختلفت صياغة الجملة أو ترتيب الكلمات.
4. الإجابة الخاطئة: إذا كانت الإجابة تناقض المفهوم العلمي، أو خالية من الكلمات المفتاحية والمعنى المطلوب، أو كانت هراءً أو تخميناً بعيداً، تُعتبر خاطئة.

أرجع فقط كائن JSON صالحاً بالهيكل التالي بدون أي كود أو نصوص إضافية:
{
  "isCorrect": true,
  "similarityScore": 95,
  "feedback": "ملاحظة تشجيعية موجزة (سطر واحد) توضح للطالب مدى دقة إجابته ولماذا تم قبولها أو ما الذي ينقصها بلطف ووضوح",
  "revisedAnswer": "إعادة صياغة إجابة الطالب لغوياً وإملائياً لتكون في أبهى صورة"
}
`;

        const isThinkingModel = modelName.includes('3.8') || modelName.includes('3.') || modelName.includes('extended');
        const generationConfig = { responseMimeType: "application/json" };
        if (isThinkingModel) {
          generationConfig.thinkingConfig = { thinkingLevel: "medium" };
        } else {
          generationConfig.temperature = 0.2;
        }

        const payload = {
          contents: [{ role: "user", parts: [{ text: prompt }] }],
          generationConfig
        };

        const data = await fetchWithRetry(url, {
          method: "POST",
          headers,
          body: JSON.stringify(payload)
        }, 2);

        const parts = data.candidates?.[0]?.content?.parts || [];
        const contentPart = parts.find(p => !p.thought && p.text) || parts[parts.length - 1];
        let responseText = contentPart?.text;
        if (!responseText) throw new Error("لم يصل رد صالح من الذكاء الاصطناعي.");
        responseText = responseText.replace(/^```json\s*/i, '').replace(/\s*```$/, '').trim();
        let parsed = JSON.parse(responseText);
        return {
          isCorrect: Boolean(parsed.isCorrect),
          similarityScore: typeof parsed.similarityScore === 'number' ? parsed.similarityScore : (parsed.isCorrect ? 90 : 30),
          feedback: parsed.feedback || (parsed.isCorrect ? "إجابة صحيحة ومفهومك دقيق وممتاز! 👏" : "الإجابة غير دقيقة وتحتاج إلى مراجعة."),
          revisedAnswer: parsed.revisedAnswer || expectedAnswer
        };
      } catch (e) {
        console.warn("AI evaluation warning, falling back to local evaluator:", e);
        return localEvaluateShortAnswer(expectedAnswer, studentAnswer);
      }
    };

    // المساعد 1: الاستخراج وتوليد مفاتيح الحفظ مع دعم أسئلة الإجابة القصيرة بحسب سياق المادة
    const draftQuizFromMaterial = async ({ provider, apiKey, vertexConfig, modelName, material }) => {
      const { url, headers } = getApiConfig(provider, modelName, apiKey, vertexConfig);
      const prompt = `
        أنت معلم تفاعلي عبقري وخبير في علم الذاكرة وتسهيل الحفظ (Mnemonics) للأطفال والطلاب.
        قم بتحليل المادة المرفقة بدقة فائقة واستخرج منها جميع الأسئلة بلا استثناء مع تحديد نوع كل سؤال بدقة تامة بناءً على سياق المادة والدرس.
        
        التعليمات الصارمة لأنواع الأسئلة (حسب سياق الدرس):
        1. القاعدة التلقائية والأساسية لكامل المادة (الوضع الطبيعي الافتراضي):
           - جميع الشروحات، المفاهيم، الحقائق، التواريخ، التعريفات، والمعلومات العامة في الدرس تُصاغ تلقائياً وطبيعياً كأسئلة اختيار من متعدد عادية (MCQ) بأربعة خيارات واضحة، أو كأسئلة صح/خطأ (Y/N) بخيارات ["صح", "خطأ"].

           - في هذا النوع فقط ("type": "short_answer"): ضع الإجابة النموذجية المباشرة والموجزة في حقل "expectedAnswer"، واجعل "options" مصفوفة فارغة []، و"correct" بقيمة null.
           - إذا لم يكن في سياق المادة أي أسئلة أو أجزاء تستدعي صراحة إجابة مقالية/قصيرة، فيجب أن تكون كافة الأسئلة اختيار من متعدد (mcq) أو صح/خطأ.

        3. أسئلة الاختيار من متعدد وصح/خطأ ("type": "mcq"):
           - للاختيار من متعدد: استخرج 4 خيارات منطقية وضع رقم index الإجابة الصحيحة في "correct" (0 أو 1 أو 2 أو 3)، واكتب الإجابة الصحيحة أيضاً في "expectedAnswer".
           - لصح/خطأ (Y/N): اجعل "options": ["صح", "خطأ"]، وضع index المناسب في "correct" (0 لـ "صح"، 1 لـ "خطأ").

        4. مفتاح الحفظ السحري (hint): لكل سؤال مهما كان نوعه، ابتكر حيلة ذكية أو قصة فكاهية من سطر واحد، تشابه صوتي، أو ربط بصري مع إيموجي يرسخ الإجابة في ذهن الطالب ولا ينساها أبداً.

        يجب أن يكون الرد فقط مصفوفة JSON صالحة بالهيكل التالي بدون أي نصوص خارجية:
        [
          {
            "type": "mcq",
            "text": "نص السؤال العادي (اختيار من متعدد)",
            "options": ["خيار 1", "خيار 2", "خيار 3", "خيار 4"],
            "correct": 0,
            "expectedAnswer": "خيار 1",
            "hint": "مفتاح الحفظ العبقري 🎯💡"
          },
          {
            "type": "mcq",
            "text": "عبارة لتقييم صحتها (صح / خطأ)",
            "options": ["صح", "خطأ"],
            "correct": 0,
            "expectedAnswer": "صح",
            "hint": "مفتاح الحفظ العبقري 🎯💡"
          },
          {
            "type": "short_answer",
            "text": "سؤال علل أو التفسير المقالي الوارد في سياق المادة فقط (علل / اذكر السبب / بم تفسر...)",
            "options": [],
            "correct": null,

    // المساعد 2: التدقيق والمراجعة الأكاديمية الصارمة لكافة أنواع الأسئلة وفق سياق المادة
    const reviseQuizDraft = async ({ provider, apiKey, vertexConfig, modelName, material, draftQuestions }) => {

      let responseText = contentPart?.text;

            const ttsUrl = `https://generativelanguage.googleapis.com/v1beta/models/${baseModel}:generateContent?key=${currentApiKey}`;
            const ttsPayload = {
              contents: [{
                role: "user",
                parts: [{
                  text: "جاهز للتحدي يا بطل!",
                  speech_metadata: {
                    style: "clear and natural in authentic Saudi Najdi accent, crisp and articulate"
                  }
                }]
              }],
              generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: {
                  voiceConfig: {
                    prebuiltVoiceConfig: { voiceName: actualVoice }
                  }
                }
              }
            };
            const res = await fetch(ttsUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(ttsPayload)
            });
            const ttsLatency = Math.round(performance.now() - ttsStart);
            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData?.error?.message || `HTTP ${res.status}: ${res.statusText}`);
            }
            const data = await res.json();
            const inlineAudio = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;
            if (!inlineAudio?.data) {
              throw new Error('لم يرجع النموذج بيانات صوتية صالحة');
            }
            let finalData = inlineAudio.data;
            let finalMime = inlineAudio.mimeType || 'audio/wav';
            if (finalMime.toLowerCase().includes('pcm') || finalMime.toLowerCase().includes('l16')) {
              finalData = pcmBase64ToWavBase64(finalData, 24000);
              finalMime = 'audio/wav';
            }
            results.tts = {
              status: 'success',
              latency: ttsLatency,
              audioData: { data: finalData, mimeType: finalMime },
              message: `متصل بنجاح (${ttsLatency}ms) - صوت تافي (${actualVoice}) جاهز بنقاء فائق!`
            };

            const ttsLatency = Math.round(performance.now() - ttsStart);
            const isSpendCap = err.message && (err.message.includes('spending cap') || err.message.includes('spend'));

            }

        const isWord = file.name.endsWith('.docx') || file.type.includes('wordprocessingml');

        if (!isImage && !isPDF && !isWord) {
          const err = "يرجى رفع ملف بصيغة مدعومة: (صورة JPG/PNG، ملف PDF، أو ملف Word .docx)";
          setErrorMsg(err);
          setErrorAnnouncement({ type: 'File Format Error', message: err });
          return;

        try {
          let materialPayload = null;
          if (isWord) {

              throw new Error("جاري تحميل مكتبة قراءة ملفات Word، حاول مرة أخرى بعد لحظات.");
            }
            const arrayBuffer = await file.arrayBuffer();
            const result = await window.mammoth.extractRawText({ arrayBuffer });
            const text = result.value.trim();

              throw new Error("الملف النصي فارغ. إذا كان يحتوي على صور فقط، يرجى حفظه كـ PDF أو صور.");
            }
            materialPayload = { type: 'text', data: text };
          } else {
            const reader = new FileReader();
            const base64Promise = new Promise((resolve, reject) => {
              reader.onloadend = () => {
                const base64 = reader.result.split(',')[1];
                resolve(base64);
              };
              reader.onerror = reject;
            });
            reader.readAsDataURL(file);
            const base64Data = await base64Promise;
            materialPayload = {
              type: 'file',
              mimeType: file.type || (isPDF ? 'application/pdf' : 'image/jpeg'),
              data: base64Data
            };
          }

          await processMaterial(materialPayload);

          setErrorMsg(e.message || "فشلت قراءة الملف.");

            setIsListeningSpeech(false);
          };
          rec.onend = () => setIsListeningSpeech(false);
          recognitionRef.current = rec;
          rec.start();
        } catch(e) {

                        <button

                      {!isShortAnswerQuestion(questionsData[currentIndex]) ? (

                        className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-md shadow-emerald-100 text-sm flex items-center justify-center gap-1 cursor-pointer"
                      >
                        أنا جاهز للاختبار! <i className="fa-solid fa-play mr-1"></i>
                      </button>
                    ) : (
                      <button 
                        onClick={() => {
                          if (soundEnabled) playClick();
                          const nextIdx = Math.min(questionsData.length - 1, currentIndex + 1);
                          setCurrentIndex(nextIdx);
                          setShowHint(false);
                          speak(questionsData[nextIdx]?.text);
                        }}
                        className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-md shadow-indigo-100 text-sm flex items-center justify-center gap-1 cursor-pointer"
                      >
                        السؤال التالي <i className="fa-solid fa-chevron-left mr-1"></i>
                      </button>
                    )}
                  </div>
                </div>
              )}

              {/* 6. QUIZ MODE */}
              {mode === 'quiz' && shuffledQuestions.length > 0 && (
                <div className="flex flex-col h-full">
                  <div className="flex justify-between items-center mb-4 shrink-0 text-sm font-bold">
                    <div className="flex items-center gap-2">
                      <span className="text-slate-500">سؤال {currentIndex + 1} من {shuffledQuestions.length}</span>
                      <button 
                        onClick={handleStartOverQuiz}
                        className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 transition"
                        title="إعادة بدء الاختبار من السؤال الأول"
                      >
                        <i className="fa-solid fa-rotate-left text-[10px]"></i> البدء من جديد
                      </button>
                    </div>
                    <div className="flex items-center gap-2">
                      {isShortAnswerQuestion(shuffledQuestions[currentIndex]) && (
                        <span className="bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-0.5 rounded-full text-xs font-bold flex items-center gap-1">
                          <i className="fa-solid fa-pen-nib text-[10px]"></i> إجابة قصيرة
                        </span>
                      )}
                      <span className="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">النقاط: {score}</span>
                    </div>
                  </div>
                  
                  <div className="bg-slate-50 border border-slate-200 p-5 rounded-2xl text-right mb-4 shrink-0">
                    <div className="flex items-start justify-between gap-2">
                      <div className="flex-1">
                        {isShortAnswerQuestion(shuffledQuestions[currentIndex]) && (
                          <div className="text-[11px] font-black text-indigo-600 mb-1 flex items-center gap-1">
                            <i className="fa-solid fa-wand-magic-sparkles"></i> سؤال مقالي قصير (تدقيق بالذكاء الاصطناعي مع تسامح التعبير والطباعة)
                          </div>
                        )}
                        <h2 className="text-lg sm:text-xl font-bold text-slate-800 leading-relaxed">
                          {shuffledQuestions[currentIndex].text}
                        </h2>
                      </div>
                      <button 
                        onClick={() => speak(shuffledQuestions[currentIndex].text, true)}
                        className="p-2 rounded-xl text-indigo-600 hover:bg-indigo-100/60 transition flex-shrink-0 cursor-pointer"
                        title="استمع للسؤال"
                      >
                        <i className="fa-solid fa-volume-high"></i>
                      </button>
                    </div>
                  </div>

                  {!isShortAnswerQuestion(shuffledQuestions[currentIndex]) ? (
                    /* واجهة أسئلة الاختيار من متعدد MCQ */
                    <div className="space-y-2.5 flex-1 overflow-y-auto">
                      {shuffledQuestions[currentIndex].options.map((opt, i) => {
                        let btnStyle = "w-full text-right p-3.5 rounded-2xl border-2 font-bold text-base transition-all ";
                        if (!isAnswerChecked) {
                          btnStyle += "bg-white border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 text-slate-700";
                        } else {
                          if (i === shuffledQuestions[currentIndex].correct) {
                            btnStyle += "bg-emerald-50 border-emerald-500 text-emerald-800 scale-[1.01] shadow-md shadow-emerald-100";
                          } else if (i === selectedAnswer) {
                            btnStyle += "bg-red-50 border-red-500 text-red-700";
                          } else {
                            btnStyle += "bg-white border-slate-200 opacity-40 text-slate-400";
                          }
                        }

                        return (
                          <button 
                            key={`${currentIndex}-${i}`}
                            onClick={() => handleAnswerClick(i)}
                            disabled={isAnswerChecked}
                            className={btnStyle}
                          >
                            <span className="inline-block w-7 font-black ml-1 text-slate-400">({getOptionLetter(i)})</span>
                            {opt}
                            {isAnswerChecked && i === shuffledQuestions[currentIndex].correct && (
                              <i className="fa-solid fa-circle-check text-emerald-500 float-left mt-1 text-lg"></i>
                            )}
                            {isAnswerChecked && i === selectedAnswer && i !== shuffledQuestions[currentIndex].correct && (
                              <i className="fa-solid fa-circle-xmark text-red-500 float-left mt-1 text-lg"></i>
                            )}
                          </button>
                        );
                      })}
                    </div>
                  ) : (
                    /* واجهة سؤال الإجابة القصيرة مع التدقيق والمراجعة بالذكاء الاصطناعي */
                    <div className="flex-1 flex flex-col justify-between overflow-y-auto gap-4">
                      {!isAnswerChecked ? (
                        <div className="space-y-3">
                          <div>
                            <label className="block text-xs font-bold text-slate-600 mb-1.5 text-right">
                              اكتب إجابتك هنا بأسلوبك وكلماتك الخاصة:
                            </label>
                            <div className="relative">
                              <textarea
                                rows="3"
                                value={studentShortAnswer}
                                onChange={(e) => setStudentShortAnswer(e.target.value)}
                                placeholder="اكتب إجابتك هنا... (يراعي المصحح الذكي تفاوت التعبير، المرادفات، والأخطاء الإملائية) ✍️"
                                disabled={isEvaluatingShortAnswer}
                                className="w-full p-4 pl-20 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none text-base text-slate-800 font-semibold resize-none transition bg-white shadow-inner"
                                onKeyDown={(e) => {
                                  if (e.key === 'Enter' && !e.shiftKey) {
                                    e.preventDefault();
                                    if (!isEvaluatingShortAnswer && studentShortAnswer.trim()) {
                                      handleShortAnswerSubmit();
                                    }
                                  }
                                }}
                              />
                              <div className="absolute left-3 top-3 flex items-center gap-1.5">
                                <button
                                  type="button"
                                  onClick={toggleVoiceInput}
                                  className={`p-2 rounded-xl text-xs transition cursor-pointer ${
                                    isListeningSpeech ? 'bg-red-500 text-white animate-pulse' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
                                  }`}
                                  title={isListeningSpeech ? 'إيقاف الاستماع' : 'إملاء صوتي'}
                                >
                                  <i className={`fa-solid ${isListeningSpeech ? 'fa-microphone-lines' : 'fa-microphone'}`}></i>
                                </button>
                                {studentShortAnswer && !isEvaluatingShortAnswer && (
                                  <button
                                    type="button"
                                    onClick={() => setStudentShortAnswer('')}
                                    className="p-2 text-slate-400 hover:text-slate-600 rounded-xl hover:bg-slate-100 cursor-pointer"
                                    title="مسح النص"
                                  >
                                    <i className="fa-solid fa-xmark text-xs"></i>
                                  </button>
                                )}
                              </div>
                            </div>
                          </div>

                          <div className="flex items-center justify-between text-xs text-slate-400 font-bold px-1">
                            <span className="flex items-center gap-1 text-slate-500">
                              <i className="fa-solid fa-brain text-indigo-500"></i> مراجعة دلالية بالذكاء الاصطناعي (تسامح مع الأخطاء الطباعية)
                            </span>
                            <span>{studentShortAnswer.length} حرف</span>
                          </div>

                          <button
                            onClick={handleShortAnswerSubmit}
                            disabled={isEvaluatingShortAnswer || !studentShortAnswer.trim()}
                            className="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 disabled:opacity-50 text-white font-black py-3.5 px-6 rounded-2xl transition shadow-lg shadow-indigo-100 flex items-center justify-center gap-2 cursor-pointer text-base"
                          >
                            {isEvaluatingShortAnswer ? (
                              <>
                                <i className="fa-solid fa-spinner fa-spin"></i>
                                <span>جاري مراجعة وتحليل الإجابة بالذكاء الاصطناعي...</span>
                              </>
                            ) : (
                              <>
                                <i className="fa-solid fa-wand-magic-sparkles"></i>
                                <span>إرسال الإجابة للمراجعة الذكية بالـ AI</span>
                              </>
                            )}
                          </button>
                        </div>
                      ) : (
                        /* بطاقة نتيجة المراجعة الذكية للذكاء الاصطناعي */
                        <div className="space-y-3 animate-in fade-in zoom-in-95 duration-200">
                          <div className={`p-4 rounded-2xl border-2 text-right ${
                            shortAnswerEvaluation?.isCorrect 
                              ? 'bg-emerald-50 border-emerald-400 text-emerald-950 shadow-emerald-100' 
                              : 'bg-rose-50 border-rose-300 text-rose-950 shadow-rose-100'
                          } shadow-sm`}>
                            <div className="flex items-center justify-between mb-2">
                              <div className="flex items-center gap-2 font-black text-base">
                                {shortAnswerEvaluation?.isCorrect ? (
                                  <>
                                    <i className="fa-solid fa-circle-check text-emerald-500 text-xl"></i>
                                    <span>إجابة صحيحة ومقبولة دلالياً! 🌟</span>
                                  </>
                                ) : (
                                  <>
                                    <i className="fa-solid fa-circle-xmark text-rose-500 text-xl"></i>
                                    <span>تحتاج إلى تدقيق ومراجعة 💡</span>
                                  </>
                                )}
                              </div>
                              <span className="text-xs font-black px-2.5 py-1 rounded-full bg-white/90 border border-slate-200 text-slate-700 shadow-xs">
                                التطابق الدلالي: {shortAnswerEvaluation?.similarityScore || 0}%
                              </span>
                            </div>

                            {/* تعليق الذكاء الاصطناعي وتوضيحه للتسامح أو النقص */}
                            <div className="bg-white/95 p-3.5 rounded-xl border border-slate-200 mt-2 text-xs sm:text-sm leading-relaxed text-slate-800 font-semibold shadow-xs">
                              <div className="flex items-center gap-1.5 text-indigo-700 text-xs font-black mb-1">
                                <i className="fa-solid fa-robot"></i> تقييم وملاحظة الذكاء الاصطناعي:
                              </div>
                              <p>{shortAnswerEvaluation?.feedback}</p>
                            </div>

                            {/* الإجابة النموذجية المعتمدة */}
                            <div className="mt-2.5 bg-indigo-50/80 p-3 rounded-xl border border-indigo-200 text-xs sm:text-sm text-indigo-950 flex items-start justify-between gap-2">
                              <div className="flex-1">
                                <span className="font-black block text-indigo-700 text-xs mb-0.5">
                                  <i className="fa-solid fa-bullseye ml-1"></i> الإجابة النموذجية المعتمدة:
                                </span>
                                <span className="font-bold">{shuffledQuestions[currentIndex].expectedAnswer}</span>
                              </div>
                              <button
                                onClick={() => speak(shuffledQuestions[currentIndex].expectedAnswer, true)}
                                className="text-indigo-600 hover:text-indigo-800 p-1.5 rounded-lg hover:bg-indigo-100 transition shrink-0 cursor-pointer"
                                title="استمع للإجابة النموذجية"
                              >
                                <i className="fa-solid fa-volume-high text-xs"></i>
                              </button>
                            </div>

                            {/* النص الأصلي للطالب والصياغة السليمة المقترحة */}
                            <div className="mt-2 text-[11px] text-slate-500 font-medium bg-white/60 p-2.5 rounded-lg border border-slate-200/60 space-y-1">
                              <div>
                                <span className="font-bold text-slate-700">إجابتك المدخلة: </span>
                                <span>"{studentShortAnswer}"</span>
                              </div>
                              {shortAnswerEvaluation?.revisedAnswer && shortAnswerEvaluation.revisedAnswer !== studentShortAnswer.trim() && (
                                <div className="text-indigo-700 pt-1 border-t border-slate-200/50">
                                  <span className="font-bold text-indigo-800">الصياغة السليمة المقترحة: </span>
                                  <span>"{shortAnswerEvaluation.revisedAnswer}"</span>
                                </div>
                              )}
                            </div>
                          </div>

                          <button
                            onClick={handleNextQuestion}
                            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-indigo-100 flex items-center justify-center gap-2 cursor-pointer text-sm"
                          >
                            {currentIndex < shuffledQuestions.length - 1 ? (
                              <>
                                <span>السؤال التالي</span>
                                <i className="fa-solid fa-chevron-left"></i>
                              </>
                            ) : (
                              <>
                                <span>عرض النتيجة النهائية 🏆</span>
                                <i className="fa-solid fa-trophy"></i>
                              </>
                            )}
                          </button>
                        </div>
                      )}
                    </div>
                  )}

                  {!isShortAnswerQuestion(shuffledQuestions[currentIndex]) && isAnswerChecked && (
                    <div className={`mt-4 p-3 rounded-xl text-center font-bold text-sm shrink-0 animate-in fade-in duration-200 ${
                      selectedAnswer === shuffledQuestions[currentIndex].correct ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                    }`}>
                      {selectedAnswer === shuffledQuestions[currentIndex].correct ? 'إجابة عبقرية يا بطل! 🎉' : 'لا بأس، تذكر مفتاح الحفظ! 💡'}
                    </div>
                  )}
                </div>
              )}

              {/* 7. RESULT MODE */}
              {mode === 'result' && (
                <div className="text-center space-y-6 my-auto">
                  <div className="w-24 h-24 bg-gradient-to-tr from-yellow-400 to-amber-500 text-white rounded-3xl flex items-center justify-center mx-auto shadow-xl shadow-amber-100 floating-card">
                    <i className="fa-solid fa-trophy text-4xl"></i>
                  </div>
                  
                  <div>
                    <h1 className="text-3xl font-black text-slate-800">
                      {score === (shuffledQuestions.length || questionsData.length) ? 'علامة كاملة يا بطل! 🌟' : score >= ((shuffledQuestions.length || questionsData.length) * 0.7) ? `رائع جداً يا ${playerName}! 👏` : 'أداء جيد وقابل للتطور! 💪'}
                    </h1>
                    <div className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 my-3">
                      {score} / {shuffledQuestions.length || questionsData.length}
                    </div>
                    <p className="text-slate-500 text-sm">
                      نسبتك: {Math.round((score / Math.max(shuffledQuestions.length || questionsData.length, 1)) * 100)}%
                    </p>
                  </div>

                  <div className="space-y-2.5 max-w-sm mx-auto pt-2">
                    {/* مراجعة وإعادة دراسة الأخطاء فقط إذا وُجدت */}
                    {wrongQuestions.length > 0 && (
                      <div className="space-y-2 p-3 bg-amber-50 rounded-2xl border border-amber-200 text-right">
                        <p className="text-xs font-black text-amber-800 flex items-center gap-1.5">
                          <i className="fa-solid fa-triangle-exclamation"></i>
                          لديك {wrongQuestions.length} سؤال بحاجة لتثبيت الذاكرة:
                        </p>
                        <div className="grid grid-cols-2 gap-2">
                          <button 
                            onClick={() => {
                              setQuestionsData(wrongQuestions);
                              setCurrentIndex(0);
                              setShowHint(false);
                              if (timeLeft <= 0) setTimeLeft(15 * 60);
                              setTimerActive(true);
                              setMode('learn');
                              if (soundEnabled) playClick();
                              speak(wrongQuestions[0]?.text);
                            }}
                            className="bg-amber-500 hover:bg-amber-600 text-white py-2.5 px-3 rounded-xl font-bold text-xs transition shadow-sm cursor-pointer"
                          >
                            <i className="fa-solid fa-book-open ml-1"></i> مراجعة أخطائي فقط
                          </button>
                          <button 
                            onClick={() => {
                              setQuestionsData(wrongQuestions);
                              const reshuffled = [...wrongQuestions].sort(() => Math.random() - 0.5);
                              setShuffledQuestions(reshuffled);
                              setCurrentIndex(0);
                              setScore(0);
                              setSelectedAnswer(null);
                              setStudentShortAnswer('');
                              setShortAnswerEvaluation(null);
                              setIsEvaluatingShortAnswer(false);
                              setIsAnswerChecked(false);
                              setTimeLeft(15 * 60);
                              setTimerActive(true);
                              setWrongQuestions([]);
                              setMode('quiz');
                              if (soundEnabled) playClick();
                              speak(reshuffled[0]?.text);
                            }}
                            className="bg-rose-500 hover:bg-rose-600 text-white py-2.5 px-3 rounded-xl font-bold text-xs transition shadow-sm cursor-pointer"
                          >
                            <i className="fa-solid fa-bolt ml-1"></i> اختبار الأخطاء فقط
                          </button>
                        </div>
                      </div>
                    )}

                    <button 
                      onClick={() => {
                        const full = allOriginalQuestions.length ? allOriginalQuestions : questionsData;
                        setQuestionsData(full);
                        setCurrentIndex(0);
                        setShowHint(false);
                        if (timeLeft <= 0) setTimeLeft(15 * 60);
                        setTimerActive(true);
                        setMode('learn');
                        if (soundEnabled) playClick();
                        speak(full[0]?.text);
                      }} 
                      className="w-full flex items-center justify-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-3.5 rounded-2xl font-bold transition text-sm cursor-pointer"
                    >
                      <i className="fa-solid fa-key text-amber-500"></i> إعادة دراسة كل شيء ({allOriginalQuestions.length || questionsData.length} أسئلة)
                    </button>

                    <div className="flex gap-2">
                      <button 
                        onClick={() => {
                          const full = allOriginalQuestions.length ? allOriginalQuestions : questionsData;
                          setQuestionsData(full);
                          const reshuffled = [...full].sort(() => Math.random() - 0.5);
                          setShuffledQuestions(reshuffled);
                          setCurrentIndex(0);
                          setScore(0);
                          setSelectedAnswer(null);
                          setStudentShortAnswer('');
                          setShortAnswerEvaluation(null);
                          setIsEvaluatingShortAnswer(false);
                          setIsAnswerChecked(false);
                          setTimeLeft(15 * 60);
                          setTimerActive(true);
                          setWrongQuestions([]);
                          setMode('quiz');
                          if (soundEnabled) playClick();
                          speak(reshuffled[0]?.text);
                        }} 
                        className="flex-1 flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-2xl font-bold transition shadow-md shadow-emerald-100 text-sm cursor-pointer"
                      >
                        <i className="fa-solid fa-rotate-right"></i> إعادة الاختبار بالكامل
                      </button>
                      <button 
                        onClick={handleRequestNewMaterial} 
                        className="px-5 bg-slate-800 hover:bg-slate-900 text-white py-3.5 rounded-2xl font-bold transition cursor-pointer" 
                        title="رفع درس جديد"
                      >
                        <i className="fa-solid fa-cloud-arrow-up"></i>
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </div>

          {/* Footer بسيط */}
          <footer className="mt-4 text-center text-xs text-slate-400 font-medium">
            المولد الذكي للاختبارات &bull; مدعوم بتقنيات الذكاء الاصطناعي وعلم الذاكرة (Mnemonics)
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
